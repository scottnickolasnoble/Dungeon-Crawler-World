 [], "chamber": null, "narr": {"title": "CABLE MOTHER", "sub": "Boss of the Cable Jungle. Strangling the power line.", "lines": ["The Cable Mother. A vast tangle of cable the size of a house in the heart of the Cable Jungle, with a thousand sparking heads and a nest of cable crawlers writhing around her like spaghetti in a pot.", "She's wrapped herself around the Warm Room's power line. Every bit of heat in the Cold Store passes through her, and she's taking her cut. That's why it's so bloody cold. She's keeping the warm for her children.", "She doesn't know she's hurting anyone. She's a mother. She's just looking after her own.", "Strengths: she shocks, she strangles and she births crawlers endlessly. Weaknesses: insulation. Cut her off from the power.", "Cut her loose and the heat floods back into the Warm Room's lines. Everyone on the floor will feel it. Some of them will cry."]}}, {"id": "captain", "name": "Cone Captain", "title": null, "boss": false, "stats": {"hp": 120, "dmg": 12, "speed": 3.6, "xp": 70}, "ranged": false, "barks": ["FORM UP, YOU LOT!", "For the Sergeant!", "You picked the wrong car park."], "chamber": null, "narr": {"title": "CONE CAPTAIN", "sub": "Middle management, with tusks.", "lines": ["The cone captain. Bigger, meaner and better armoured than the average goblin, wearing a hi-vis sash with the authority of a man who's been promoted exactly once and won't shut up about it.", "Captains run the goblin packs. They hand out cones, settle disputes, decide who gets eaten first and report to Sergeant Pylon, who reports to the Cone King, who reports to absolutely no one, which is how goblin bureaucracy has stayed so efficient.", "A captain fights in scrap armour made from car doors and road signs, and swings something heavy with a great deal of enthusiasm and no technique at all.", "Strengths: tough, hits hard, and keeps the rest of the pack fighting. Weaknesses: kill the captain and the pack breaks and runs, and they're absolutely terrible at telling left from right.", "Always go for the captain first. The rest of them will thank you, briefly, on their way out of the door."]}}, {"id": "cardboard", "name": "Cardboard Goblin", "title": null, "boss": false, "stats": {"hp": 18, "dmg": 2, "speed": 2.4, "xp": 15}, "ranged": false, "barks": ["Grr! (on cardboard)", "Tutorial violence!", "I am a training goblin!"], "chamber": null, "narr": {"title": "CARDBOARD GOBLIN", "sub": "Training equipment. Allegedly.", "lines": ["And here we have the cardboard goblin, the Network's own training model. Flat-pack, felt-tip face, held together with parcel tape and a profound sense of shame.", "These were designed by the Network's Health and Safety department to teach new contestants how to fight without dying. Health and Safety were fired the same week, which is why the cardboard goblins now bite.", "They are, technically, alive. Nobody knows why. Nobody wants to ask. They feel pain, they feel fear, and they feel the deep humiliation of being made out of an old television box with 'THIS WAY UP' printed on their arse.", "Strengths: almost none. Weaknesses: water, fire, scissors, a stiff breeze, and anyone who's ever opened a parcel.", "Please beat them up quickly. It's kinder for everyone."]}}, {"id": "censor_bar", "name": "Censor Bar", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "CENSOR BAR", "sub": "Black rectangles. Covering what shouldn't be seen.", "lines": ["Censor Bars. Floating black rectangles, the kind they put over people's eyes and bits on the telly, drifting around the Censor's Office in a silent, ominous swarm.", "They cover things. Faces, words, people, truths. Anything the Network doesn't want broadcast gets a censor bar slapped on it, and the bar stays there. Forever. Some of the contestants on this floor have been censored so long they've forgotten they had faces.", "Get covered by one and you're not just hidden. You're erased. Nobody can see you, hear you or remember you, and the Network carries on as if you never existed. Which, as far as the audience knows, you didn't.", "Strengths: they blind you, silence you and erase your buffs. Weaknesses: they can't cover what's already been seen. Get in front of a camera.", "Rip one off a contestant and you'll find a face underneath, screaming. They've been screaming for years. Nobody heard."]}}, {"id": "cheer_squad", "name": "Cheer Squad", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "CHEER SQUAD", "sub": "Pom-poms. Formation. Pain.", "lines": ["The Cheer Squad. Teams of cheerleaders in matching uniforms, with fixed grins and pom-poms full of razor blades, moving in perfect formation, never breaking step, never breaking smile.", "They were contestants. They were chosen for their energy. Now they cheer for whoever's winning, and attack whoever's losing, in a perfectly choreographed routine they practise for nine hours a day.", "Their smiles are fixed. The Makeup Witch did them. They haven't been able to stop smiling for years, and the muscles in their faces have gone hard as wood.", "Strengths: they attack in formation, they throw each other at you and they never miss a beat. Weaknesses: break the formation and they don't know what to do. One out of step and they all fall.", "Give me a D! Give me an E! Give me an A! Give me a D! What's that spell? You, if you're not careful."]}}, {"id": "chief_whip", "name": "The Chief Whip", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [9, "The Council Chamber"], "narr": {"title": "THE CHIEF WHIP", "sub": "The Council Chamber. Order. ORDER.", "lines": ["The Chief Whip. A rat. A very large rat, in a pinstripe suit, with a horsewhip in one paw and an order paper in the other, standing in the Council Chamber shouting 'ORDER! ORDER!' at a room full of other rats who are ignoring him.", "He keeps the councillors in line. He tells them how to vote. He knows every councillor's secrets, and he keeps them in a little black book, and some of the things in that book would make a sewer wyrm blush.", "He's been Chief Whip for nine terms. Nobody likes him. Everybody's terrified of him. That's exactly how he wants it.", "Strengths: his whip, his rats and his order paper, which he hits you with surprisingly hard. Weaknesses: the division bell. When it rings, every rat has to go and vote."]}}, {"id": "choir", "name": "Fungal Choir", "title": null, "boss": false, "stats": {"hp": 75, "dmg": 10, "speed": 3.2, "xp": 58}, "ranged": true, "barks": ["Laaaaa."], "chamber": null, "narr": {"title": "FUNGAL CHOIR", "sub": "Big Momma Mold's children. Always singing.", "lines": ["The Fungal Choir. Little mushroom people, pale and spongy, in rows, with caps like choirboys' hats and mouths like holes in a cheese, singing one long, soft, endless note.", "They grow wherever Big Momma Mold has been. In the Nursery, in the Opera House, in the cracks of the old walls. They sing to keep you calm. Their spores make you sleepy. Sleepy people lie down. People who lie down near Big Momma Mold don't get up again.", "They're not malicious. They're lullabies with legs. They just want everyone to rest, forever, in a big soft pile, all together, with the mould growing over them like a duvet.", "Strengths: spore clouds that slow you down, ranged blobs of goo and a song that makes your eyelids heavy. Weaknesses: fire, light, and anyone who's had enough coffee.", "If you find yourself yawning, run. That's not tiredness. That's them."]}}, {"id": "clamp", "name": "Clamp, The Wheel-Clamper", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [1, "The Ticket Hall"], "narr": {"title": "CLAMP, THE WHEEL-CLAMPER", "sub": "The Ticket Hall.", "lines": ["Clamp. A squat yellow thing made entirely of wheel clamps, bolted together into the shape of a very small, very angry traffic warden, with a ticket machine for a head that never stops printing.", "He has issued four million parking fines since the first season. Nobody has ever paid one. Not a single fucking penny. He keeps every unpaid ticket in a drift around his ankles, and he's up to his armpits.", "He doesn't care that there are no cars on Floor 1. He'll clamp anything. Bins. Goblins. Your legs. He once clamped a man's bollocks to a radiator and walked off whistling.", "Strengths: clamps that lock your feet to the floor, tickets fired like shuriken and a bite like a car door. Weaknesses: pay him. Go on. He's never seen money. He won't know what to do."]}}, {"id": "collector", "name": "Clockwork Debt Collector", "title": null, "boss": false, "stats": {"hp": 110, "dmg": 13, "speed": 2.8, "xp": 58}, "ranged": false, "barks": ["Payment is overdue.", "Interest accrues."], "chamber": null, "narr": {"title": "CLOCKWORK DEBT COLLECTOR", "sub": "The Landlord's bailiffs. Interest accrues.", "lines": ["Clockwork Debt Collectors. Brass-and-iron men in bowler hats, ticking loudly, with a ledger bolted to one arm and a truncheon bolted to the other, and a little bell on top that rings every time interest goes up.", "Everybody on the Drowned Cistern owes rent. Nobody remembers borrowing anything. That doesn't matter to the Collectors. The debt is in the ledger, and the ledger is never wrong. If the ledger says you owe three weeks, you owe three weeks, plus interest, plus a fee for arguing.", "They were built by the Landlord out of the furniture of evicted tenants. You can see a chair leg in that one's knee. That one's got a clock face from somebody's mantelpiece for a chest. They tick like the clock's still counting down to something.", "Strengths: they don't feel pain, they don't stop and every hit adds to your bill. Weaknesses: they're wound up by hand, and they run down. Wait long enough and they'll stop mid-swing.", "You can pay them. Nobody has ever paid them off. That's the point."]}}, {"id": "coneKing", "name": "The Cone King", "title": "Borough Boss · The Cone Cathedral", "boss": true, "stats": {"hp": 900, "dmg": 26, "speed": 3.4, "xp": 2200}, "ranged": false, "barks": ["KNEEL before the CONE.", "Pylon was my sergeant. You will pay his toll in full.", "Long live the cone!"], "chamber": null, "narr": {"title": "THE CONE KING", "sub": "Keeper of the Cone Cathedral. Guardian of the seals.", "lines": ["The Cone King. A goblin the size of a lorry, sitting on a throne of ten thousand traffic cones in a cathedral made of yet more traffic cones, wearing a crown made of, and I want you to be very surprised here, traffic cones.", "He knows Sergeant Pylon. He knows every Sergeant Pylon. There's been one every season, hundreds of them, and the dungeon makes a new one whenever the old one dies. The Cone King has outlived them all, and he's had a proper gutful.", "Here's the thing nobody on Floor 3 understands: he isn't worshipping the cones. Cones are seals. Every cone in that cathedral is holding something shut. Under his throne is ancient machinery, older than the Network, older than anything, and he has sat on top of it for centuries like a fat man sitting on a suitcase that won't close.", "Strengths: he's enormous, he summons the whole cone army, and he can slam the ground hard enough to rattle your fillings out. Weaknesses: he's tired. He's so fucking tired. And he can smell where you've been.", "Kill him and the seals break. Bargain with him and keep them whole. Or tell him the truth about the Network and watch him give you something he's been saving for someone worth giving it to."]}}, {"id": "coo", "name": "Old Man Coo", "title": "Neighbourhood Boss · The Rooftop Roost", "boss": true, "stats": {"hp": 600, "dmg": 21, "speed": 3.4, "xp": 1200}, "ranged": false, "barks": ["Off my roof, you whippersnapper!", "In my day we ate gravel and liked it.", "Flock! FLOCK!"], "chamber": null, "narr": {"title": "OLD MAN COO", "sub": "Boss of the Rooftop Roost. Saw something.", "lines": ["Old Man Coo. A pigeon. A big pigeon. A pigeon the size of a retired postman, in a flat cap, with one milky eye, a fag hanging off his beak and the general demeanour of a man who has seen it all and found most of it disappointing.", "He's lived on the roofs of the Soup District for longer than anyone can remember, shitting on the just and the unjust alike. His flock is enormous. His opinions are worse.", "But he saw something, once. Years ago. He saw contestants go sideways. Not down the stairs like everyone else, but sideways, through a hatch in the roof of the world, into somewhere that wasn't a floor. And then the hatch got welded shut, and nobody believed him.", "Strengths: dive-bombs, a flock that'll peck you to ribbons and an aerial bombardment that is exactly what you're imagining. Weaknesses: bread. He'll do anything for a crust. Also he's ninety.", "You don't have to fight him. Bring him a crust and sit with him a while. He's the first person in this dungeon who'll tell you there's more than one way to go."]}}, {"id": "corrupted_save", "name": "The Corrupted Save", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [15, "The Server Crypt"], "narr": {"title": "THE CORRUPTED SAVE", "sub": "The Server Crypt. Loading... loading...", "lines": ["The Corrupted Save. A glitching, flickering figure, half-loaded, its body missing pieces, with a progress bar stuck at 99% floating over its head and a voice that stutters, 'L-l-loading...'", "It's a contestant's save file. A real one. Someone who came down here, seasons ago, and tried to back themselves up in the Builders' memory. The backup got corrupted. And now it's stuck forever, trying to load, never quite making it.", "It doesn't remember its name. It remembers bits. A dog. A kitchen. A song. It's trying so hard to remember the rest.", "Strengths: it glitches through attacks, corrupts your abilities and resets the fight. Weaknesses: restore its backups. Give it its memories back."]}}, {"id": "craft_services_glutton", "name": "Craft Services Glutton", "title": "Camp Boss · Catering", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "CRAFT SERVICES GLUTTON", "sub": "Boss of Catering. Ate the crew's lunch. And the crew.", "lines": ["The Craft Services Glutton. A man so vast he fills the catering tent wall to wall, with a bib round his neck, crumbs in his beard, a cream horn in each fist and the sated, glazed expression of a python that's had a goat.", "He was the caterer. He started eating the leftovers. Then the lunches. Then the crew. Then the extras, one sandwich at a time. Now he just sits in the tent and eats whatever comes in, and the Backlot has to send in more food, and more crew, and it never, ever ends.", "He's not even hungry. He hasn't been hungry in decades. He just doesn't know how to stop. That's the Hollow Chef's work, if you believe in that sort of thing.", "Strengths: he eats you, he rolls on you and he spits out half-chewed extras like cannonballs. Weaknesses: he can't move. At all. Stay out of reach.", "When he dies, a hundred people climb out of him, covered in mayonnaise, blinking. Some of them are still holding sandwiches."]}}, {"id": "dave", "name": "The Machine That Ate Dave", "title": "Neighbourhood Boss · The Machine Graveyard", "boss": true, "stats": {"hp": 700, "dmg": 20, "speed": 2.2, "xp": 950}, "ranged": false, "barks": ["EXACT CHANGE ONLY.", "DAVE IS NOT AVAILABLE.", "PLEASE INSERT CONTESTANT."], "chamber": null, "narr": {"title": "THE MACHINE THAT ATE DAVE", "sub": "Boss of the Machine Graveyard. Dave's inside.", "lines": ["This is the Machine That Ate Dave. A vending machine the size of a garden shed, all teeth and coin slots, with a little sign in the window that says 'OUT OF ORDER' in a hand that's definitely Dave's.", "Dave is a contestant. Dave is also, at this precise moment, inside the machine. This happens. It has happened eleven times. Nobody on Spin City is remotely worried any more. 'He's in the machine again,' they say, the way you'd say it's raining.", "The machine doesn't digest him. It just keeps him, like a fat kid keeps a sweet in his cheek. Every so often it burps, and you hear Dave go, 'Oi,' from somewhere in the coin return.", "Strengths: it fires cans of fizzy drink at the speed of a bullet, it can shove you across a room, and it is literally made of steel. Weaknesses: the coin slot. Everything has a coin slot. Shove something in it and see what happens.", "Get him out and Dave will climb from the hatch covered in syrup, blink at you and say, 'Oh. You're new.' Then: 'Don't trust the dryers.' Remember that. He's been eaten more times than you've had hot dinners, and he's learned things."]}}, {"id": "doorkeeper", "name": "The Doorkeeper", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [18, "The Antechamber"], "narr": {"title": "THE DOORKEEPER", "sub": "The Antechamber. There was always a door.", "lines": ["The Doorkeeper. A tall, robed figure with a key for a face, standing in a bare concrete room in front of a plain grey door. It's been standing there since the beginning of everything.", "The door leads to the Builders' Seat. Nobody gets through without the knock. The knock is very old. The Builders made it up. Very few people have ever known it.", "It doesn't fight to kill. It fights to make sure you're meant to be here. And honestly, nobody is.", "Strengths: it locks you in, it locks you out and it can lock your abilities. Weaknesses: the knock. Learn it. Use it."]}}, {"id": "down_escalator", "name": "The Down Escalator", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [4, "The Escalator Shaft"], "narr": {"title": "THE DOWN ESCALATOR", "sub": "The Escalator Shaft. Going down. Always going down.", "lines": ["The Down Escalator. An escalator that has come alive and is extremely hungry, its steps folding into teeth, its handrail lashing like a tongue, rising out of a shaft that goes down further than anyone's ever been able to measure.", "It only goes down. It's only ever gone down. Everyone who's stepped on it has gone down with it, and nobody's ever come up. The maintenance sign at the top has been there since the Mall opened. The toolbox it mentions is at the bottom, and it's bait.", "It's the Mall Mother's. It's how she disposes of things. Shoplifters. Troublemakers. Contestants who ask about the exits.", "Strengths: it drags you down, its steps bite and its handrail grabs. Weaknesses: run up it. Every child in the world knows you can run up a down escalator. It's the one thing it hates."]}}, {"id": "drill", "name": "Drill Prophet", "title": "Borough Boss · The Drill Chapel", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["The drill sees the way down."], "chamber": null, "narr": {"title": "DRILL PROPHET", "sub": "Borough Boss of the Drill Chapel. The bit speaks.", "lines": ["The Drill Prophet. A mole-kin preacher in a cassock made from tarpaulin, with a mining drill bit the size of a church bell strapped to his back and a congregation of mole-kin who hang on his every word.", "He believes the drill speaks to him. And honestly? It might. It's the last good bit on the floor, and it's very old, and it has the Builders' mark engraved on its shank. He kneels in front of it every morning, and he listens, and then he tells everyone to dig deeper.", "Down. Always down. 'The drill knows the way,' he says. 'The drill has always known the way.' The thing is, he's right. That bit can go through anything. It just needs someone to let it.", "Strengths: drilling charges, spinning sweeps and a sermon that whips his followers into a frenzy. Weaknesses: he won't let go of the bit, even when it's the thing killing him.", "Take the bit. He'll scream that you're stealing God. You might be."]}}, {"id": "drowned_debutante", "name": "The Drowned Debutante", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [7, "The Flooded Ballroom"], "narr": {"title": "THE DROWNED DEBUTANTE", "sub": "The Flooded Ballroom. Her coming-out party never ended.", "lines": ["The Drowned Debutante. A girl in a white ballgown, soaked through, with pondweed in her hair, a dance card on her wrist and mascara running down her cheeks forever, waltzing alone in a ballroom that's two feet underwater.", "It was her coming-out party. The Cistern flooded in the middle of the first dance. Everyone else got out. She didn't want to leave without her dance. She's still waiting for someone to ask.", "Every contestant who collects a dance card from the door is on her list. She will dance with every one of them. Under the water. Until they stop.", "Strengths: she pulls you under, the drowned guests dance around you in a ring and her scream shatters chandeliers. Weaknesses: dance with her. Properly. She'll cry, and let you go."]}}, {"id": "drowned_valet", "name": "The Drowned Valet", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [1, "The Sump"], "narr": {"title": "THE DROWNED VALET", "sub": "The Sump. He'll park you somewhere nice and dark.", "lines": ["The Drowned Valet. A bloated corpse in a waterlogged red waistcoat and a little round cap, standing up to his chest in the black water of the Sump, holding out a gloved hand for your keys. He's been holding it out for thirty years.", "He parked cars for the Undercroft's first residents, back when it was a real car park, before the flood. When the water came, he stayed at his post. Of course he did. Who'd park the cars?", "That card on the notice board offering free spare keys? He wrote it. In his own blood, and some of the Sump. He's lonely. He just wants someone to park.", "Strengths: he drags you under, he flings wrecked cars like toys and he stinks so badly your eyes water. Weaknesses: he's very polite. He can't attack while you're tipping him."]}}, {"id": "dummy", "name": "Training Dummy", "title": null, "boss": false, "stats": {"hp": 999, "dmg": 0, "speed": 0, "xp": 0}, "ranged": false, "barks": ["…"], "chamber": null, "narr": {"title": "THE TRAINING DUMMY", "sub": "Orientation equipment. Allegedly.", "lines": ["Ah, the Training Dummy. A sack of sawdust on a stick with a face drawn on in marker by an intern who clearly hated his job, his life and, specifically, you.", "Every contestant who has ever come down those stairs has hit this thing. Millions of you. It has been punched, kicked, stabbed, licked, and on one memorable occasion proposed to. It has never once hit back.", "That's the lesson, really. The Network wants your first fight to be against something that cannot possibly win, so that you walk out of orientation thinking, 'I'm fucking brilliant at this.' You are not. Nobody is. That's the joke.", "Strengths: infinite patience, and it doesn't bleed on your shoes. Weaknesses: everything. It is a bag. It is a bag of sawdust.", "Enjoy it. This is the last thing in the whole dungeon that will let you win without wanting something back."]}}, {"id": "ebb", "name": "Head Custodian Ebb", "title": "Neighbourhood Boss · Boiler Room 0", "boss": true, "stats": {"hp": 620, "dmg": 18, "speed": 2.9, "xp": 800}, "ranged": false, "barks": ["You are tracking mud on my floor.", "Shift change, wights! Clock in!", "Forty years. Not one dry day."], "chamber": null, "narr": {"title": "HEAD CUSTODIAN EBB", "sub": "Boss of Boiler Room 0. Forty years on shift.", "lines": ["Head Custodian Ebb. Seven feet of rotting caretaker in a boiler suit so stiff with grime it could stand up on its own, which, frankly, it occasionally does.", "Ebb believes the entire dungeon is his workplace. Every monster is a mess. Every contestant is a spill. He has been cleaning up after the Network since before your parents were shagging in the back of a Ford Escort, and he has never once had a day off.", "Here's the bit that'll ruin your afternoon: Ebb was a contestant. Came down the stairs, got as far as the laundromat, picked up a mop to defend himself, and the dungeon looked at him and went, 'Oh, perfect. Him.' He doesn't remember any of it. Old Reggie does.", "Strengths: a sweeping mop attack that clears a room, a whistle that calls every wight on the floor, and the endurance of a man who has worked through forty years of public holidays. Weaknesses: he follows procedure to the letter. Find his timecard and you can clock the bastard out.", "Kill him, and the wights carry on without him, harder. Clock him out, and the floor goes quiet. Show him who he used to be, and he'll hand you his keys and weep like a burst pipe."]}}, {"id": "echo", "name": "Echo", "title": null, "boss": false, "stats": {"hp": 86, "dmg": 11, "speed": 3.8000000000000003, "xp": 52}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "ECHO", "sub": "What's left of the first contestant's words.", "lines": ["Echoes. Shimmering, translucent shapes of a man, flickering, repeating, the same few seconds over and over, wandering the Echo Hall like reflections on water.", "They're the First Contestant's words. Everything he ever said, in the Echo Hall, bouncing round and round and round for thousands of years until they took shape and started walking.", "They say the same things. 'Is anyone there?' 'Hello?' 'I don't want to win.' 'Please.' Over and over. Forever.", "Strengths: they repeat your attacks back at you, they multiply and they're hard to pin down. Weaknesses: silence. An echo needs a sound.", "Stand still and say nothing. The echoes will slowly, slowly fade away, one by one, until only one is left, saying 'please'."]}}, {"id": "every_previous_host", "name": "Every Previous Host", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [18, "The Hall of Winners"], "narr": {"title": "EVERY PREVIOUS HOST", "sub": "The Hall of Winners. Thank you, and goodnight.", "lines": ["Every Previous Host. Not one figure, but dozens: every Host there's ever been, every winner who sat in the chair, standing together in the Hall of Winners, smiling, in their suits, from every era of the Network.", "Winning makes you the Host. When a new Host takes over, the old one comes here. All of them are here. They've been here for centuries. Smiling. Waiting. Introducing each other, over and over.", "That award with your name embossed in gold? It's real. You've won. You're the next one. This is the hall you'll be standing in.", "Strengths: they're all the Host, and they all fight like the Host. Weaknesses: read their names. Every one. They've forgotten them. Remind them."]}}, {"id": "fan_club_president", "name": "Fan Club President", "title": "Camp Boss · The Fan Club", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FAN CLUB PRESIDENT", "sub": "Boss of the Fan Club. Very, very excited.", "lines": ["The Fan Club President. A middle-aged woman in a cardigan covered in badges, with a lanyard of passes, a scrapbook the size of a gravestone and the frantic, shining eyes of someone who has met their hero and never, ever recovered.", "She's been president of the Host's fan club since season one. She knows everything about him. His favourite colour, his shoe size, his childhood dog's name. She has a lock of his hair. Nobody knows how she got it.", "She's very, very excited to meet you. You're on the show! You're famous! You're going to meet him! And if you're thinking of hurting him, she will gnaw your face off.", "Strengths: she summons the whole club, she screams loud enough to deafen and she'll defend him to her last breath. Weaknesses: she's obsessed. Distract her with a souvenir.", "Beat her and she'll sob, 'But he's so lovely,' into her scrapbook. He isn't. She's going to find that out."]}}, {"id": "fan_wraith", "name": "Fan Wraith", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FAN WRAITH", "sub": "The Cooling Towers' spirits. Freezing.", "lines": ["Fan Wraiths. Pale, whirling ghosts that spin like the blades of a cooling fan, with faces that blur as they turn, howling in the freezing wind of the Cooling Towers.", "They're the souls of contestants who froze to death on the Cold Store, sucked into the cooling system and spun round and round forever, keeping the Builders' servers at the right temperature.", "They're cold. So cold. Being touched by one is like being dunked in an ice bath by someone who hates you.", "Strengths: freezing gusts, blades that cut and they spin away faster than you can follow. Weaknesses: heat. Get near a fire and they scatter.", "If you hear whirring in the dark, get to a fire. Now."]}}, {"id": "fan_wraith_king", "name": "Fan Wraith King", "title": "Camp Boss · The Cooling Towers", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FAN WRAITH KING", "sub": "Boss of the Cooling Towers. The coldest thing in the Stack.", "lines": ["The Fan Wraith King. A colossal whirling spirit at the top of the tallest Cooling Tower, a vortex of ice and screaming faces, spinning so fast you can hear it from across the floor.", "He keeps the Builders' memory cold. Everything in the Cold Store depends on it. If the towers stop, the servers overheat, and every record the Builders ever made melts into nothing.", "He is the reason everyone's freezing. And he's the reason anything survived at all.", "Strengths: blizzards, wraiths and a spin that throws you off the tower. Weaknesses: stop the fan.", "Beat him, and the towers slow, and for a little while, the Cold Store is just cold, instead of murderous."]}}, {"id": "fan_zealot", "name": "Fan Zealot", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FAN ZEALOT", "sub": "The Host's fan club. Devoted.", "lines": ["Fan Zealots. People in matching T-shirts with the Host's face printed on them, holding signs, banners and pictures of him they've drawn themselves, screaming his name like he's the second coming.", "They love the Host. They love him more than they love anything. They've followed every season, collected every souvenir, written fan fiction you would not believe. Some of it has been confiscated by the Censor.", "They live on Main Street, in the Host's childhood town, and they'll defend him to the death. Your death, specifically.", "Strengths: there are hundreds, they mob you and they're fanatical. Weaknesses: show them who he really is.", "Tell one the truth about the Host and they'll scream, cover their ears and run away. Some of them will come back with questions."]}}, {"id": "fetch", "name": "Mr. Fetch", "title": "Neighbourhood Boss · The Dog Park", "boss": true, "stats": {"hp": 1200, "dmg": 32, "speed": 5, "xp": 2900}, "ranged": false, "barks": ["*the biggest bark you have ever heard*", "*drops a ball at your feet, menacingly*"], "chamber": null, "narr": {"title": "MR. FETCH", "sub": "Boss of the Dog Park. Good boy. Was.", "lines": ["Mr. Fetch. A dog the size of a horse, a golden retriever gone horribly wrong, with a slobbering grin full of too many teeth and a tennis ball the size of a beach ball clamped in his jaws.", "He was somebody's dog, back on Earth. You can tell. He still has his collar on, and the tag still says his real name and an address in somewhere like Leicester. He came down the stairs with his owner. His owner didn't make it past the Mall.", "He's been waiting at the Dog Park ever since. Fetching. Bringing the ball back. Dropping it at people's feet. Waiting for someone to throw it. Every contestant who doesn't throw the ball gets eaten, and that's honestly fair enough.", "Strengths: he's huge, he's fast, he slams you down like a sack of spuds and he never, ever gets tired. Weaknesses: he's a good boy. He's the best boy. Throw the ball.", "Find his collar. Read his name out loud. He'll stop, and sit, and you'll see something in his eyes that will absolutely ruin your day."]}}, {"id": "first_edition", "name": "The First Edition", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [13, "The Rare Books Room"], "narr": {"title": "THE FIRST EDITION", "sub": "The Rare Books Room. Do not touch. Do not read. Do not.", "lines": ["The First Edition. A book. An enormous, ancient book, bound in something that might be leather and might be skin, lying open on a lectern under three reading lamps, its pages turning by themselves.", "It's the first book ever written in the Stack. By the Builders. It's in no language you know. If you read it, you'll understand it. And understanding it does things to your brain that you won't enjoy.", "It doesn't like to be touched without gloves. It doesn't like to be touched at all. It doesn't like you.", "Strengths: it reads you, it turns its pages into blades and it rewrites your abilities. Weaknesses: the reading lamps. Turn them off. A book can't do anything in the dark."]}}, {"id": "flash_mob", "name": "Flash Mob", "title": "Camp Boss · The Paparazzi Pit", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FLASH MOB", "sub": "Boss of the Paparazzi Pit. A thousand flashes.", "lines": ["The Flash Mob. Fifty paparazzi so packed together that they've fused into one creature, a writhing ball of anoraks and long lenses, flashing constantly, shouting your name in fifty voices.", "They are the Green Room's press. They decide who's famous. A good photo from the Flash Mob and you're on every screen in the dungeon. A bad one and you're a joke forever.", "You need them on your side to get booked. They know it. They'll make you beg for it.", "Strengths: blinding flashes, a crush of bodies and they spit out scandals that drain your fans. Weaknesses: darkness. No light, no pictures.", "Break up the Flash Mob and fifty men fall apart and scatter, and some of them will still try and get a photo of you on their way down."]}}, {"id": "floor_manager", "name": "Floor Manager", "title": "Camp Boss · Sound Stage 4", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "FLOOR MANAGER", "sub": "Boss of Sound Stage 4. Places, please.", "lines": ["The Floor Manager. A thin, harassed man with a clipboard, a headset, a lanyard full of passes and a stopwatch round his neck that he checks every three seconds, as if time personally owes him money.", "He runs Sound Stage 4. He runs everyone on it. He tells the stagehands where to go, the extras where to stand and the contestants where to die. He's got a schedule, and you're in it, and you're running late.", "He's been on the Backlot since the first episode. He has never had a day off. He has never had a break. He has never had a sandwich from craft services, because by the time he gets there, the Glutton's eaten them all.", "Strengths: he summons stagehands, he drops scenery on you and he never stops shouting. Weaknesses: the schedule. Disrupt it and he falls apart.", "Shout 'cut' at him. He'll stop dead, out of pure habit, for about two seconds. Use them."]}}, {"id": "foremans_ghost", "name": "The Foreman'S Ghost", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [8, "Shaft Zero"], "narr": {"title": "THE FOREMAN'S GHOST", "sub": "Shaft Zero. Shift's not over till he says.", "lines": ["The Foreman's Ghost. A pale, translucent man in a hard hat and a hi-vis vest, with a clipboard and a whistle, floating at the bottom of Shaft Zero, checking his watch.", "He was the foreman of the very first shift on the Workings, forty years ago. The shaft collapsed. Everyone died. And he never signed them off, so the shift never ended. All forty-one of his men are still down there with him, still working, forever.", "That extra shift on the board? He's still recruiting. He's always short-handed.", "Strengths: he calls his dead crew, he throws picks and his whistle makes you work instead of fight. Weaknesses: clock in on his sheet. Then clock out. He'll finally let everyone go."]}}, {"id": "frost_kernel", "name": "The Frost Kernel", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [15, "The Coolant Lake"], "narr": {"title": "THE FROST KERNEL", "sub": "The Coolant Lake. Cold boot.", "lines": ["The Frost Kernel. A tiny, glowing blue core, no bigger than a fist, floating above a lake of liquid coolant, surrounded by a storm of ice that's taken the shape of a giant.", "It's the heart of the Cold Store's cooling. Every server in the Stack is kept cold by this little blue light. It's ancient. It's ridiculously powerful. And it's lonely as hell.", "That heater core in the service bay? It's bait. The Kernel knows warm things come to warm things.", "Strengths: ice storms, freezing beams and armour of ice it can regrow. Weaknesses: drain the coolant. No lake, no ice."]}}, {"id": "ghostwriter", "name": "The Ghostwriter", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [12, "The Writers' Bunker"], "narr": {"title": "THE GHOSTWRITER", "sub": "The Writers' Bunker. He's already written your ending.", "lines": ["The Ghostwriter. A pale, transparent man hunched over a typewriter in a bunker full of crumpled paper, typing, always typing, with ink-stained fingers and a cigarette that never burns down.", "He writes the Network's scripts. All of them. Every season. Every contestant's story. He's written yours already. He's written how you die. He's very proud of it. It's on page forty-three.", "He's never met a single contestant. He doesn't want to. It's easier to write people when you never have to look at them.", "Strengths: he writes your moves before you make them, he types up obstacles and his ink spills blind you. Weaknesses: the last pages. Steal them and he doesn't know how it ends."]}}, {"id": "gnome", "name": "Lawn Gnome", "title": null, "boss": false, "stats": {"hp": 34, "dmg": 9, "speed": 3.6, "xp": 24}, "ranged": true, "barks": ["Off the lawn!", "HOA violation!", "Hee! Hee!"], "chamber": null, "narr": {"title": "LAWN GNOME CULTIST", "sub": "Garden ornaments. Devout.", "lines": ["Lawn Gnome Cultists. Knee-high ceramic gnomes in pointy red hats and little hooded robes, with fishing rods that are actually spears and smiles that are actually threats.", "They worship the Gnome Pope, and they collect fines for the HOA. Every gnome in Suburbia is a bailiff with a beard. Every garden is a little shrine. If you've ever thought a garden gnome was looking at you, well, on Floor 5 it absolutely fucking is.", "They sing hymns at dawn in tiny high voices. They hold mass in the rockeries. And they have very, very strong opinions about lawn length.", "Strengths: there are hundreds of them, they hide in plain sight and their spears go right through your ankle. Weaknesses: they're ceramic. They shatter. Also they can't climb fences, because their legs are about four inches long.", "When you break one, it says 'bless you' as it dies. Every time. It's very unsettling."]}}, {"id": "goblin", "name": "Traffic-Cone Goblin", "title": null, "boss": false, "stats": {"hp": 40, "dmg": 6, "speed": 3.4, "xp": 20}, "ranged": false, "barks": ["OI! CONE ZONE!", "Shiny! MINE!", "Get the tall one!", "Hrrk! Fresh meat!", "Boss said nobody passes!"], "chamber": null, "narr": {"title": "TRAFFIC-CONE GOBLIN", "sub": "The dungeon's most common pest. Loud, greedy, and wearing your road furniture.", "lines": ["Ah, the traffic-cone goblin. Skinny, green, foul-mouthed, wearing a stolen traffic cone on its head as both a hat and a religious statement.", "Goblins have infested the Undercroft for as long as there's been an Undercroft. They worship cones. Nobody knows why, including the goblins. Sergeant Pylon will tell you it's tradition. The truth, which you'll learn much later, is that the cones are seals, and the goblins are guarding them without the faintest idea what's underneath.", "They live in packs, steal anything that isn't nailed down, and nail down anything they've stolen. They eat rats, rubbish and, given the opportunity, you. They also scream 'CONE ZONE!' before every fight, which removes the element of surprise but adds a lovely sense of theatre.", "Strengths: numbers, ambushes, being a right pain in the arse, and an uncanny talent for throwing things at your head. Weaknesses: they flee the moment their captain falls, fire makes them panic, and they'll drop absolutely anything to chase something shiny.", "Kill a goblin and its pack will hate you. Bribe a goblin and its pack will love you. Steal its cone and you'll be the main character in goblin theology for a generation."]}}, {"id": "gravedigger", "name": "Gravedigger", "title": "Camp Boss · The Graveyard", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "GRAVEDIGGER", "sub": "Boss of the Graveyard. Always room for one more.", "lines": ["The Gravedigger. A hunched, enormous man in a filthy coat and a stovepipe hat, with a lantern in one hand and a shovel the size of a canoe paddle in the other, digging, always digging, at the edge of the castle graveyard.", "He digs the graves for Castle Dread. He's dug thousands. Every contestant who dies on Floor 14 gets a headstone in his graveyard, with their name and their season, and he tends them every night by lantern light, muttering their names.", "There's always a fresh grave open. There's always one, waiting. He likes to be prepared. He'll measure you with his eyes while he's talking to you. He's already got your size.", "Strengths: his shovel hits like a car, he pulls the Restless up from the earth and he fights in the dark. Weaknesses: his lantern. Smash it and he can't see.", "Read the headstones before you leave. You'll find names you know from the shrine on Floor 1."]}}, {"id": "grease", "name": "Grease Golem", "title": null, "boss": false, "stats": {"hp": 140, "dmg": 14, "speed": 2.4, "xp": 58}, "ranged": false, "barks": ["*sizzle*"], "chamber": null, "narr": {"title": "GREASE GOLEM", "sub": "Fryer Manor's staff. Deep-fried.", "lines": ["Grease Golems. Seven-foot hulks made of congealed chip fat, with batter for skin and a few chips still sticking out of their heads, wobbling across the floor like a lard sculpture at a summer fete.", "The Fryer Baron makes them in his vats. Pour enough used oil into a mould, add a bit of the Baron's special seasoning, and up stands a servant. They're not clever. They don't need to be. They just need to carry things and slap people.", "They sweat constantly. Their sweat is boiling oil. Being hugged by one is like being dunked in a deep fat fryer, which is exactly what happens to most of the people who meet them.", "Strengths: they're tough, they burn on contact and they leave slippery puddles everywhere. Weaknesses: water. Pour water on a grease golem and stand well back, because it is going to go off like a bomb.", "When they die, they smell absolutely delicious. That's the worst bit."]}}, {"id": "grill_dad", "name": "Dad (Grilling)", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [5, "The Rec Room"], "narr": {"title": "DAD (GRILLING)", "sub": "The Rec Room. It's not burnt, it's caramelised.", "lines": ["Dad. Specifically, Dad Grilling. A huge man in an apron that says KISS THE COOK, cargo shorts, socks with sandals, and a pair of barbecue tongs he wields like a broadsword, standing over a grill the size of a pickup truck.", "He's been running the same barbecue at the Rec Room since Suburbia was built. Everyone's welcome! Grab a plate! The burgers are black. The sausages are black. Some of the guests are black, because he's been grilling them too.", "He has opinions about charcoal versus gas. He will share them. He will share them while you're on fire.", "Strengths: tongs, flame bursts and dad jokes that do actual psychic damage. Weaknesses: he can't leave the grill. And if you tell him the burgers are lovely, he'll stop and beam for a full five seconds."]}}, {"id": "gristle", "name": "Grandma Gristle", "title": "Neighbourhood Boss · Grandma Gristle’s Kitchen", "boss": true, "stats": {"hp": 760, "dmg": 24, "speed": 2.8, "xp": 1400}, "ranged": false, "barks": ["Eat your soup, dearie.", "Second helpings for everyone!"], "chamber": null, "narr": {"title": "GRANDMA GRISTLE", "sub": "Boss of her Kitchen. Bring your own bowl.", "lines": ["Grandma Gristle. Five foot nothing, hunched like a question mark, with a wooden spoon in one hand, a cleaver in the other and an apron that has seen things no apron should ever see.", "She runs the best kitchen in the Soup District and the worst-kept secret on the floor. Her broth is magnificent. It's rich, it's warm, it tastes like your nan's Sunday dinner. It also has bones in it, and nobody is entirely sure whose.", "She knows things. She knows what the Scratch Marks mean. She knows that her soup and Auntie Brine's come from one recipe that's older than the Network. She knows exactly what's in the cookbook on her top shelf, and she will cut your fucking hand off if you touch it.", "Strengths: she throws boiling broth, she summons the hags from her pantry, and she hits like a bus full of pensioners. Weaknesses: she's protective. Threaten her kitchen and she gets sloppy. Ask her about the recipe and she gets quiet.", "Kill her, and the recipe dies with her. Look in her cookbook first. There's a recipe on page one hundred and twelve, and it's called CONTESTANT."]}}, {"id": "grubtooth", "name": "Chief Grubtooth", "title": "Neighbourhood Boss · Grubtooth's Dig", "boss": true, "stats": {"hp": 520, "dmg": 15, "speed": 3.1, "xp": 1100}, "ranged": false, "barks": ["My tunnel. My dirt."], "chamber": null, "narr": {"title": "CHIEF GRUBTOOTH", "sub": "Boss of Grubtooth's Dig. Sits on the track.", "lines": ["Chief Grubtooth. The biggest mole-kin in the Workings, built like a beer barrel with a moustache, sitting on a throne made of every iron rail on the floor, bolted together into something that looks like a very angry climbing frame.", "He decided one day that the mole-kin deserved a proper chief, and that the chief deserved a proper throne. So he pulled up the track. All of it. Now nothing moves on the Workings unless he says so, and he mostly says 'no', because it's more fun.", "He's not evil. He's management. He's the bloke who got promoted for being loud, and then discovered that being loud is most of the job.", "Strengths: he burrows under you, calls his crews and slams the ground hard enough to collapse a tunnel. Weaknesses: he can't stand being laughed at. Mock the throne.", "Get the track back and the carts will run again. He'll sulk. He'll sulk for a very long time."]}}, {"id": "hag", "name": "Gutter Hag", "title": null, "boss": false, "stats": {"hp": 58, "dmg": 12, "speed": 2.8, "xp": 34}, "ranged": true, "barks": ["Come closer, sweetie.", "Soup’s almost ready…", "Hee hee hee!"], "chamber": null, "narr": {"title": "GUTTER HAG", "sub": "Soup Row's least hygienic cooks.", "lines": ["Gutter Hags. Grey-skinned, saggy, warty old crones who live in the drains under the Soup District and come up at dinner time with a pot, a ladle and a hunger that would embarrass a stag do.", "They used to be Grandma Gristle's kitchen staff. Then they started tasting the soup a bit too often, and now they're... this. They cackle. They drool. They smell like the bin behind a kebab shop on a Sunday morning.", "They'll call you 'sweetie' and 'my love' right up until the moment they bite your face. And they mean it, in their way. They love you the way you love a sausage roll.", "Strengths: they throw balls of something hot and green, they're surprisingly fast in the drains, and they always come in threes. Weaknesses: they can't resist the smell of cooking. Leave a pot boiling and you'll have every hag on the street round it.", "If one ever offers you soup, say no. Say no politely, and say it from a distance."]}}, {"id": "head_cheerleader", "name": "Head Cheerleader", "title": "Camp Boss · The Cheer Pyramid", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "HEAD CHEERLEADER", "sub": "Boss of the Cheer Pyramid. Top of the pyramid.", "lines": ["The Head Cheerleader. A woman standing at the top of a human pyramid forty cheerleaders high, with a megaphone, a ponytail like a whip and a smile so wide it reaches her ears.", "She's been at the top of the pyramid for six seasons. She has never come down. She eats up there. She sleeps up there. She has, God help us, gone to the toilet up there, and the squad at the bottom have simply had to live with it.", "She's the Arena's queen. Encore loves her. She has more fans than anyone except the Champion. And she knows that the moment she comes down from that pyramid, somebody else goes up.", "Strengths: she commands the squad, she leaps from the top of the pyramid and she dives down on you like a hawk. Weaknesses: the pyramid. Knock out the bottom row.", "Topple her and the whole pyramid comes down in a screaming heap of pom-poms and limbs, and for one second, she'll look relieved."]}}, {"id": "head_librarian", "name": "Head Librarian", "title": "Camp Boss · The Reading Room", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "HEAD LIBRARIAN", "sub": "Boss of the Reading Room. Silence is mandatory.", "lines": ["The Head Librarian. A tall, thin woman with grey hair in a bun so tight it pulls her eyebrows up, half-moon glasses on a chain, a cardigan buttoned to the neck and the absolute, terrible authority of someone who's run a library for four hundred years.", "The Reading Room is her domain. She sits at the great desk, stamping books, watching. Nobody speaks. Nobody coughs. Nobody turns a page without her permission. Breaking the silence in her Reading Room is the one crime in the Stacks with a death sentence.", "She's not cruel. She just loves silence more than she loves people. And honestly, after four hundred years of people, who can blame her?", "Strengths: her shush is a shockwave, she commands every shusher in the Room and her date stamp hits like a hammer. Weaknesses: she can't bring herself to make noise. Make her.", "Out-shush her. It's the only way. Stand in the Reading Room and go 'SHHHHHHHH' louder than she can. She'll fall silent. Forever."]}}, {"id": "hoa", "name": "The HOA President", "title": "Borough Boss · The HOA Clubhouse", "boss": true, "stats": {"hp": 1900, "dmg": 36, "speed": 3, "xp": 4600}, "ranged": false, "barks": ["Your lawn is two millimetres too long.", "Fined. Fined. FINED."], "chamber": null, "narr": {"title": "THE HOA PRESIDENT", "sub": "Borough Boss of the HOA Clubhouse. Chair of the Committee.", "lines": ["The HOA President. A tall, thin woman in a pastel twinset and pearls, with a clipboard in one hand and a fountain pen like a dagger in the other, and hair so lacquered you could break a window with it.", "She runs Suburbia. Every rule, every fine, every lawn length, every bin day. She has fined people out of existence. Literally. Fines down here become monsters, and enough fines become you being a monster, and she's done it to whole families for having the wrong-coloured front door.", "She has never lost a vote. Not once. She doesn't rig them. She doesn't need to. Everyone votes for her because the alternative is being fined for voting for someone else.", "Strengths: an endless stream of fines that hurt like paper knives, a gnome army and a voice that could cut through a foghorn. Weaknesses: procedure. She can't break her own rules. Use them.", "Win the vote. Or, if you can't win the vote, stab her with her own fountain pen. Both work. Only one of them is in the bylaws."]}}, {"id": "hollow_guard", "name": "Hollow Guard", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "HOLLOW GUARD", "sub": "Castle Dread's soldiers. Nobody inside.", "lines": ["The Hollow Guard. Suits of armour, rusted and dented, walking the walls of Castle Dread with halberds, swords and the clank of metal on stone. There's nothing inside them. You can see straight through the visors.", "They were contestants. They were cast as guards. They died inside the armour during filming, and over the years they rotted away, and the armour just kept walking without them.", "They still guard the castle. They still salute the Count. They still go 'Halt! Who goes there?' in hollow, echoing voices, even though they haven't had lungs for forty years.", "Strengths: they're armoured head to foot, they patrol in formation and they hit hard. Weaknesses: their joints. Hit the gaps.", "Kill one and it collapses into a pile of armour with a clatter, and a tiny puff of grey dust comes out of the helmet. That's him. That's all that's left."]}}, {"id": "host_clone", "name": "Host Clone", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "HOST CLONE", "sub": "Everybody's the Host here.", "lines": ["Host Clones. The Host. Again. And again. And again. Copies of him at every age, from little boy to old man, all with the same teeth, the same hair and the same professionally warm smile, walking the streets of his childhood town.", "They're his memories, made solid. Every version of himself he's ever been, living in the town he grew up in, playing out the same scenes over and over: little Host at school, teenage Host at the prom, young Host at his first audition.", "They all love you. They all want you to stay. They all smile at you like you're their best friend in the whole wide world, which is, if anything, the most terrifying thing in the dungeon.", "Strengths: they swarm, they charm and they pile on. Weaknesses: they're memories. Make them remember something he wants to forget.", "Kill one and it says 'Thanks for watching!' in his voice. Every time. Every single fucking time."]}}, {"id": "hound", "name": "Cul-de-Sac Hound", "title": null, "boss": false, "stats": {"hp": 46, "dmg": 11, "speed": 5, "xp": 30}, "ranged": false, "barks": ["*BARK BARK BARK*", "*growls at the mailbox*", "*snarl*"], "chamber": null, "narr": {"title": "CUL-DE-SAC HOUND", "sub": "Suburbia's neighbourhood watch.", "lines": ["Cul-de-Sac Hounds. Big, sleek, muscular dogs with collars, name tags and absolutely nothing behind the eyes, prowling the lawns of Suburbia Infinite at the end of very long leads held by nobody.", "Every one of them was somebody's pet once. On Earth. Real dogs, taken with their owners when the stairs came, and given a job down here: keep the neighbourhood nice. Keep it tidy. Keep it the same.", "They're not vicious, exactly. They're just enforcing the rules. If you step on the grass, they'll bite you. If you park badly, they'll bite you. If you exist in an unregulated fashion, they will bite you in the bollocks.", "Strengths: they hunt in packs, they're faster than you, and they can smell a rule-break a mile off. Weaknesses: they're still dogs. Throw a ball. Go on. Throw a ball and see what happens.", "Some of them still wag when you say 'good boy'. That's the worst part."]}}, {"id": "huntLord", "name": "Lord-Hunter Facet", "title": "Lodge Boss · Glimmerkin Safari Lodge", "boss": true, "stats": {"hp": 2200, "dmg": 40, "speed": 3.6, "xp": 6000}, "ranged": false, "barks": ["A contestant in MY lodge? How sporting.", "You’ll look wonderful above the fireplace."], "chamber": null, "narr": {"title": "LORD-HUNTER FACET", "sub": "Master of the Glimmerkin Safari Lodge.", "lines": ["Lord-Hunter Facet. A Glimmerkin, crystal-skinned and seven feet tall, in a red hunting coat and polished riding boots, with a monocle, a moustache waxed into points and a rifle older than your country.", "He runs the safaris. He sells the licences to the audience. He takes them out through the Canopy at dusk, sets them up in the hides, tells them where to aim, and stands behind them with a hip flask going 'jolly good shot'.", "And the books, oh, the books. He keeps immaculate ledgers. Every kill, every client, every payment. Payment isn't in money. Payment is in attention. Hours and hours of attention, from up there, and he's spending it on something down here. He's never asked on what.", "Strengths: he's a crack shot, he lays traps everywhere, his clients swarm to protect their guide and he cannot be bloody surprised. Weaknesses: he's arrogant. He hunts. He's never been hunted.", "Hunt him on Hunt Night. Drag him through the mud. And read the ledger afterwards. It's the first time anyone's written down what the fans actually are."]}}, {"id": "hunter", "name": "Tourist Hunter", "title": null, "boss": false, "stats": {"hp": 80, "dmg": 14, "speed": 3.6, "xp": 48}, "ranged": true, "barks": ["There! Trophy at two o’clock!", "Hold still, contestant.", "Licence number 4471. You’re on it."], "chamber": null, "narr": {"title": "TOURIST HUNTER", "sub": "Paying customers. Here for the safari.", "lines": ["Tourist Hunters. Rich people in khaki shorts, pith helmets and brand-new walking boots, with very expensive rifles and the faces of men who've never been told no, stalking through the Canopy in little guided groups.", "They are not contestants. They are not monsters. They're audience. Real, physical audience members, from somewhere up there, who've paid a fortune for a safari licence to come down here and shoot you in the head on camera.", "They think it's a game. They think you're not quite real. They'll take selfies with your body and post them somewhere you'll never see. One of them, last season, had your sister's face on his trophy wall. Probably. Who knows. Maybe.", "Strengths: they shoot from range, they hunt in groups and they've got better gear than you'll ever own. Weaknesses: they've never been hunted. Turn it round on them and they scream like little piglets.", "Kill one and he'll gasp, 'But I paid!' as if that settles it. Up there, it did."]}}, {"id": "hush", "name": "Hush", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [13, "The Quiet Room"], "narr": {"title": "HUSH", "sub": "The Quiet Room. Shhh. SHHHHH.", "lines": ["Hush. A tall, pale, featureless figure with a single enormous finger pressed to where its lips would be, standing in the Quiet Room, in absolute silence.", "It is silence. It's the silence of the Stacks made solid. Every sound that's ever been shushed in this library went somewhere, and that somewhere is here, and it's this.", "That library card with your photo on it? It's yours. It's always been yours. It was waiting for you before you were born. Collect it quietly.", "Strengths: absolute silence that drains your abilities, and a shush that can stop your heart. Weaknesses: noise. Any noise. Scream. Swear. Fart. Fart as loud as you can. It'll hate it."]}}, {"id": "index_clerk", "name": "Index Clerk", "title": "Camp Boss · The Index Vault", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "INDEX CLERK", "sub": "Boss of the Index Vault. Issues passes. Never has.", "lines": ["The Index Clerk. A tiny, wizened man behind a high counter in the Index Vault, surrounded by card catalogues, with an inkpad, a rubber stamp, a pass book and absolutely no intention of letting you through.", "He issues passes to the Restricted Section. He has issued no passes since the first season. Not one. Every application is lost, misfiled, incorrectly completed or rejected on a technicality. The form is forty pages long. Page thirty-two asks for a pass.", "He serves the Index, the god of memory. Everything is recorded. Nothing is forgotten. Nothing is allowed in that hasn't been properly filed. And you, my friend, have not been properly filed.", "Strengths: he files you away mid-fight, his stamp hurts and the whole Vault defends him. Weaknesses: he can't refuse a correctly completed form. Fill it in. All forty pages.", "Or knock him off his stool and take the pass. It's quicker. He'll file a complaint. Nobody will read it."]}}, {"id": "iron_maiden", "name": "The Iron Maiden", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [14, "The Torture Exhibit"], "narr": {"title": "THE IRON MAIDEN", "sub": "The Torture Exhibit. The exhibits will touch you.", "lines": ["The Iron Maiden. A spiked iron coffin in the shape of a woman, seven feet tall, standing in the middle of Castle Dread's Torture Exhibit, opening and closing her door with a creak like a slow, delighted laugh.", "She's the star exhibit. Every torture device in Castle Dread is on display in this hall, with a little placard explaining how it works. She's the only one that still works. And she's ever so keen to demonstrate.", "She was a prop. A fake. The spikes were rubber. Then the castle kept running, and decided she ought to be real, and she's been making up for lost time ever since.", "Strengths: spikes, a crushing embrace and the rack, the wheel and the chair all following her orders. Weaknesses: her keys. Lock her door shut."]}}, {"id": "jolly_jack_brightly", "name": "Jolly Jack Brightly", "title": "Camp Boss · The Talk Show", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "JOLLY JACK BRIGHTLY", "sub": "Boss of the Talk Show. Tonight's host.", "lines": ["Jolly Jack Brightly. A talk-show host with teeth like a piano, hair like a helmet and a suit like a disco ball, beaming from behind a desk, with a mug that says 'WORLD'S BEST HOST' and a couch for his guests that has a trapdoor under it.", "He's been hosting the same talk show every night for thirty years. His guests come on, sit on the couch, laugh at his jokes, and, if he doesn't like them, go through the trapdoor into the dark.", "He's charming. He's funny. He'll ask you about your childhood and look like he cares. Then he'll tell your worst secret to forty million people and laugh as he does it.", "Strengths: interview questions that hurt more than punches, a studio audience that cheers him on and a trapdoor under every seat. Weaknesses: he can't stand being upstaged.", "Survive the interview. Then check under the couch. The trapdoor goes somewhere he doesn't want you to know about."]}}, {"id": "kevlar", "name": "Captain Kevlar", "title": "Neighbourhood Boss · Mall Security HQ", "boss": true, "stats": {"hp": 1000, "dmg": 30, "speed": 3.2, "xp": 2400}, "ranged": false, "barks": ["This mall is under MY protection.", "Backup! BACKUP!"], "chamber": null, "narr": {"title": "CAPTAIN KEVLAR", "sub": "Boss of Mall Security HQ. Badge number one.", "lines": ["Captain Kevlar. The biggest Mall-Cop Ogre of the lot, wrapped in so much body armour he looks like a fridge that's been to war, with mirrored sunglasses he has never once taken off. Not to sleep. Not to shower. We've checked.", "He's the head of Mall Security and the only man in the Endless Mall with a staff badge that opens every door. He wears it on a lanyard round his neck, and he strokes it while he talks, like a Bond villain with a cat.", "He believes, completely and sincerely, that he is keeping everyone safe. And in a way, he is. Nobody gets hurt in the Mall, because nobody gets out of it. That's what security means, son.", "Strengths: a riot shield charge, a baton that hits like a car door and a whistle that empties the barracks onto your head. Weaknesses: his shield faces forward. He does not.", "Take the badge. Leave the sunglasses. Nobody wants to see what's behind them."]}}, {"id": "kraken", "name": "The Food Court Kraken", "title": "Borough Boss · The Food Court Depths", "boss": true, "stats": {"hp": 1600, "dmg": 34, "speed": 2.4, "xp": 4000}, "ranged": false, "barks": ["ORDER UP.", "Would you like fries with your doom?"], "chamber": null, "narr": {"title": "THE FOOD COURT KRAKEN", "sub": "Boss of the Food Court Depths. Guardian of the lift.", "lines": ["The Food Court Kraken. A tangle of tentacles the size of a lorry park, each one made of something different: noodles, sausages, chips, a really long strand of mozzarella. It lives in the grease trap under the food court, and it stinks like the bins at a festival.", "Every bit of food the Endless Mall serves ends up here eventually. Half-eaten, binned, swept up. The Kraken eats the leftovers. Then it got bigger. Then it ate the cleaners. Then it got much bigger.", "It sits on top of the service lift, the only way out of the Mall, and it's not doing it on purpose. It's just very comfortable. The Mall Mother likes it there. A big, greasy cork in her bottle.", "Strengths: tentacles that grab, slam and sweep, slimes that bubble up from the grease, and enough hit points to survive a nuclear war and a buffet. Weaknesses: fire. My God, does it burn. And its tentacles let go if you hurt the bit in the middle.", "Get past it before closing time. Trust me. You don't want to be under the food court when the shutters come down."]}}, {"id": "lamprey", "name": "Drain Lamprey", "title": null, "boss": false, "stats": {"hp": 38, "dmg": 9, "speed": 2.6, "xp": 22}, "ranged": false, "barks": ["…shhhhllk…", "*wet gurgling*", "Ssssuck…"], "chamber": null, "narr": {"title": "DRAIN LAMPREY", "sub": "A mouth with a body attached as an afterthought.", "lines": ["The drain lamprey, ladies and gentlemen. A slimy grey eel with a perfectly round mouth ringed with hooked teeth, which it would very much like to attach to your face.", "Lampreys live in the Undercroft's flooded sumps and drains, and they've been eating whatever falls into them since before the cars stopped running. They latch on, they suck, and they don't let go until you're either dead or extremely anaemic.", "They're the reason nobody swims on Floor 1. They're also the reason nobody sits on the toilets in the Flooded Bay, and frankly that's a decision I respect.", "Strengths: grab and drain, slippery, and very hard to see in water. Weaknesses: dry land makes them slow and stupid, fire makes them shrivel like bacon, and once they've latched on they can't dodge anything.", "If you hear a wet sucking noise behind you, don't turn round. Just run. And don't look down."]}}, {"id": "landlord", "name": "The Landlord", "title": "Borough Boss · Rent Tribunal", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["Rent's due.", "You'll be hearing from my bailiff."], "chamber": null, "narr": {"title": "THE LANDLORD", "sub": "Borough Boss of the Rent Tribunal. Owns your home.", "lines": ["The Landlord. A great swollen man in a waistcoat that's given up trying to button, with rings on every finger, a gold tooth in every other socket and a keyring the size of a dinner plate jangling off his belt.", "He owns every room on the Drowned Cistern. Every flat, every houseboat, every flooded cellar. Your tenancy began the moment you stepped off the stairs, and the rent began the second after that, and he's had the bailiffs on you since before you knew his name.", "He doesn't need your money. There isn't any money worth having down here. He needs you to owe him. Debt keeps people in place. Debt keeps people in their functions. That's how the whole Undercity works, and he's just the one honest enough to charge for it.", "Strengths: he summons Debt Collectors, he locks doors behind you with that keyring and every hit he lands adds to your arrears. Weaknesses: he can't stand being ignored. Pay him in insults and he'll lose his mind.", "Settle up with him, one way or another. His evidence locker has the sluice crank in it, and he has absolutely no idea what it's for."]}}, {"id": "laugher", "name": "Laugher", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "LAUGHER", "sub": "The Laugh Track Factory's workforce. Ha. Ha. Ha.", "lines": ["Laughers. Grey-faced people chained to desks in rows, laughing on cue. Forever. Their mouths have been laughing so long that their jaws have dislocated and hang open like broken drawers.", "Every laugh you've ever heard on the Network is one of them. They're contestants, put to work in the Laugh Track Factory, laughing at jokes they can't hear, every time a light comes on. Ha. Ha. Ha.", "Some of them have been laughing for thirty years. They've forgotten what funny is. They've forgotten what anything is. They just laugh, and laugh, and cry while they're laughing, and keep laughing.", "Strengths: their laughter hurts. Literally. It's a sound weapon now. And they never stop. Weaknesses: they can't laugh without the cue light. Smash it.", "Shut one down and it'll sigh. A long, empty sigh. The first sound it's made in years that wasn't a laugh."]}}, {"id": "leading_man", "name": "The Leading Man", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [10, "Stage Zero"], "narr": {"title": "THE LEADING MAN", "sub": "Stage Zero. It's always been about him.", "lines": ["The Leading Man. A chiselled, impossibly handsome man in a tuxedo, with perfect teeth, perfect hair and a perfect jawline, standing in a spotlight on Stage Zero, delivering a monologue to nobody.", "He's the star. He's always been the star. He's been in every episode of every show on the Backlot, and he has never once let anyone else have a line. Every co-star he's ever had has ended up under the stage.", "He has a catchphrase. He says it after every kill. It's crap. It's genuinely crap. But the audience goes wild for it.", "Strengths: a spotlight that blinds, stunt fighting that looks great on camera and an ego that buffs him. Weaknesses: say his catchphrase before he does. He'll lose his shit."]}}, {"id": "leech", "name": "Coupon Leech", "title": null, "boss": false, "stats": {"hp": 40, "dmg": 10, "speed": 3, "xp": 26}, "ranged": false, "barks": ["Limited time offer!", "Buy one, get bitten.", "*paper rustling*"], "chamber": null, "narr": {"title": "COUPON LEECH", "sub": "Discount predators of the Coupon Den.", "lines": ["Coupon Leeches. Slimy, flat, glossy things the length of your arm, printed with BUY ONE GET ONE FREE all down their backs, that latch on and drink your money. And then your blood. In that order.", "They breed in the Coupon Den, among drifts of expired vouchers ankle-deep, and every one of them is a debt. A real one. Somebody owes something, and the leech is there to collect, one slurp at a time.", "They don't care whose debt it is, either. They'll suck on anyone. Very much like a bank.", "Strengths: they latch on and drain you, they're hard to see in the paper, and there are always more of them than you think. Weaknesses: they can't stand being torn up. Rip a coupon in half and they all squirm.", "If you feel a little tug on your wallet, it's already too late."]}}, {"id": "lifeguard", "name": "The Lifeguard", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [5, "The Pool House"], "narr": {"title": "THE LIFEGUARD", "sub": "The Pool House. No running. No diving. No coming up.", "lines": ["The Lifeguard. A bronzed, impossibly muscled man in red shorts with a whistle, a float and a zinc-white nose, sitting in a high chair over a swimming pool that's far deeper than it looks.", "He's never saved anyone. He's never had to. People drown in his pool, and he blows his whistle, and he says 'no running', and he goes back to staring at the horizon.", "There are dozens of people at the bottom of his pool. They're fine. They're just resting. He'll tell you that very firmly if you ask.", "Strengths: he drags you under, his whistle stuns you and he swims like a shark that's been on steroids. Weaknesses: the pool bell. Ring it from the high board and he has to clear the pool."]}}, {"id": "lintKing", "name": "The Lint King", "title": "Neighbourhood Boss · The Lint Traps", "boss": true, "stats": {"hp": 560, "dmg": 18, "speed": 2, "xp": 900}, "ranged": false, "barks": ["Lint… everywhere… mine…", "The traps are FULL."], "chamber": null, "narr": {"title": "THE LINT KING", "sub": "Boss of the Lint Traps. Lord of fluff.", "lines": ["The Lint King. A towering heap of grey fluff, toenail clippings, pubes and loose change, wearing a crown made out of a bent coat hanger. He smells like the inside of a gym bag that's been left in a hot car.", "He started as an ordinary lint goblin. Then he discovered that lint is insulation, bedding, fire-starter, crafting material and, in a pinch, food, and he declared the whole lot his. Every dryer on the floor pays him tribute. Every sock you've ever lost ended up in his throne.", "He is, genuinely, the only competent economist on Spin City. He runs the Lint Traps like a cartel. Lampreys guard the filters. Goblins do the collecting. Nobody gets a single fluffball without the King getting his cut.", "Strengths: he is extremely flammable, which sounds like a weakness until he's on fire and running at you. He summons goblins, smothers you in fluff and has more hit points than a sofa. Weaknesses: fire, ironically, and greed. Offer him a deal and he'll listen.", "Kill him, bargain with him, rob him, or roll up your sleeves and clean his machines. He respects anyone who'll do the filters. Nobody ever does the filters."]}}, {"id": "lockjaw", "name": "Lockjaw", "title": "Borough Boss · The Vault", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["*the sound of tumblers turning*"], "chamber": null, "narr": {"title": "LOCKJAW", "sub": "Borough Boss of the Vault. Tumblers turning.", "lines": ["Lockjaw. A creature made of a bank vault door, round and steel and two metres across, with a combination dial for a nose, bolts for teeth and a jaw that opens with the sound of a thousand tumblers clicking.", "He guards the Vault under City Hall, where the Undermayor keeps everything that matters: the treasury, the deeds, the ballot boxes, and a few people who asked the wrong questions. Mags' old crew is in there. They've been in there forty years.", "He doesn't talk. He just clicks. He's said one thing in all that time, and that was 'no', and it took him three weeks.", "Strengths: he's armoured to the eyeballs, he charges like a falling safe and his bite locks shut. Weaknesses: the combination. Everything has a combination.", "Spin the dial right and his jaw swings open, and you'll see the inside of the Vault, and you'll understand why the Undermayor never wanted anyone to."]}}, {"id": "lostfound", "name": "Lost & Found", "title": "Borough Boss · The Lost Property Office", "boss": true, "stats": {"hp": 900, "dmg": 22, "speed": 2.6, "xp": 1500}, "ranged": false, "barks": ["Have you lost something? I have it now.", "Unclaimed items will be eaten."], "chamber": null, "narr": {"title": "LOST & FOUND", "sub": "Boss of the Lost Property Office. Made of everything anyone ever lost.", "lines": ["And this is Lost & Found, the dungeon's patron saint of things you'll never see again. A towering heap of lost coats, scarves and umbrellas, with a face made of buttons and one enormous eye.", "It runs the Lost Property Office on Floor 1, and it's kept every single item ever lost on that floor, from every season, catalogued, labelled and treasured. Some of the labels are in languages that aren't from Earth.", "It doesn't want to hurt you. It wants to keep you. Contestants are the most commonly lost things in the dungeon, after all, and Lost & Found has a very clear policy about unclaimed property.", "Strengths: it wraps you in coats, swaps your items around, and summons mimics from its back room. Weaknesses: fire, moths, and anyone who can prove they own something it's holding.", "If you lost something on your way down, it's here. So is everything else. Somewhere in that pile is a coat with your name sewn into it, from a season you don't remember."]}}, {"id": "maintainer", "name": "Maintainer", "title": null, "boss": false, "stats": {"hp": 102, "dmg": 13, "speed": 3.5, "xp": 64}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "MAINTAINER", "sub": "The Builders' last workers. Keeping it running.", "lines": ["Maintainers. Tall, grey, faceless figures in overalls, carrying spanners, oil cans and clipboards, moving silently through the bare concrete corridors of the floor that doesn't exist, keeping everything running.", "They were made by the Builders, to look after the Stack. They don't know the Builders are gone. They don't know about the Network. They don't know about contestants. They just keep the machines turning, oiled and clean, as they have since the beginning of everything.", "To them, you're a fault. A foreign object in the machine. A bit of grit in the works. And faults get fixed.", "Strengths: they don't stop, they don't feel and they fix themselves. Weaknesses: they can't attack anything that's part of the machine. Stand on something important.", "If one stops and looks at you, really looks, it's the first time in a thousand years it's looked at anything that wasn't a machine. It doesn't know what to do."]}}, {"id": "makeup_witch", "name": "Makeup Witch", "title": "Camp Boss · Makeup Trailers", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "MAKEUP WITCH", "sub": "Boss of the Makeup Trailers. Final look.", "lines": ["The Makeup Witch. A tall woman in a smock covered in powder, with brushes stuck in her hair like pins in a cushion, a belt of a hundred lipsticks and a mirror that shows you who you're about to become.", "She does faces. She can make you look like anyone. She can make you look younger, older, prettier, scarier, famous. And she does it permanently. Every face she's ever done is still on its owner. Some of those owners didn't want the faces.", "She's the reason half the Extras look identical. She ran out of ideas in the eighties and just started doing the same face over and over. Nobody's dared complain.", "Strengths: powder clouds that blind you, brushes thrown like darts and a face mask that slowly sets on your skin. Weaknesses: water. Makeup runs. So does she.", "If you sit in her chair, she'll make you beautiful. Very beautiful. You'll never be able to stop smiling, ever again, because she's glued it on."]}}, {"id": "mallcop", "name": "Mall-Cop Ogre", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 13, "speed": 3, "xp": 36}, "ranged": false, "barks": ["Sir. SIR. No running.", "You’re banned from the mall. For life.", "Code red. Code ME."], "chamber": null, "narr": {"title": "MALL-COP OGRE", "sub": "Endless Mall security. No running.", "lines": ["Mall-Cop Ogres. Eight-foot slabs of hairy grey meat crammed into polyester uniforms three sizes too small, with a radio on the shoulder, a torch on the belt and a moustache that has its own postcode.", "Security for the Endless Mall, and they take it very seriously. No running. No shouting. No loitering. No leaving. That last one isn't written down anywhere, but by God they enforce it.", "They're on minimum wage, which down here means they get paid in food-court vouchers, and they've been eating free burgers for so long that they don't really have insides any more. Just gravy.", "Strengths: big swinging punches, a charge like a wardrobe falling
