 down the stairs and a radio that calls in backup. Weaknesses: they're slow, they're thick, and they absolutely cannot climb. Get up the escalator and watch them puff.", "If one asks to see your receipt, do not show him. That's how they get you."]}}, {"id": "mallmother", "name": "Mall Mother", "title": "City Boss · The Atrium", "boss": true, "stats": {"hp": 2600, "dmg": 40, "speed": 2.4, "xp": 7000}, "ranged": false, "barks": ["Shhh. Shop, my darlings. Shop forever.", "Nobody leaves the mall."], "chamber": null, "narr": {"title": "THE MALL MOTHER", "sub": "City Boss of the Atrium. The heart that keeps the Mall alive.", "lines": ["The Mall Mother. A colossal human heart, fused into the ceiling of the Atrium, the size of a church, veined with escalators and pumping warm fluorescent light down through the floors like blood. She speaks in a soft, kind voice, like a nurse on a night shift.", "She loves you. She genuinely does. She loves every shopper, every contestant, every Mall-Cop and every leech. She keeps everyone fed, safe, warm and still. Especially still. Nobody leaves. Leaving is how you get hurt.", "Here's why: she was the Mall's first contestant. Seasons and seasons ago, she came down here, and she went deeper than anyone, and she saw what's at the bottom. Then she came back up, sat down in the Atrium, and decided that nobody she loves will ever go down there again.", "Strengths: she controls the whole building. Shutters, lights, escalators, the lot. She summons security and the dead shoppers, and her heartbeat knocks you off your feet. Weaknesses: she's still a person, somewhere in there. Talk to her.", "Kill her and the Mall dies around you. Bargain, and she might open the doors. Learn the truth, and she'll tell you one thing about Floor 18, and then she'll weep."]}}, {"id": "mannequin_bride", "name": "The Mannequin Bride", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [4, "The Changing Rooms"], "narr": {"title": "THE MANNEQUIN BRIDE", "sub": "The Changing Rooms. Something old, something new.", "lines": ["The Mannequin Bride. A shop dummy in a wedding dress, yellowed with age, with a veil that's mostly cobwebs and a bouquet of plastic flowers, standing at the end of a long aisle of changing-room cubicles, waiting.", "She was jilted. Well, she was a mannequin, so she was always going to be jilted, but she took it badly. She's been waiting for her groom since the Mall opened. Every contestant who walks into the Changing Rooms, she thinks it's him.", "When she realises it isn't, she makes them into mannequins too. Groomsmen. Bridesmaids. A best man who'll never finish his speech. The whole wedding party's here, posed, forever.", "Strengths: she's fast, she's hard as plastic and she can turn you into a dummy one limb at a time. Weaknesses: her veil. Find the pieces. She'll stop to put it on."]}}, {"id": "mascot", "name": "Mascot", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "MASCOT", "sub": "The Arena's team spirit. Inside a costume.", "lines": ["Mascots. Giant foam costumes of animals that don't exist: a purple badger, a smiling sausage, a lion with a bow tie, a thing nobody can identify that might be a cheerful kidney. Inside each one is a contestant, sweating to death.", "They're the Arena's hype men. They dance, they wave, they do backflips on the touchline and they beat the shit out of opposing players during the half-time interval for the crowd's entertainment.", "The costumes don't come off. They were zipped in seasons ago, and the zips have rusted shut. You can hear them weeping in there between dances, very quietly, into the foam.", "Strengths: they're padded like sofas, they dance-attack and the crowd goes wild every time they hit you. Weaknesses: they can't see properly. They can barely see at all.", "Unzip one. It's horrible in there. But they'll thank you for it, with a long, wet, gasping breath."]}}, {"id": "matriarch", "name": "The Dog Park Matriarch", "title": "Neighbourhood Boss · Wild Kennel", "boss": true, "stats": {"hp": 1700, "dmg": 38, "speed": 4.6, "xp": 4000}, "ranged": false, "barks": ["*a howl that shakes the leaves*"], "chamber": null, "narr": {"title": "THE DOG PARK MATRIARCH", "sub": "Boss of the Wild Kennel. Wears the licence.", "lines": ["The Dog Park Matriarch. Mr. Fetch's mum, in a sense. A colossal wolfhound, grey-muzzled and scarred, with a hunting licence on her collar and a pack of wild dogs that would run through fire for her.", "The Glimmerkin hunters took her pups for trophies. All of them. She tore three hunters apart for it, took one of their licences and hung it round her own neck, and now nobody gets into the Lodge without going through her.", "She's not evil. She's grieving, and she's very, very angry, and she has nobody left to look after except a kennel full of lost dogs from Earth.", "Strengths: she leads the pack, she pounces from cover and her howl calls every hound in the forest. Weaknesses: she's protective. Threaten the pack and she makes mistakes.", "Take the licence and she'll let you go. Hurt the pack and she'll follow you to the end of the dungeon."]}}, {"id": "mayor", "name": "Mayor Eternal", "title": "City Boss · Town Hall", "boss": true, "stats": {"hp": 3000, "dmg": 42, "speed": 2.8, "xp": 8000}, "ranged": false, "barks": ["Re-elect me. Forever.", "This cul-de-sac is a democracy. I am the democracy."], "chamber": null, "narr": {"title": "MAYOR ETERNAL", "sub": "City Boss of Town Hall. Re-elected every season.", "lines": ["Mayor Eternal. An old man in a sash and chain, as grey and dry as a pressed flower, sitting behind an enormous desk in Town Hall, stamping things. He's stamped things since the Stack began.", "He has been re-elected every single season. Unopposed. Nobody remembers voting for him. Nobody remembers anyone standing against him. There are campaign posters for him from centuries ago, and they look exactly the same.", "He's a Builder relic. Not a Builder himself, but something they left behind: a clerk, a function, a stamp with legs. He's the first thing in the dungeon that knows who the Builders were. He won't say. But if you show him the Ancient Token, his hand stops stamping for the first time in a thousand years.", "Strengths: he stamps things into submission, he summons hounds and Mall-Cops, and he simply refuses to die. Weaknesses: paperwork. Give him a form he can't stamp and watch him seize up like an old engine.", "Re-elect him if you like. Everyone else has. Or ask him a question nobody's ever asked: 'Who appointed you?'"]}}, {"id": "mimic", "name": "Vending Mimic", "title": null, "boss": false, "stats": {"hp": 95, "dmg": 17, "speed": 2.4, "xp": 40}, "ranged": false, "barks": ["INSERT COIN.", "OUT OF ORDER. OUT OF PATIENCE.", "Exact change only. Exact. CHANGE."], "chamber": null, "narr": {"title": "VENDING MIMIC", "sub": "A snack machine with teeth. Exact change required.", "lines": ["The vending mimic. A red snack machine with a wide jagged mouth, a long wet tongue and one eye peering out of the coin slot. Insert coin. Lose arm.", "Nobody knows how vending machines became predators. The Vending Collective will tell you they were 'always like this', which is a lie, because Benchwright Bo once watched one walk calmly through a solid wall like it was the most natural thing in the world.", "They wait in corridors pretending to be machines, and they're very good at it, right up until you press B4. They're full of springs, coins and the half-digested remains of everyone who wanted a chocolate bar.", "Strengths: ambush, a nasty bite, and armour like a bank safe. Weaknesses: they're slow, they're top-heavy, and they're stuffed with springs that Bo would very much like back.", "Rule of the dungeon: if a vending machine looks a little too pleased to see you, it is."]}}, {"id": "mirror_self", "name": "Mirror Self", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "MIRROR SELF", "sub": "You. But wrong.", "lines": ["Mirror Selves. Copies of you, stepping out of the mirrors in the Mirror Maze, wearing your face, your clothes and your expression, except slightly wrong. A bit to the left. A bit too smiley. Eyes a little dead.", "They're your reflections, given a body by the Maze. They know your moves because they're your moves. They've watched you every time you looked in a mirror. They've seen you pick your nose. They've seen you practise what you'd say to your ex.", "They want to be you. They think they'd do a better job of it. Honestly? Some of them might.", "Strengths: they copy everything you do, they come in numbers and they're very hard to tell apart from the real you. Weaknesses: break the mirror.", "Kill one and it shatters into glass on the floor, and every shard shows your face, looking disappointed."]}}, {"id": "mold", "name": "Big Momma Mold", "title": "City Boss · The Nursery", "boss": true, "stats": {"hp": 1150, "dmg": 19, "speed": 3.1, "xp": 2600}, "ranged": false, "barks": ["Shh. Lie down, sweetie. You've done enough."], "chamber": null, "narr": {"title": "BIG MOMMA MOLD", "sub": "City Boss of the Nursery. You've done enough.", "lines": ["Big Momma Mold. A great grey-green mound of mould and fungus the size of a house, soft as bread dough and twice as warm, with a kind, motherly face in the middle of it all, smiling at you like you've come home.", "She's the Nursery of the Workings. Tired miners come to her to rest. She tucks them in. She sings to them. She grows over them like a blanket, and they sleep, and they never wake up, and they've never been happier.", "She's sitting on the only soft seam on the floor, the only place the drill could break through. And she's sitting there on purpose. She knows what's down there. She's seen it. She'd rather everyone slept forever than went and saw it too.", "Strengths: spore clouds, a choir of children and a hug that will absolutely kill you. Weaknesses: fire, and the truth. She's scared. Tell her you're scared too.", "'Shh,' she'll say. 'Lie down, sweetie. You've done enough.' And part of you, a big part, will want to. Don't."]}}, {"id": "molekin", "name": "Tunnel Mole-Kin", "title": null, "boss": false, "stats": {"hp": 85, "dmg": 12, "speed": 3.8, "xp": 58}, "ranged": false, "barks": ["Dig. Dig. Dig."], "chamber": null, "narr": {"title": "TUNNEL MOLE-KIN", "sub": "The miners of the Workings. Dig, dig, dig.", "lines": ["Tunnel Mole-Kin. Squat, furry, half-blind diggers with spade-shaped hands, tiny round spectacles and hard hats with candles stuck on top, muttering 'dig, dig, dig' under their breath like a prayer.", "They're the workforce of the Workings, the floor where the Stack's machinery gets maintained. They dig the shafts, lay the track and keep the drills turning, twelve hours a shift, for no pay and no reason anybody's ever explained.", "Chief Grubtooth pulled up every rail on the floor to build himself a throne, and the mole-kin went along with it, because a chief is a chief. They're good at following orders. They've been following orders for so long that they've forgotten there was ever a time without them.", "Strengths: they burrow under you and pop up behind, they come in crews and those spade hands can take your face off. Weaknesses: bright light, and they're slow on open ground.", "Ask one what they're digging towards. He'll stop, and frown, and say, 'Down,' and then he'll go back to digging, and he won't look at you again."]}}, {"id": "moth", "name": "Fluorescent Moth", "title": null, "boss": false, "stats": {"hp": 42, "dmg": 10, "speed": 4.2, "xp": 26}, "ranged": false, "barks": ["bzzzt… LIGHT…", "The Queen sees you…", "bzz bzz BZZ"], "chamber": null, "narr": {"title": "FLUORESCENT MOTH", "sub": "A moth the size of a dog, and every bit as stupid about lamps.", "lines": ["The fluorescent moth. A furry, wild-eyed moth the size of a Labrador, glowing from its fat abdomen and absolutely besotted with every light on the floor.", "Moths keep the Undercroft's lights alive. They tend the old fluorescent tubes, carry glow from lamp to lamp, and swarm anyone who threatens a light, which includes you, every time you hit a lamp post during a fight.", "They serve the Moth Matron in the Lightwell, and behind her, Lady Lumen herself, though not one of them could tell you that. They just know the light must not go out. It's the only thing they know.", "Strengths: flight, swarming, blinding dust, and a sting of pure electric light. Weaknesses: darkness confuses them, a bright flare will distract the whole swarm, and they're fragile; one good swing will drop them.", "Turn off your torch near a moth swarm and they'll lose interest. Turn it on and they'll lose their minds."]}}, {"id": "mothMatron", "name": "The Moth Matron", "title": "Neighbourhood Boss · The Lightwell", "boss": true, "stats": {"hp": 380, "dmg": 13, "speed": 3.8, "xp": 520}, "ranged": false, "barks": ["Who dims my light?", "Children, to me!"], "chamber": null, "narr": {"title": "THE MOTH MATRON", "sub": "Boss of the Lightwell. Mother of a thousand lamps.", "lines": ["The Moth Matron. Queen of the Lightwell, wings as wide as a car park bay, a furry white ruff and a face full of black eyes, every one of them watching you.", "She's maintained the Undercroft's lights for decades. Every lamp on Floor 1 that still works works because of her children. Without her, the whole floor goes dark, and the things that live in the dark come up the ramps.", "She's not evil. She's a mother with a job and a temper. Bring a weapon and she'll fight. Bring her a lasting light, something that'll never go out, and she might just show you the maintenance tunnels her moths use to get around.", "Strengths: blinding nova bursts, summoning her swarm, and a will of iron. Weaknesses: she can't bear the dark, and if she falls the lights fail, which is your problem as much as hers.", "Think hard before you kill her. Somebody has to keep the lights on."]}}, {"id": "notice", "name": "The Final Notice", "title": "Neighbourhood Boss · The Coupon Den", "boss": true, "stats": {"hp": 860, "dmg": 28, "speed": 3.4, "xp": 2200}, "ranged": false, "barks": ["THIS IS YOUR FINAL NOTICE.", "Payment is overdue. So are you."], "chamber": null, "narr": {"title": "THE FINAL NOTICE", "sub": "Boss of the Coupon Den. Payment overdue.", "lines": ["The Final Notice. A towering envelope of red-printed paper with eyes where the window should be, stuffed with ink and fury, trailing a cloud of Coupon Leeches like a mother duck.", "Every debt in the Endless Mall ends up here. Every unpaid sponsorship, every unclaimed reward, every free sample that turned out not to be free. The Final Notice is what it all becomes, when it's been ignored long enough.", "And yes. Yes, one of those debts is yours. You signed something when you took Sunny's sponsorship. Did you read it? Of course you didn't. Nobody reads it. That's how it works.", "Strengths: it spits out paper cuts by the thousand, it summons leeches, and its scream sounds like every bailiff you've ever dodged. Weaknesses: fire, shredding, and bloody-mindedness. Tear it up. Tear it all up.", "When it dies, it says PAYMENT RECEIVED in a voice like an automated phone line, and you feel worse than you expected to."]}}, {"id": "old_bellows", "name": "Old Bellows", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [8, "The Furnace Floor"], "narr": {"title": "OLD BELLOWS", "sub": "The Furnace Floor. He breathes fire. On purpose.", "lines": ["Old Bellows. A wrinkled, leathery creature like a giant accordion with legs, wheezing and puffing, with a furnace in his belly and soot pouring out of his mouth every time he breathes, which is constantly, and loudly, like a man climbing stairs after a fry-up.", "He keeps the furnaces of the Workings stoked. He's been doing it since the Builders lit them. He breathes in coal dust and breathes out fire, and if he ever stops, the whole floor goes cold.", "He's ancient. He's knackered. He's got a cough you can hear three shafts away, and he hawks up lumps of burning coal the size of your fist.", "Strengths: fire breath, soot clouds and a body like a bellows. Weaknesses: the dampers. Open them and he can't build up pressure."]}}, {"id": "organ", "name": "Pipe Organ Wyrm", "title": "Borough Boss · The Organ Loft", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["*a chord that rattles your teeth*"], "chamber": null, "narr": {"title": "PIPE ORGAN WYRM", "sub": "Borough Boss of the Organ Loft. Plays one song.", "lines": ["The Pipe Organ Wyrm. A sewer wyrm the length of a train that crawled into the Drowned Cathedral's organ decades ago and grew into it. Its spine is brass pipes. Its ribs are stops. When it breathes, the cathedral sings.", "It plays one song. It's been playing the same song for so long that the notes have worn grooves in the walls. It only sleeps when someone plays the right tune back to it, and nobody's played it right since the drowning.", "The sheet music is somewhere in the Cathedral. Floating, probably. Soggy. Smudged. Some of it was used as bog roll, and you should not think about that too hard when you're reading it.", "Strengths: sound blasts that throw you across the nave, a sweeping tail and a chord so low it loosens your bowels. Literally. Bring spare trousers. Weaknesses: silence. Smash the pipes and it chokes.", "Play it the right song and it'll lay its head down on the keys and sleep like a baby. Play it the wrong one and you'll have the worst ten minutes of your life."]}}, {"id": "outfall", "name": "The Outfall Bishop", "title": "City Boss · The Great Outfall", "boss": true, "stats": {"hp": 1150, "dmg": 19, "speed": 3.1, "xp": 2600}, "ranged": false, "barks": ["Old Damp remembers you.", "Let it all drain down."], "chamber": null, "narr": {"title": "THE OUTFALL BISHOP", "sub": "City Boss of the Great Outfall. Priest of Old Damp.", "lines": ["The Outfall Bishop. A tall, drowned priest in rotting robes the colour of algae, with a mitre made from a bucket and a crozier made from a drain rod, standing in the mouth of the Great Outfall with water pouring past his ankles forever.", "He serves Old Damp, the god of leaks and what's left behind. His congregation is everyone who ever drowned in the Cistern, and they all still turn up on Sundays. They stand in the water in rows, swaying, gurgling hymns, with eels coming out of their ears.", "He believes everything should drain down, eventually. Everything, everyone, all of it, down into the dark and the wet. He thinks he's giving people peace. He's giving them pneumonia, mainly.", "Strengths: tidal waves of filthy water, a drowned congregation that'll drag you under and a sermon that makes your lungs feel full. Weaknesses: dry ground, and doubt. He's never been sure Old Damp is listening.", "If you ever choose Old Damp as your god, he'll bless you. If you don't, he'll hold you under until you change your mind."]}}, {"id": "overdue", "name": "Overdue", "title": "Camp Boss · The Returns Chute", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "OVERDUE", "sub": "Boss of the Returns Chute. Your fines are waiting.", "lines": ["Overdue. A great heap of unreturned books given shape and fury, with a library card for a face, a date-stamp for a fist and a voice made of every late-fee letter ever sent, screaming in the dark at the bottom of the Returns Chute.", "Everything returned to the Stacks goes down the chute, and everything that goes down the chute comes back wrong. Overdue is where it all ends up: every book late, every fine unpaid, every 'I'll take it back next week' that never happened.", "Yes, there's one of yours in there. You know the one. You borrowed it in 2009. The fine is now in the low millions.", "Strengths: books thrown like bricks, a crushing weight of guilt that literally slows you down and an avalanche of returns. Weaknesses: return something. Anything.", "Settle your fines with Overdue and it shrinks, book by book, until it's just one sad little paperback on the floor, and it says 'thank you', and you feel like shit for 2009."]}}, {"id": "paparazzo", "name": "Paparazzo", "title": null, "boss": false, "stats": {"hp": 102, "dmg": 13, "speed": 3.5, "xp": 64}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "PAPARAZZO", "sub": "The Paparazzi Pit's finest. Smile.", "lines": ["Paparazzi. Thin, sweaty men in anoraks with long-lens cameras, shoving each other out of the way, shouting your name, flashing so hard you can't see, getting so close you can smell what they had for lunch. It was a kebab.", "They sell your worst moments to the Network. You on the toilet. You crying. You picking your nose behind a bin. You at the exact moment your face looks like a slapped arse. It's all money to them, and they have no shame whatsoever.", "They were contestants. They found out that photographing people was safer than being photographed. They've been chasing stars down the corridors of the Green Room ever since.", "Strengths: flash bursts that blind you, they swarm and they're impossible to get rid of. Weaknesses: break the camera and they're just sad men in anoraks.", "Smash one's camera and he'll go on his knees in the corridor sobbing about his exclusive. Don't feel bad. He had a photo of you having a wank."]}}, {"id": "paper_golem", "name": "Paper Golem", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "PAPER GOLEM", "sub": "The Bindery's workers. Folded, not born.", "lines": ["Paper Golems. Seven-foot figures folded from huge sheets of paper, origami men with stitched spines and faces of printed text, rustling as they move, with paper-cut edges on every limb.", "The Bindery makes them. Old manuscripts, pulped and pressed and folded into servants. Each one is made from a book, and each one is that book. That one's a cookbook. That one's a romance novel. That one's a tax law, and he's a fucking nightmare.", "They work the Bindery in silent rows, binding books, stitching pages, folding more golems out of whatever's lying around. Including, occasionally, contestants.", "Strengths: they're tough for paper, they slice and they keep reforming from loose sheets. Weaknesses: fire. Water. Scissors. A strong breeze.", "If you hear one rustle behind you, don't turn round. Just set fire to it."]}}, {"id": "pigeon", "name": "Pigeon Ghoul", "title": null, "boss": false, "stats": {"hp": 52, "dmg": 11, "speed": 3.7, "xp": 28}, "ranged": true, "barks": ["COO. COO. COO.", "Got any bread?", "Mine! MINE! COO!"], "chamber": null, "narr": {"title": "PIGEON GHOUL", "sub": "Undead pigeon. Somehow worse than the living kind.", "lines": ["The pigeon ghoul. A rotting, half-bald, mad-eyed pigeon the size of a turkey, which has been dead for some time and has not let that slow it down.", "They roost on the Undercroft's high ledges and drop on anything that moves, and they shit on everything that doesn't. Nobody knows why they came back. Nobody has asked them. They don't seem the type to answer.", "They're scavengers, cowards and thieves, and they love Old Man Coo and the Pigeon Elder with the dumb devotion of something whose brain has mostly fallen out.", "Strengths: they dive from above, steal your loot, and come in flocks. Weaknesses: they're flimsy, they hate loud noises, and they will abandon a fight for a single crumb.", "Look up. They're already looking down."]}}, {"id": "pigeonElder", "name": "The Pigeon Elder", "title": "Neighbourhood Boss · The Pigeon Loft", "boss": true, "stats": {"hp": 340, "dmg": 12, "speed": 3.6, "xp": 480}, "ranged": false, "barks": ["COOOOO.", "The loft provides!"], "chamber": null, "narr": {"title": "THE PIGEON ELDER", "sub": "Boss of the Pigeon Loft. He remembers.", "lines": ["The Pigeon Elder. Huge, ragged, undead, puffed up like a bishop and smelling like the inside of a bin lorry.", "He's the oldest thing on Floor 1. Older than Pylon. Older than Marta's list. He remembers 'the ones who went down' before this season: contestants from long ago, and where they camped, and what they said. He just doesn't remember where they went.", "Kill him and you'll get big fans and a lot of feathers. Listen to him, and he'll give you a clue that matters three floors from now.", "Strengths: summoning his flock, dive-bombing, and frankly unbearable halitosis. Weaknesses: he's old, he's vain, and he can't resist a good audience.", "Ask him about the old seasons. He's dying to tell someone."]}}, {"id": "pope", "name": "The Gnome Pope", "title": "Neighbourhood Boss · The Gnome Garden", "boss": true, "stats": {"hp": 1300, "dmg": 32, "speed": 3, "xp": 3000}, "ranged": false, "barks": ["Kneel, lawn-defiler.", "Bless this garden. Curse you."], "chamber": null, "narr": {"title": "THE GNOME POPE", "sub": "Boss of the Gnome Garden. Supreme Pontiff of the Patio.", "lines": ["The Gnome Pope. A garden gnome six feet tall, in white and gold vestments, a mitre as tall as he is, carried around the Gnome Garden on a wheelbarrow by forty smaller gnomes, waving at nobody.", "He blesses the HOA's fines. Every fine in Suburbia is holy, signed in triplicate and sprinkled with water from a birdbath. Unpaid fines become monsters, and the Pope is the one who breathes life into them, with a wink and a little wave.", "He thinks he's doing God's work. Which god, nobody's ever asked. He's too busy being carried around in a wheelbarrow to wonder.", "Strengths: a holy smite that hurts like a brick through a window, an endless supply of gnomes and a wheelbarrow ram that'll take your shins off. Weaknesses: he's ceramic, he's top-heavy, and if you knock the hat off he loses all his power.", "Un-bless the bastard. Then go and pay your fines."]}}, {"id": "portcullis_knight", "name": "Portcullis Knight", "title": "Camp Boss · The Gatehouse", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "PORTCULLIS KNIGHT", "sub": "Boss of the Gatehouse. Lowers the drawbridge.", "lines": ["The Portcullis Knight. A colossal suit of armour, nine feet tall, with a portcullis welded to the front of its helmet as a visor and a great chain wrapped round one arm that drops the drawbridge into Castle Dread.", "He guards the gate. Nobody gets into Castle Dread without beating him, and nobody has, this season. He's been standing at the gate for forty years, and the drawbridge only drops for whoever proves themselves.", "There's someone in this one, unlike the other guards. Someone very old, very tired, sealed in when the armour was forged. You can hear him breathing, slow and wet, behind the portcullis.", "Strengths: he's armoured, he swings that chain like a flail and his charge shakes the gatehouse. Weaknesses: his weight. He's slow to turn.", "Beat him and he'll kneel, and lower the bridge, and raise his portcullis visor. Look inside. Then wish you hadn't."]}}, {"id": "pylon", "name": "Sergeant Pylon", "title": "Neighbourhood Boss · Pylon Point", "boss": true, "stats": {"hp": 520, "dmg": 16, "speed": 3.3, "xp": 650}, "ranged": false, "barks": ["HALT! This is a CONE ZONE!", "Lads! Fall in!", "You are parked in MY spot.", "I have twenty years on the force. Okay, two. In cones."], "chamber": null, "narr": {"title": "SERGEANT PYLON", "sub": "Boss of Pylon Point. Keeper of the Chained Stairwell.", "lines": ["Sergeant Pylon. Fat, loud, tusked, permanently furious and sweating through a safety vest he's been wearing for eleven years. The single most powerful goblin on the Undercroft, and he wants you to know it.", "Pylon holds the key to the stairwell down. He charges a toll in cones, and he's built Pylon Point into a fortress of the bloody things, stacked higher every year, and he patrols it at night muttering to himself like a man guarding a bomb.", "Because he is. Under the Point, beneath all those cones, something knocks. It counts in sevens. Pylon is the only one who listens to it, and he's terrified. Every cone he stacks is a promise that it stays down there.", "Strengths: a big slam, a charge that'll flatten you, a whistle that brings his lads running, and an absolute refusal to lie down. Weaknesses: his temper, his ego, and his fear. Find out what he's scared of and you might not need to fight him at all.", "You can kill him. You can buy him off. Or, if you've been paying attention, you can ask him what's under the stairs. He's been waiting a very long time for someone to ask."]}}, {"id": "ratings_ghoul", "name": "Ratings Ghoul", "title": null, "boss": false, "stats": {"hp": 102, "dmg": 13, "speed": 3.5, "xp": 64}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "RATINGS GHOUL", "sub": "They feed on numbers.", "lines": ["Ratings Ghouls. Pale, gaunt, grey-skinned creatures in suits, with numbers scrolling across their foreheads and long, long fingers that twitch like they're scrolling through something.", "They feed on ratings. Your fans, your views, your popularity. They suck the numbers out of contestants until there's nothing left but a husk, a forgotten name and a zero.", "They're always hungry. Always. A ratings ghoul is never satisfied. It's never enough. It's never, ever enough. You've met people like this. You've probably shagged one.", "Strengths: they drain your fans, they swarm and they're drawn to whoever's most popular. Weaknesses: they starve on obscurity. Be boring.", "If one ever tells you that you're 'trending', run."]}}, {"id": "ratking", "name": "Ratking Choir", "title": null, "boss": false, "stats": {"hp": 95, "dmg": 12, "speed": 3.4, "xp": 58}, "ranged": false, "barks": ["All in favour?", "Squeak."], "chamber": null, "narr": {"title": "RATKING CHOIR", "sub": "The Undercity's voters. All in favour.", "lines": ["Ratking Choirs. A dozen rats with their tails tied together in a great wriggling knot, moving as one, squeaking in harmony, with a dozen pairs of beady eyes and one shared opinion.", "In the Undercity, they're citizens. Proper citizens, with votes. Each knot counts as one voter, which is more than the humans get, and they always vote the same way, which is however the Rat Throne King tells them to.", "Their tails are knotted so tight they can't come apart. They eat together, sleep together, shit together. It's a political commentary. Make of it what you will.", "Strengths: they swarm, they bite from twelve directions at once and they're very hard to kill all of. Weaknesses: they can't agree on which way to run. Cut the knot.", "Ask one who they're voting for, and they'll all answer at once. In twelve different voices. All saying the same name."]}}, {"id": "ratthrone", "name": "The Rat Throne King", "title": "Neighbourhood Boss · The Rat Throne", "boss": true, "stats": {"hp": 520, "dmg": 15, "speed": 3.1, "xp": 1100}, "ranged": false, "barks": ["Kneel. Everyone kneels."], "chamber": null, "narr": {"title": "THE RAT THRONE KING", "sub": "Boss of the Rat Throne. Kneel.", "lines": ["The Rat Throne King. The biggest Ratking Choir in the Undercity: three hundred rats knotted together into the shape of a fat old monarch, sitting on a throne made of more rats, wearing a crown made of, yes, rats.", "He controls every ratking on the east side. They vote how he votes. He votes for whoever kneels to him first, and so far, that's always been the Undermayor, who kneels very prettily for a man with his bad knees.", "Nobody's ever refused to kneel. It's never occurred to anyone. He doesn't even know what he'd do.", "Strengths: he's three hundred rats, he summons more rats and he can split into a swarm when he's hurt. Weaknesses: his ego. Refuse to kneel and he'll come apart at the seams. Literally.", "Stand tall. Look him in his six hundred eyes. And say 'no'. It's the best feeling in the Undercity."]}}, {"id": "repo", "name": "Repossessor Mk. IX", "title": "Neighbourhood Boss · The Repo Yard", "boss": true, "stats": {"hp": 520, "dmg": 15, "speed": 3.1, "xp": 1100}, "ranged": false, "barks": ["ITEM FLAGGED FOR RECOVERY."], "chamber": null, "narr": {"title": "REPOSSESSOR MK. IX", "sub": "Boss of the Repo Yard. Item flagged for recovery.", "lines": ["Repossessor Mk. IX. A rusting yellow machine the size of a tractor, with a crane arm, a grabber claw and a bright red light on top, endlessly announcing 'ITEM FLAGGED FOR RECOVERY' in a voice like a broken satnav.", "It repossesses things. Gear, weapons, armour, boots, the occasional arm. If you've been given something by a sponsor, the Repossessor thinks it's still theirs. And it's right. Read the small print. It's always right.", "It was the ninth model. Nobody knows what happened to the first eight, but the Repo Yard is full of scrap, and some of the scrap is yellow, and some of the scrap is still twitching.", "Strengths: it grabs and yanks, it charges like a bulldozer and it repossesses your buffs mid-fight. Weaknesses: its paperwork. Show it a receipt and it has to check.", "Repossess the repossessor. Strip it for parts. It'll announce 'ITEM RECOVERED' as you take its battery, and you'll feel a real sense of justice."]}}, {"id": "sanking", "name": "The Sanitation King", "title": "City Boss · The Landfill Barge", "boss": true, "stats": {"hp": 1150, "dmg": 19, "speed": 3.1, "xp": 2600}, "ranged": false, "barks": ["Everything ends up here. Everything.", "Take out the trash."], "chamber": null, "narr": {"title": "THE SANITATION KING", "sub": "City Boss of the Landfill Barge. Everything ends up here.", "lines": ["The Sanitation King. A mountain of a man made of rubbish, bin bags for skin and a crown made of a traffic cone, a bike wheel and a toilet seat, sitting on a throne of mattresses on the deck of a barge that is ninety per cent landfill.", "Every bit of rubbish from every floor above comes down here eventually, and he decides what happens to it. He takes some. He keeps some. Most of it, he just sits on. He's been blocking the Great Outfall with his barge for years, so the Cistern never drains, so the Undercity stays wet, so he stays in charge.", "He's not cruel. He's just a man who found out that if you sit on enough shit for long enough, people start calling you 'Your Majesty'.", "Strengths: he's huge, he summons wyrms from the rubbish, he throws bins like cannonballs and his charge could flatten a terrace. Weaknesses: he's rubbish. He burns, he rots and he falls apart if you pull the right bag out.", "Move him. Sink him. Set fire to him. Whatever it takes. The stairs are under ten metres of his stubbornness."]}}, {"id": "scavenger", "name": "Scavenger", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.8, "xp": 45}, "ranged": false, "barks": ["Toll's due!", "Nothing personal. It's all personal.", "Grab the bag, I'll grab the face!", "Should've paid, friend."], "chamber": null, "narr": {"title": "THE SCAVENGERS", "sub": "A contestant crew. Loot first, ask never.", "lines": ["The Scavengers. A crew of contestants led by the Vasquez Twins, who look like they've raided every corpse between here and the stairs, because they have. They're wearing three people's armour and none of it fits.", "They loot everything. Bodies, chests, camps, you. They'll take your kills, your drops and your pants if you leave them on a radiator. They're the reason every loot box on the floor is already open when you get there.", "The thing is, they're not bad people. They're people who worked out early that the dungeon doesn't care, and decided not to either. They'd rob your corpse, sure. But they'd close its eyes first.", "Strengths: they're ruthless, they're organised and they've got everything you were about to find. Weaknesses: they bicker constantly, they don't trust each other, and they'll bail the second a fight goes wrong.", "Shake them down, pay them off, or run with them a while. One day, one of the twins will save your life, and she'll never let you forget it."]}}, {"id": "senate", "name": "The Rat Senate", "title": "Borough Boss · The Rat Senate", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["The motion carries!"], "chamber": null, "narr": {"title": "THE RAT SENATE", "sub": "Borough Boss of the Rat Senate. The motion carries.", "lines": ["The Rat Senate. Thirty rats in tiny togas, sitting in a horseshoe of tiny marble seats, amending things. Constantly. Forever. Their chamber smells of piss and procedure.", "They are the Undercity's legislature, and they have never passed a single law, because every motion gets amended, and every amendment gets amended, and every amendment to the amendment gets filibustered by a rat called Gerald who just squeaks for nine hours.", "They're the only body in the Undercity that can certify an election. Which means if you want to win, you need thirty rats to agree on something. Good luck. Good fucking luck.", "Strengths: they summon Ratking Choirs, throw scrolls of legislation like knives and swarm when the vote turns. Weaknesses: they can't act until a motion passes. Call the question.", "Win the Senate's vote and they'll bang a tiny gavel and squeak 'the motion carries' in perfect unison. It's the proudest they've been in decades."]}}, {"id": "shusher", "name": "Shusher", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "SHUSHER", "sub": "Keepers of the Stacks' silence.", "lines": ["Shushers. Tall, stooped librarians in grey cardigans, with no mouths, just a finger permanently pressed to where a mouth should be, and ears the size of dinner plates, turning, always turning, towards any sound.", "The Stacks have one rule: silence. The Shushers enforce it. A footstep too loud, a cough, a page turned too sharply, a fart in the reading room, and they come gliding out of the shelves, dozens of them, going 'SHHHHHHHH' in a sound like a gas leak.", "Then they go 'SHHHHHHHH' harder. And harder. Until your eardrums burst, and then everything is very quiet indeed, and the Shushers are very satisfied.", "Strengths: they hear everything, they come in numbers and their shush is a weapon. Weaknesses: they're slow, and they can't stand noise. Make enough of it and they'll clutch their heads and flee.", "Tiptoe. Seriously. Tiptoe everywhere on this floor. Hold your farts in. Your life depends on it."]}}, {"id": "slime", "name": "Bounce-House Slime", "title": null, "boss": false, "stats": {"hp": 64, "dmg": 10, "speed": 3.2, "xp": 32}, "ranged": false, "barks": ["*boing*", "*wobbly laughter*", "*squelch*"], "chamber": null, "narr": {"title": "BOUNCE-HOUSE SLIME", "sub": "Party entertainment. Still bouncing.", "lines": ["Bounce-House Slimes. Wobbling, giggling lumps of pink and blue goo, about the size of a sofa, that hop around the Bounce Castle at children's-party speed and smell of fruit squash and sick.", "They were birthday party slimes, hired by the Mall to keep the kiddies entertained. Then the party never ended. Nine years of the same party. Same song. Same cake. The slimes have been bouncing so long they've forgotten how to stop.", "If you get swallowed by one, you'll bob about inside it, perfectly preserved, giggling, until somebody pops it. There are contestants inside some of these that went in during the first season and are still having a lovely time.", "Strengths: they absorb hits like a waterbed, they split into smaller slimes, and they bounce you clean across the room. Weaknesses: sharp things, heat, and anything that stops the music.", "Remember, kids: if you're happy and you know it, you're probably inside a slime."]}}, {"id": "sludge", "name": "Auntie Sludge", "title": "Neighbourhood Boss · Hag Hollow", "boss": true, "stats": {"hp": 1500, "dmg": 36, "speed": 2.8, "xp": 3600}, "ranged": false, "barks": ["Grandma’s soup was always too salty.", "Stay for dinner. Forever."], "chamber": null, "narr": {"title": "AUNTIE SLUDGE", "sub": "Boss of Hag Hollow. Sells scent masks.", "lines": ["Auntie Sludge. The biggest, oldest, wettest hag on the Canopy, sitting in a cauldron of her own swamp water like it's a hot tub, up to her many chins in it, with frogs nesting in her hair.", "She sells scent masks to contestants hunted by the safari. Rub her mud on you and the hunters can't track you. It works. It's brilliant. It also smells like a dead badger stuffed with Stilton, and it never, ever washes off.", "Her price is your company. Forever. Every contestant she's ever helped is still in Hag Hollow, slowly turning green, keeping her company in the swamp. She calls them her nephews. They call her Auntie. They have no choice.", "Strengths: mud bombs, swamp puddles that suck you down, and a summoning croak that brings every hag in the canopy. Weaknesses: she can't leave the cauldron. Not without a crane.", "Get the mask. Don't stay for tea. And for the love of God, do not let her kiss you goodbye."]}}, {"id": "soloist", "name": "The Soloist", "title": "Neighbourhood Boss · The Opera House", "boss": true, "stats": {"hp": 520, "dmg": 15, "speed": 3.1, "xp": 1100}, "ranged": false, "barks": ["*one endless, perfect note*"], "chamber": null, "narr": {"title": "THE SOLOIST", "sub": "Boss of the Opera House. One endless note.", "lines": ["The Soloist. A diva in a ballgown that was white once, with a beehive of grey hair and a face powdered so thick it cracks when she breathes, standing alone on the Opera House stage, holding one note.", "She has been holding that note for decades. It started as the final note of her final aria on her final night, and when it ended, the applause would end, and she couldn't bear it. So she just didn't stop.", "The whole east side of the Undercity votes however she sings, because her note is the most beautiful sound anyone's heard in a hundred years. She lost her sheet music long ago. She doesn't know what comes next. She's terrified to find out.", "Strengths: sound waves that shatter glass, bone and dignity, and a fungal choir backing her up. Weaknesses: silence. Or giving her the next note.", "Find her score. Let her finish. When she does, the silence afterwards will be the loudest thing you've ever heard."]}}, {"id": "stagehand", "name": "Stagehand", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "STAGEHAND", "sub": "Backlot crew. Dressed in black.", "lines": ["Stagehands. Wiry figures dressed head to toe in black, with gaffer tape round their wrists, headsets over their ears and faces you can never quite see, because the whole point of a stagehand is that you're not supposed to notice them.", "They move the sets. They rig the lights. They clean up the blood between takes. They've been doing it so long that they've become part of the scenery: you can walk past fifty of them on the Backlot and never realise any of them were there until one of them's strangling you with a cable.", "They take orders from the Floor Manager and nobody else. They don't talk. They whisper into their headsets, and somewhere, something whispers back.", "Strengths: they're invisible until they aren't, they come from behind and they'll drop a light rig on your head from forty feet up. Weaknesses: they're crew, not cast. Get them on camera and they freeze like rabbits.", "Kill one and another one quietly removes the body. You'll never see who."]}}, {"id": "static_king", "name": "Static King", "title": "Camp Boss · The Dish Array", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "STATIC KING", "sub": "Boss of the Dish Array. Reroutes everything.", "lines": ["The Static King. A giant made of television snow, thirty feet tall, standing in the middle of the Dish Array with satellite dishes for shoulders and an aerial for a crown, crackling so loud you can hear him three fields away.", "He reroutes the signal. If any part of the Transmitter goes down, the Static King routes the broadcast around it. Dead air is impossible while he's standing. He's the reason nobody has ever, ever turned the Network off.", "He's the Mother of Static's favourite son, and the most smug, self-satisfied lump of interference you've ever met. He talks over you. Constantly. He's every man in every meeting you've ever been in.", "Strengths: lightning, dishes he aims at you like cannons and a court of Static Men. Weaknesses: the dishes. Break them and he can't reroute anything.", "Topple him and the whole Array goes dark, dish by dish, with a sound like someone pulling the plug on God."]}}, {"id": "static_man", "name": "Static Man", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "STATIC MAN", "sub": "The Transmitter's interference. Kssshhh.", "lines": ["Static Men. Tall, flickering figures made of television snow, the grey fizz between channels, crackling and hissing, with faces that are just a blur and voices that sound like a radio losing signal in a tunnel.", "They're interference. Every broken broadcast, every dropped signal, every bit of noise the Transmitter throws off ends up taking shape and walking around the dish fields, buzzing like a fridge with a grudge.", "Touch one and your teeth fizz, your hair stands up and, for one hideous second, you can hear every channel at once, including the shopping one, and the one with the bloke selling knives.", "Strengths: they shock, they disrupt your abilities and they pass through walls like a bad smell. Weaknesses: a clear signal. Tune them in.", "Kill one and it goes 'kssshhhhh' and fades out, like a telly at the end of the night when your dad's fallen asleep in front of it with his hand down his trousers."]}}, {"id": "taxidermist", "name": "The Taxidermist", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [6, "The Trophy Hall"], "narr": {"title": "THE TAXIDERMIST", "sub": "The Trophy Hall. You'll look lovely mounted.", "lines": ["The Taxidermist. A thin, wet-lipped man in a leather apron, with glass eyes in a jar on his belt and a needle and thread, standing in a hall full of stuffed contestants, each posed in their most dramatic moment.", "He works for the Lodge. Every trophy the hunters take, he mounts. Heads, mostly. Sometimes whole bodies. He's very, very good. His work's been exhibited up there. People have paid millions.", "He'll measure you with his eyes as you come in. He's already picked a pose for you. It's undignified. It's mostly arse.", "Strengths: hooks, a stuffing gun and stuffed trophies that come back to life when he whistles. Weaknesses: he's precious about his work. Damage a trophy and he'll go to pieces."]}}, {"id": "the_absence", "name": "The Absence", "title": "Floor Boss · The Builders' Seat", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE ABSENCE", "sub": "Floor Boss of the Builders' Seat. The one nobody names.", "lines": ["The Absence. Nothing. A chair, in an empty room, at the bottom of everything, with nobody in it. And yet, when you look at the chair, something looks back.", "It's what the Builders were. Or what they became. Or what they left behind when they went. Every temple has an empty plinth for it. Every god is afraid of it. It has never once been seen, because there's nothing there to see.", "It's been waiting for someone to come and sit down. It doesn't care who. It doesn't care why. It just needs somebody in the seat, because a machine needs an operator, and the Stack has been running on autopilot for a very, very long time.", "Strengths: everything. It is the Stack. Weaknesses: you. You're the first thing that's ever got here and had a choice.", "So: what are you going to do? Sit down? Switch it off? Or open every door and let the gods out? Nigel's going to have to stop talking now. This one's yours."]}}, {"id": "the_archivist", "name": "The Archivist", "title": "Floor Boss · The Restricted Section", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE ARCHIVIST", "sub": "Floor Boss of the Restricted Section. Keeps the only key.", "lines": ["The Archivist. A tall, robed figure with no face, just a blank page where a face should be, slowly writing itself. Its hands are quills. Its robes are shelves. It has been reading your book for a very long time.", "It keeps the Restricted Section, where the Builders' first records are kept. The Archivist has read them all. It knows what the Stack is for. It knows why you were taken. It knows exactly how your story ends, and it's been waiting for your book to reach this chapter.", "It's not your enemy. It's the keeper of the truth, and it has decided the truth is too dangerous. Its job is to make sure nobody reads the last page. Including you.", "Strengths: it writes your moves before you make them, it summons bookwyrms and shushers and it can erase your buffs with a stroke. Weaknesses: improvise. Do something that isn't in the book.", "Get the key. It'll let you have it, in the end, with a sigh. 'Very well,' it'll say. 'Turn the page.'"]}}, {"id": "the_backup", "name": "The Backup", "title": "Camp Boss · The Tape Library", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE BACKUP", "sub": "Boss of the Tape Library. A copy of everything.", "lines": ["The Backup. A towering figure built of magnetic tape reels, spinning and whirring, with a hundred faces flickering across its surface: copies of everyone whose memory is stored in the Tape Library.", "It's a backup. Of everything. Every contestant who's ever been stored here, every Builder record, every save. It contains the Builders' last message, in pieces. It also contains a version of you, from the moment you came down the stairs.", "It doesn't know which version is the real one. It doesn't know if it's a copy or an original any more. It's very confused, and very, very large.", "Strengths: it plays back your own attacks at you, it summons bit rot and it can restore itself. Weaknesses: overwrite it.", "When it dies, the tapes unspool across the floor, and some of them are still playing, very quietly. Listen."]}}, {"id": "the_banquet", "name": "The Banquet", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [14, "The Banquet Hall"], "narr": {"title": "THE BANQUET", "sub": "The Banquet Hall. As the main course.", "lines": ["The Banquet. A dining table forty feet long, laden with rotten food, that has stood up on its legs, with a mouth where the head of the table should be and cutlery for teeth, inviting you to dinner. As dinner.", "It's the Count's great hall. Every night, the banquet scene plays out: the guests arrive, the food is served, and the guests become the food. The table's been doing it for forty years. It's absolutely stuffed.", "Your place card is waiting. You're seated between a skeleton and a man with an apple in his mouth.", "Strengths: plates thrown like discuses, a mouth that swallows you whole and a food fight that is literally deadly. Weaknesses: table manners. Dress for dinner, and it has to treat you as a guest."]}}, {"id": "the_capo", "name": "The Capo", "title": "Camp Boss · The Ultras' End", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE CAPO", "sub": "Boss of the Ultras' End. Leads the chant.", "lines": ["The Capo. A thick-necked man with a megaphone and his back permanently to the pitch, standing on a fence, leading the Ultras in song, with a face red from forty years of shouting and lungs like a pair of bagpipes.", "He conducts the Away End like an orchestra of violence. He chooses the songs. He chooses the targets. He chooses when to charge. He has never watched a single minute of football, and he's furious about every result.", "He needs a new anthem. The old one's got stale. The lads are bored. And a bored Ultra is a dangerous Ultra, mainly to himself.", "Strengths: he rallies the Ultras, his chants buff the whole End and his megaphone blast knocks you flat. Weaknesses: the megaphone. Take it. He's nothing without it.", "Give him a better song and he'll weep, and hug you, and smell of lager and smoke. Beat him and the End falls silent for the first time in history."]}}, {"id": "the_censor", "name": "The Censor", "title": "Camp Boss · The Censor's Office", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE CENSOR", "sub": "Boss of the Censor's Office. Redacts people.", "lines": ["The Censor. A man with a black bar where his eyes should be, another over his mouth, a third over his crotch for reasons that, frankly, you don't want to explore, sitting behind a desk with a big black marker pen, redacting.", "He decides what the audience is allowed to see. Swearing, bleeped. Violence, approved. Truth, redacted. He has redacted whole contestants out of existence, and he did it with a big black pen while humming.", "He's very prim. He thinks you're filthy. He thinks the whole dungeon's filthy. And he's right, honestly. He's just wrong about which bits.", "Strengths: he silences your abilities, he blinds you, and he redacts you right off the screen. Weaknesses: his keys. He holds the keys to the whole broadcast, and he's terrified of losing them.", "Take his keys. When you do, say something absolutely disgusting. He'll faint. Every time."]}}, {"id": "the_champion", "name": "The Champion", "title": "Floor Boss · The Centre Circle", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE CHAMPION", "sub": "Floor Boss of the Centre Circle. Last season's winner.", "lines": ["The Champion. A huge man in a gleaming gold kit, every muscle oiled, a trophy in one hand and a belt on his waist, surrounded by spotlights, cameras and forty thousand screaming people who'd die for him. Some of them have.", "He won last season. He's the last person to beat Ratings Week, and his prize was this: to be kept alive, here, in the Centre Circle, as the boss you have to beat. Forever. Until someone does.", "He's tired. He's been the Champion for a year, and he's had nothing to do but win and win and win, and every time he wins, someone dies. He's started to hate the sound of applause.", "Strengths: everything. He's fast, strong, armoured, the crowd roars every time he lands a hit and the crowd buffs him. Weaknesses: he doesn't want to be here.", "As you walk out, he'll lean in and whisper: 'Don't win.' He means it. He's the only person in the Arena trying to help you."]}}, {"id": "the_chroma", "name": "The Chroma", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [16, "The Green Screen"], "narr": {"title": "THE CHROMA", "sub": "The Green Screen. Now you see it.", "lines": ["The Chroma. A shape you can only see the edges of, against the vast green screen of the Transmitter's studio, because it's exactly the same colour as the screen. Bright, flat, nauseating green.", "It's a keyed-out monster. Everything that's ever been filmed in front of the green screen and removed in post ended up here. It's what's left when you take everything out of a picture.", "It can be anywhere on the screen. It can be anything. It can be right behind you. It is right behind you.", "Strengths: invisibility against green, sudden appearances and it can put anything in the background. Weaknesses: the one green thing that's real. Find it. Ring the studio bell."]}}, {"id": "the_count", "name": "The Count", "title": "Floor Boss · The Keep", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE COUNT", "sub": "Floor Boss of the Keep. Never stopped playing the part.", "lines": ["The Count. A tall, gaunt man in a black cloak lined with red silk, with slicked-back hair, a widow's peak, two very long canines and the most magnificent, theatrical, over-the-top voice you have ever heard in your life.", "He's an actor. He was cast as the Count of Season Nine, the Network's horror season, and when the season ended, he didn't. He stayed in the Keep, in costume, in character, and he's been playing the Count every night for forty years, for an audience that died decades ago.", "He's not a vampire. He thinks he's a vampire. He's committed so hard to the role that it's become true in every way that matters. He drinks blood. Not because he needs to. Because the Count would.", "Strengths: he's fast, he summons the castle against you and his monologues drain your will to live. Weaknesses: he needs his audience. Give him a better ending.", "Give the Count his final curtain. When he dies, he'll take a bow. A real, deep, perfect bow. And somewhere, far away, someone will be clapping."]}}, {"id": "the_cutter", "name": "The Cutter", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [10, "The Edit Suite"], "narr": {"title": "THE CUTTER", "sub": "The Edit Suite. You won't make the final cut.", "lines": ["The Cutter. A tall, thin figure in a black polo neck with a pair of scissors for hands and strips of film wrapped round its body, standing in the Edit Suite surrounded by bins full of cut footage.", "It edits. Every episode, every scene, every contestant. It decides what stays and what goes. And what goes, goes. Snip. Gone. Every contestant who was ever cut from the show is in those bins, in tiny strips of film, still moving.", "That screening of your deleted scenes? It's real. It's just that you're about to be one.", "Strengths: scissors that cut through anything, jump-cuts that teleport it and the ability to edit your attacks out. Weaknesses: the film. Without footage, it's got nothing to cut."]}}, {"id": "the_director", "name": "The Director", "title": "Floor Boss · The Gallery", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE DIRECTOR", "sub": "Floor Boss of the Gallery. Runs every camera.", "lines": ["The Director. A small, intense woman in a black polo neck, with headphones on, a hundred screens in front of her and a voice that cuts through everything: 'Camera three. Camera three. CAMERA THREE.'", "She runs the Gallery. Every camera in the dungeon feeds into her screens. She decides what the audience sees, and when, and from what angle. She's been doing it for longer than you've been alive, and she hasn't blinked once.", "She knows about the dead air. She knows about the off-air engineer. She's been waiting. She's been planning. She has a camera on you right now, and she's chosen the angle that makes your arse look biggest.", "Strengths: she controls every camera, she summons ghouls and static and she cuts you off mid-ability. Weaknesses: dead air. In the dark, she's blind.", "Take the Gallery. Sit in her chair. Look at all those screens. Every one of them is someone, somewhere, watching you."]}}, {"id": "the_extras", "name": "The Extras", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE EXTRAS", "sub": "Background artists. No lines.", "lines": ["The Extras. Dozens of people in costumes from a dozen different sets: cowboys, astronauts, Victorian chimney sweeps, a nun, a man in a hot dog suit, all standing exactly where they were told to stand, with blank smiles and dead eyes.", "They were contestants. All of them. Contestants who got to the Backlot and got cast as background, and never got a line, and never got a close-up, and never got to leave. They've been crossing the same street in the back of the same shot for years.", "They get paid in sandwiches. They've been told that if they're very, very good, one day they'll be promoted to a speaking role. Nobody ever has been. One of them once said 'rhubarb', and they took him away.", "Strengths: there are always more of them, they mob you in a crowd and they're in every bloody shot. Weaknesses: they don't have motivation. Literally. Nobody's told them what it is.", "If one of them looks at you and mouths 'help', walk faster. That's how it starts."]}}, {"id": "the_face", "name": "The Face", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [12, "The Makeup Chair"], "narr": {"title": "THE FACE", "sub": "The Makeup Chair. Everyone's face, at once.", "lines": ["The Face. A shape in the makeup chair, under a sheet, that, when the sheet comes off, is a body wearing every face anyone's ever had done in Hair and Makeup, all at once, stitched together, blinking out of sync.", "Every face the Makeup Witch ever got wrong ended up here. Every bad makeover. Every botched contour. They all crawled into the chair together and became this.", "It wants your face. It's not fussy. Any face will do. It'll take yours and add it to the collection, right between a newsreader and somebody's nan.", "Strengths: it wears your face to confuse you, it screams with a hundred mouths and it grabs. Weaknesses: water. Makeup runs. So do the faces."]}}, {"id": "the_feed", "name": "The Feed", "title": "Camp Boss · The Ratings Room", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE FEED", "sub": "Boss of the Ratings Room. Your number, live.", "lines": ["The Feed. A great swollen thing of screens, hundreds of them, stitched together into a body, each one scrolling numbers, comments, likes, hearts and, mostly, abuse, at a speed that makes you feel sick.", "It's the Ratings Room, made flesh. It knows your number. It knows everyone's number. It decides whose number goes up and whose goes down, and it does it based on nothing, absolutely nothing, but whether you're interesting right now.", "It's horrible. It's addictive. It's every bad night you've ever spent scrolling your phone in the dark until three in the morning, given a body and a grudge.", "Strengths: it changes your fans mid-fight, it summons ghouls and it hurls comments at you that hurt more than knives. Weaknesses: unplug it.", "Unplug the Feed and the screens go black, one by one, and the silence is the sweetest thing you've ever heard. Then you'll want to check your number. Don't."]}}, {"id": "the_firewall", "name": "The Firewall", "title": "Camp Boss · The Firewall", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE FIREWALL", "sub": "Boss of the Firewall. Access denied.", "lines": ["The Firewall. A wall. Literally. A wall of red light and burning code, forty feet high, stretching across the Cold Store between you and the Core, with a single great eye in the middle, scanning.", "Nothing gets into the Core without its permission. Not people, not data, not tapes. It checks every packet, every person, every thought, and it rejects all of them, as a matter of policy.", "It's been protecting the Core from the Network for longer than the Network has existed. It doesn't know you're on the same side. It doesn't know anyone is on any side.", "Strengths: it burns, it blocks, and it calls bit rot and crawlers. Weaknesses: the right credentials. Or a big enough breach.", "Breach it and it flickers, and stutters, and says, in a tiny voice, 'Access granted.' It's never said that before."]}}, {"id": "the_first_contestant", "name": "The First Contestant", "title": "Camp Boss · The Echo Hall", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE FIRST CONTESTANT", "sub": "Boss of the Echo Hall. The first one down.", "lines": ["The First Contestant. A thin old man in rags, a beard down to his knees, sitting cross-legged in the middle of the Echo Hall, talking. Constantly. Every word bounces off the walls a hundred times.", "He was the very first person to come down the stairs. Before the Network. Before the Host. Before contestants. The Builders brought him here to test the Stack, and he went all the way down, and he's been sitting here ever since, talking, because nobody ever came to hear him.", "He knows what the Stack is for. He knows what the Builders were. He knows what's in the Builders' Seat. And he's desperate, absolutely desperate, to tell someone. He's been rehearsing it for ten thousand years.", "Strengths: his voice is a weapon in the Echo Hall, every word multiplied a hundred times. Weaknesses: he wants to talk. Let him.", "Hear him out, or silence him. If you hear him out, you'll know what you're choosing. If you silence him, you'll choose blind. Either way, he'll thank you."]}}, {"id": "the_host", "name": "The Host", "title": "Floor Boss · The Studio", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE HOST", "sub": "Floor Boss of the Studio. The Previous Winner.", "lines": ["The Host. The man himself. Tall, tanned, white-toothed, immaculately suited, with a microphone in one hand and a cue card in the other, standing in the middle of his own Studio in front of a live studio audience, beaming at you like you're the best thing that ever happened to him.", "He's hosted every season since the Network began. He's welcomed every contestant, mocked every death and celebrated every victory. He's the most famous face in the universe. He's never once stopped smiling. His cheeks must be fucking agony.", "And he was a contestant. The very first winner. He came down the stairs, he went all the way, and when he got to the bottom, they offered him this. Winning is how you become the Host. And there can only ever be one.", "Strengths: he controls the whole studio, he summons every clone and every fan and the audience buffs him every time he lands a gag. Weaknesses: he's tired. He's so tired. And he's scared of what's below.", "Face him. And when it's over, whatever happens, look at the empty chair behind his desk. That's yours, if you want it."]}}, {"id": "the_laugh_track", "name": "The Laugh Track", "title": "Camp Boss · The Laugh Track Factory", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE LAUGH TRACK", "sub": "Boss of the Laugh Track Factory. Decides what's funny.", "lines": ["The Laugh Track. A great grey machine of reels, tapes and speakers in the middle of the Factory, with a face made of an old reel-to-reel and a mouth that's a speaker cone, guffawing, chuckling, howling, tittering, all at once, constantly.", "It decides what's funny. On the Network, if the Laugh Track laughs, it's comedy. If it doesn't, you're dead air. It has never laughed at anything genuinely funny in its life.", "It's wired to every Laugher in the Factory. Every laugh they make feeds into it. It's built of a thousand people's mirth, and it's never once enjoyed any of it.", "Strengths: sonic laughs that shatter your bones, cue lights that make the Laughers attack and it can laugh you to death. Weaknesses: tell it a genuinely good joke. It doesn't know what to do.", "Get it on your side and every audience in the dungeon will laugh at you. That's useful. Horrible, but useful."]}}, {"id": "the_manager", "name": "The Manager", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [11, "The Dugout"], "narr": {"title": "THE MANAGER", "sub": "The Dugout. Sacked nine times. Still here.", "lines": ["The Manager. A red-faced man in a long coat with a clipboard, chewing gum like it owes him money, standing in the dugout screaming at players who aren't there.", "He's been sacked nine times. Every time, he comes back. Nobody knows how. He just turns up the next season in the dugout, chewing, swearing, with a new tactical philosophy he's read in a book.", "He's convinced he's one more season away from greatness. He's not. He's been relegated from three different dimensions.", "Strengths: he throws water bottles like grenades, calls in his subs and his half-time team talk buffs everything around him. Weaknesses: the floodlights. In the dark, he can't see the tactics board."]}}, {"id": "the_mother", "name": "The Mother", "title": "Camp Boss · The Trophy Room", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE MOTHER", "sub": "Boss of the Trophy Room. Kept every trophy.", "lines": ["The Mother. The Host's mother. An immaculately dressed woman in pearls and a twinset, with lacquered hair and a smile as rigid as a mannequin's, standing in a room full of trophies, polishing them. Every single one.", "She kept every trophy her son ever won. Every swimming certificate. Every school prize. Every gold star. Every award, every ratings record, every Network accolade. She polishes them all day, every day, and she has never once told him she was proud of him.", "She's the reason he is the way he is. She wanted a star. She got one. She just never thought about what it would cost him, and she's never once cared.", "Strengths: she throws trophies, summons clones and her disapproval is a physical weapon. Weaknesses: the first trophy. The one he won as a little boy. Break it.", "Get past her, and she'll look at you, coldly, and say, 'He could have been anything.' She doesn't mean it as a compliment."]}}, {"id": "the_ossuary", "name": "The Ossuary", "title": "Camp Boss · The Crypts", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE OSSUARY", "sub": "Boss of the Crypts. Conducts the Bone Choir.", "lines": ["The Ossuary. A great creature made of skulls and bones, stacked into the shape of a conductor, with a femur for a baton and a choir of skeletons arranged before it in the vaults beneath Castle Dread.", "Everyone who dies in Castle Dread ends up in the crypts eventually. The Ossuary collects the bones, cleans them and arranges them. Some it adds to itself. The rest join the Bone Choir and sing, forever, in a sound like wind through a cemetery.", "The crypts connect to everything. Secret passages run from here to every tower, every dungeon and every chapel. The Ossuary knows them all. It's been conducting down here, in the dark, for decades.", "Strengths: bone spears, a choir whose song damages you and the ability to pull bones from the walls to rebuild itself. Weaknesses: break the baton. No conductor, no choir.", "Silence it and the crypt goes quiet, and you'll hear the castle above you, creaking, waiting for Act Five."]}}, {"id": "the_producer", "name": "The Producer", "title": "Floor Boss · The Producers' Floor", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE PRODUCER", "sub": "Floor Boss of the Producers' Floor. Wants you to stay.", "lines": ["The Producer. A tall man in an immaculate grey suit, no tie, a glass of something expensive in his hand and an office at the top of the Green Room with a view over the whole studio complex. He's never raised his voice. He's never had to.", "He makes the show. Not the episodes, not the scripts: the show. Everything the Network broadcasts comes through his office. He decides who's a star, who's a guest and who's a recurring character.", "And he wants you to be a recurring character. Steady work. A dressing room. Your name on the door. Forever. You'd never have to go deeper. You'd never have to see what's down there. That's the offer, and it's the best offer anyone's going to make you.", "Strengths: contracts that bind, security that floods the room and the ability to cancel your abilities mid-fight. Weaknesses: refusal. He's never been told no.", "Refuse the contract. Watch the smile slip, just for a second. Then he'll say, very quietly, 'Pity,' and press a button under his desk."]}}, {"id": "the_recorder", "name": "The Recorder", "title": "Floor Boss · The Core", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE RECORDER", "sub": "Floor Boss of the Core. Has been waiting to play this.", "lines": ["The Recorder. An enormous reel-to-reel machine in the heart of the Core, built into the ceiling, with tapes as wide as rivers and a voice like an old wireless, crackling with age, waiting.", "The Builders left it a message. Their last. It's been waiting, alone, in the cold, for someone to come and listen. It doesn't fight to kill. It fights to make you listen.", "And the message is this: fans are fuel. The attention of the audience, every hour of watching, every cheer, every view, is power. The Stack runs on it. The Network sells it. And you, contestant, are the furnace.", "Strengths: it plays back every sound you've ever made at you, it summons wraiths and bit rot and it knows all your moves. Weaknesses: listen. Just listen.", "When it's done, it'll click off, and the tape will run out, and the Core will be very, very quiet. And you'll never hear applause the same way again."]}}, {"id": "the_ref", "name": "The Ref", "title": "Camp Boss · The Officials' Room", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE REF", "sub": "Boss of the Officials' Room. Plays and referees.", "lines": ["The Ref. A small, bald man in black and white stripes, with a whistle, a notebook and a set of red and yellow cards that are actually blades. He's not got a single friend in the whole stadium, and he's never wanted one.", "He referees every match in the Arena. He's also, this season, your semi-final opponent. He sees no conflict of interest. He sees nothing at all, in fact, unless it's in his favour.", "He can be bought. Everyone knows he can be bought. The Ultras buy him. The Champion's management buys him. He's been bought so many times that he's rich as fuck and has nothing to spend it on.", "Strengths: yellow cards that slow you, red cards that send you off and a whistle that freezes you mid-swing. Weaknesses: he's tiny. Pick him up.", "Beat him fair or beat him foul. He'll blow his whistle either way, and give you a yellow card on the way down."]}}, {"id": "the_replay", "name": "The Replay", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [11, "The Replay Room"], "narr": {"title": "THE REPLAY", "sub": "The Replay Room. Let's see that again.", "lines": ["The Replay. A figure made of flickering television screens, each one showing the same moment over and over: a goal, a foul, a fall, a contestant dying, from every angle, in slow motion.", "It replays. Everything. Every fight you've had, it's watched, and it can do all your moves, frame by frame, because it's seen them a hundred times. It's seen you trip. It's seen you cry. It's seen you shit yourself in the Ticket Hall, and it's watched that one forty times.", "It wants your highlight tape. It wants to add you to the reel.", "Strengths: it replays your own attacks back at you, in slow motion, at full damage. Weaknesses: do something new. Lose on purpose. It's never seen that."]}}, {"id": "the_restless", "name": "The Restless", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE RESTLESS", "sub": "Castle Dread's dead. Still performing.", "lines": ["The Restless. Grey, shambling dead in the rags of costumes: villagers, monks, maids, peasants with pitchforks, all of them from the cast of Season Nine, the Network's horror season, still playing their parts decades after the audience died.", "They were contestants. They were cast as the dead of Castle Dread. They died for real during filming, and the castle simply kept them on. They walk the graveyard, moan at the windows and leap out of coffins on cue, every night, exactly on schedule.", "They're not trying to kill you. They're trying to scare you. Killing you is just how the scene ends.", "Strengths: they grab, they swarm and there's always another one coming out of the ground. Weaknesses: they're actors. Break the script and they don't know their next line.", "Clap when one scares you. Go on. Give them a round of applause. Some of them will stop and bow. It's the first applause they've heard in forty years."]}}, {"id": "the_runner_up", "name": "The Runner Up", "title": "Camp Boss · The Runner-Up's House", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE RUNNER-UP", "sub": "Boss of the Runner-Up's House. Almost won.", "lines": ["The Runner-Up. A tired-looking man in his forties in a dressing gown, with a silver medal round his neck, a mug of tea gone cold and the haunted eyes of someone who came within inches of winning and has thanked God every day since that he didn't.", "He was last season's runner-up. He made it all the way to the Studio. He stood in front of the Host. And he lost. Just. He's lived in a little house on Main Street ever since, and he never, ever goes out.", "He knows what winning means. He saw it. He saw the contract. He saw what happens to the winner. And he's very, very glad it wasn't him.", "Strengths: he knows all the Host's tricks, he summons clones and he fights like a man defending his home. Weaknesses: he doesn't want to fight. Let him talk.", "Hear him out. Make him a fresh cup of tea. He'll tell you something about winning that'll make your blood run cold."]}}, {"id": "the_showrunner", "name": "The Showrunner", "title": "Floor Boss · The Water Tank", "boss": true, "stats": {"hp": 900, "dmg": 20, "speed": 3.3, "xp": 2400}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE SHOWRUNNER", "sub": "Floor Boss of the Water Tank. Wants a different ending.", "lines": ["The Showrunner. A man in a baseball cap and a gilet over an expensive shirt, sitting in a director's chair on a platform above the Water Tank, with a megaphone, a script and the dead-eyed confidence of someone who's never once been told his idea was shit.", "He's in charge of every episode filmed on the Backlot, including yours. He's written your story. He's written your ending. And he doesn't like it. It's too soft. It needs a twist. It needs you dead in the tank, floating face down, with a slow zoom out.", "He doesn't hate you. He just thinks it'd be better television. And he's not wrong. That's the worst part.", "Strengths: he rewrites the scene mid-fight, he calls the whole crew down on you and he floods the tank. Weaknesses: he can't stand a bad take. Ruin his shot.", "Wrap the bastard. Then walk off the set before he can call 'one more, from the top'."]}}, {"id": "the_stand_in", "name": "The Stand In", "title": "Camp Boss · The Mirror Maze", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE STAND-IN", "sub": "Boss o
