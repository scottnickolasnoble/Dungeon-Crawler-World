<style>
/* Layout: one reading column under a sticky "broadcast bar" of sections; floors and docs are picked from chip rows. */
:root {
  --bg: #eceef1; --panel: #f8f9fb; --ink: #1b1d22; --muted: #5b606b; --rule: #cfd3da;
  --cone: #d9480f; --cone-soft: #fde3d4; --boss: #9b1c1c; --main: #1f5f8b; --main-soft: #dceaf5;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --panel: #1e2127; --ink: #e6e7ea; --muted: #9aa0ab; --rule: #33373f;
  --cone: #ff7a3d; --cone-soft: #3a2116; --boss: #f07171; --main: #7db9e3; --main-soft: #1b2b38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1e2127; --ink: #e6e7ea; --muted: #9aa0ab; --rule: #33373f;
  --cone: #ff7a3d; --cone-soft: #3a2116; --boss: #f07171; --main: #7db9e3; --main-soft: #1b2b38; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
header.top .wrap { display: flex; flex-direction: column; gap: 6px; padding-block: 10px; }
.brand { font: 18px/1 var(--display); letter-spacing: .02em; color: var(--cone); }
.brand small { font: 11px var(--mono); color: var(--bg); opacity: .7; letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
nav.sections { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.sections a { flex: none; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--bg); opacity: .75; text-decoration: none; padding: 6px 10px; border-radius: 3px; }
nav.sections a.on { background: var(--cone); color: #fff; opacity: 1; }
nav.sections a:focus-visible, .chip:focus-visible { outline: 2px solid var(--cone); outline-offset: 2px; }
main { padding-block: 20px 60px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
h1.view { font: 28px/1.15 var(--display); margin: 8px 0 4px; color: var(--ink); }
.lede { color: var(--muted); margin: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 20px; }
.chip { font: 600 12px var(--mono); padding: 5px 9px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 3px; text-decoration: none; cursor: pointer; }
.chip.on { background: var(--cone); border-color: var(--cone); color: #fff; }
.label { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stairs { border-left: 4px solid var(--cone); background: var(--cone-soft); padding: 12px 14px; margin: 0 0 24px; }
.stairs p { margin: 4px 0; }
.mono { font-family: var(--mono); font-size: 13px; }
.quest { border-top: 1px solid var(--rule); padding: 16px 0; }
.quest h3 { margin: 0 0 2px; font-size: 19px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.tag { font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; background: var(--rule); color: var(--ink); }
.tag.main { background: var(--main-soft); color: var(--main); }
.tag.timer { background: var(--cone-soft); color: var(--cone); }
.tag.boss { background: var(--boss); color: #fff; }
.quest p.desc { margin: 4px 0 8px; }
ol.steps { margin: 6px 0; padding-left: 24px; }
ol.steps li { margin: 3px 0; }
ol.steps .k { font: 600 10.5px var(--mono); text-transform: uppercase; color: var(--muted); margin-right: 6px; }
ol.steps .say { display: block; font-style: italic; color: var(--muted); font-size: 15px; }
.reward { font: 12.5px var(--mono); color: var(--muted); }
.chamber { background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px; margin: 12px 0; }
.chamber h3 { margin: 2px 0; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--boss); }
.chamber .intro p { margin: 4px 0; font-size: 15.5px; }
.beast { border-top: 1px solid var(--rule); padding: 18px 0; }
.beast h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; }
.beast .sub { font-style: italic; color: var(--muted); margin: 2px 0 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin: 4px 0; }
.stats b { color: var(--ink); }
.narr p { margin: 6px 0; }
.barks { font: 13px var(--mono); color: var(--muted); margin: 6px 0 0; }
details { margin: 8px 0; }
summary { cursor: pointer; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--cone); }
input#q { width: 100%; box-sizing: border-box; font: 16px var(--body); padding: 10px 12px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 3px; }
.count { font: 12px var(--mono); color: var(--muted); margin: 8px 0 0; }
.doc { min-width: 0; }
.doc h1 { font: 26px/1.2 var(--display); }
.doc h2 { font-size: 23px; margin-top: 1.8em; border-bottom: 2px solid var(--cone); padding-bottom: 4px; }
.doc h3 { font-size: 19px; margin-top: 1.4em; }
.doc a { color: var(--main); }
.doc code { font: 0.85em var(--mono); background: var(--panel); padding: 1px 4px; border-radius: 2px; }
.doc pre { background: var(--panel); border: 1px solid var(--rule); padding: 12px; overflow-x: auto; font-size: 13px; }
.doc pre code { background: none; padding: 0; }
.doc blockquote { border-left: 3px solid var(--rule); margin: 1em 0; padding: 0 0 0 14px; color: var(--muted); }
.tablewrap { overflow-x: auto; margin: 1em 0; }
.doc table { border-collapse: collapse; font-size: 14.5px; }
.doc th, .doc td { border: 1px solid var(--rule); padding: 6px 8px; vertical-align: top; text-align: left; }
.doc th { background: var(--panel); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
.toc { background: var(--panel); border: 1px solid var(--rule); padding: 10px 14px; margin: 0 0 20px; font-size: 15px; }
.toc a { color: var(--ink); text-decoration: none; display: block; padding: 2px 0; }
.toc a.h3 { padding-left: 16px; color: var(--muted); font-size: 14px; }
.src { font: 12px var(--mono); color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
