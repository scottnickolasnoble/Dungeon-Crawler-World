s. Single object, no ground, no base, no scenery.\n\n### 73. cooling tower\nfolder: cooling_tower · height 10 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A big concrete cooling tower with steam rising and ice on its rim, a ladder up the side. Single object, no ground, no base, no scenery.\n\n### 74. cable bundle\nfolder: cable_bundle · height 1 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A huge snaking bundle of thick coloured cables coiled on the floor like roots. Single object, no ground, no base, no scenery.\n\n### 75. tape reel stack\nfolder: tape_reel_stack · height 2 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A shelf of big old computer tape reels in metal cases labelled SEASON 1 to SEASON 9. Single object, no ground, no base, no scenery.\n\n### 76. big red switch\nfolder: big_red_switch · height 2 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A big industrial wall switch with a red lever, a glass cover and a sign: DO NOT. Single object, no ground, no base, no scenery.\n\n## Floor 16: The Transmitter\n\n### 77. satellite dish\nfolder: satellite_dish · height 5 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A big satellite dish on a lattice stand, pointing up, frost and bird nests on it. Single object, no ground, no base, no scenery.\n\n### 78. broadcast mast\nfolder: broadcast_mast · height 16 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A tall red-and-white lattice broadcast mast with blinking red lights and guy wires. Single object, no ground, no base, no scenery.\n\n### 79. mixing desk\nfolder: mixing_desk · height 1.4 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A huge broadcast mixing desk with hundreds of faders and knobs and a wall of monitors. Single object, no ground, no base, no scenery.\n\n### 80. on air light\nfolder: on_air_light · height 0.6 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A red ON AIR studio light box on a bracket, glowing. Single object, no ground, no base, no scenery.\n\n## Floor 17: The Host's House\n\n### 81. fifties house\nfolder: fifties_house · height 8 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A perfect 1950s suburban house with a porch swing, white picket fence and a too-bright lawn. Something wrong in one window. Single object, no ground, no base, no scenery.\n\n### 82. drive in screen\nfolder: drive_in_screen · height 12 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A big drive-in cinema screen on a scaffold, showing the Host's smiling face. Single object, no ground, no base, no scenery.\n\n### 83. fifties diner\nfolder: fifties_diner · height 4.5 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A chrome 1950s diner with neon signs, red stools at the counter visible through the windows. Single object, no ground, no base, no scenery.\n\n### 84. mirror panel\nfolder: mirror_panel · height 2.5 m · *mid*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A tall standing mirror panel in a gold frame, one corner cracked, a hand print on the glass. Single object, no ground, no base, no scenery.\n\n### 85. school desk\nfolder: school_desk · height 1 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. An old wooden school desk with an inkwell and a carved name. Single object, no ground, no base, no scenery.\n\n## Floor 18: The Floor That Does Not Exist\n\n### 86. builder machine\nfolder: builder_machine · height 8 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A colossal silent machine of smooth grey concrete and brass dials, older than anything, a single small lit button. Single object, no ground, no base, no scenery.\n\n### 87. impossible stair\nfolder: impossible_stair · height 6 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A bare concrete staircase that twists back on itself in an impossible loop. Single object, no ground, no base, no scenery.\n\n### 88. control console\nfolder: control_console · height 1.5 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A long ancient control console of brass levers and dusty glass gauges, one chair in front. Single object, no ground, no base, no scenery.\n\n---\n\n**Total:** 88 props, about 4400 credits.\n\n**Suggested order:**\n\n1. The castle kit and the club kit, which are used on many floors.\n2. Then the temples.\n3. Then each floor's set.\n"}, {"id": "t-every", "name": "Tripo everyday", "path": "art/TRIPO_EVERYDAY.md", "md": "# Tripo: everyday props (replacing my block-built ones)\n\nEvery desk, box, lamp, bin and shelf in the game was built by Claude out of simple shapes in Blender. There are 258 of them. This list swaps the most-seen ones for proper Tripo models.\n\n**How the swap works:** save each one with the **folder name shown**, which is the name the game already uses. Then tell Claude \"import the everyday props\". The importer will:\n\n- scale each new model to the exact size of the one it replaces\n- stand it on the floor and face it the same way\n- drop it in everywhere that prop appears, on every floor, with no placement work\n\nYou don't need heights; the old prop sets the size.\n\n**Settings:** same as before (text tab, H3.1 Best Quality, 4K, PBR off, Triangle). Polycount **20,000** unless marked *small* (8,000) or *big* (40,000).\n\n**Saving:** `art/incoming/everyday/<folder>/<folder>.glb`.\n\nEvery prompt includes the same style line, with ink outlines painted into the texture so the props match the comic look.\n\nProps already in `TRIPO_PROPS.md` (loot box, tent, bonfire, barricade, lamp post, bench, trolley, manhole, wrecked car and others) aren't repeated here.\n\n---\n\n## Tier 1: Floor 0, the first thing anyone sees (21)\n\n**1. desk**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A long curved TV-studio reception desk in glossy orange and teal with a NETWORK logo on the front panel, a chunky old computer monitor, a bell, a stack of forms and a mug of pens on top. Single object, no ground, no scenery. *big*\n\n**2. filing**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, worn. A grey four-drawer metal filing cabinet, one drawer half open and stuffed with folders, dents and a CONTESTANTS A–Z label. Single object, no ground, no scenery.\n\n**3. folding_chair**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A grey metal folding chair with a cracked plastic seat and a number sticker on the back. Single object, no ground, no scenery. *small*\n\n**4. shelf**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, worn. A tall metal storage shelf unit with four shelves crammed with labelled boxes, binders, a first-aid kit and a toy robot. Single object, no ground, no scenery.\n\n**5. boxes**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A stack of three cardboard boxes of different sizes, taped shut, stamped FRAGILE and NETWORK PROPERTY, the top one slightly crushed. Single object, no ground, no scenery. *small*\n\n**6. trash_can**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A round steel office bin with a swing lid, crumpled paper and a banana peel spilling over. Single object, no ground, no scenery. *small*\n\n**7. bench** (Landing waiting bench): 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A row of three linked plastic waiting-room seats on a steel beam, one seat cracked, a forgotten umbrella on another. Single object, no ground, no scenery.\n\n**8. plant**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A tall office potted plant with big glossy leaves in a chunky terracotta pot, a few leaves drooping and brown. Single object, no ground, no scenery. *small*\n\n**9. ceiling_light**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A long rectangular fluorescent ceiling light fitting with two glowing tubes behind a cracked diffuser, hanging on two short chains. Single object, no ground, no scenery. *small*\n\n**10. spotlight**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A heavy black stage spotlight on a tripod stand with barn-door flaps, a coloured gel and a coiled cable. Single object, no ground, no scenery.\n\n**11. camera_rig**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A big TV studio camera on a wheeled pedestal with a red ON AIR light, a teleprompter hood and thick cables trailing off. Single object, no ground, no scenery.\n\n**12. tv_mount**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A wall-mounted chunky CRT television on a metal arm bracket, the screen showing a cheerful smiling host face. Single object, no ground, no scenery.\n\n**13. noticeboard**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A wall cork noticeboard in a wooden frame, crowded with pinned rules, cheerful safety posters, a sign-up sheet and a photo with a face scribbled out. Flat back. Single object, no ground, no scenery.\n\n**14. stanchions**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. Two shiny brass queue posts joined by a red velvet rope, a little sign on one reading PLEASE WAIT TO BE PROCESSED. Single object, no ground, no scenery. *small*\n\n**15. wet_floor**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A yellow folding CAUTION WET FLOOR sign with a cartoon slipping figure, a small puddle shape at its feet. Single object, no ground, no scenery. *small*\n\n**16. fountain**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, worn. A wall-mounted steel drinking fountain with a push button, a little arc of water and a paper cone cup dispenser beside it. Flat back. Single object, no ground, no scenery. *small*\n\n**17. sandbags**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, dusty. A low curved wall of stacked burlap sandbags, one split and leaking sand. Single object, no ground, no scenery.\n\n**18. cones**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A group of three orange traffic cones with reflective white stripes, one knocked over. Single object, no ground, no scenery. *small*\n\n**19. barrier**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A metal crowd-control barrier section with feet, a NETWORK banner zip-tied to it. Single object, no ground, no scenery.\n\n**20. tires**: 3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A stack of four worn car tyres, the top one painted white with a smiley face. Single object, no ground, no scenery. *small*\n\n**21. fp_hand** (your own arm, seen in every frame of the game): 3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A single right forearm and hand in a fluffy white bathrobe sleeve, fingers curled in a fist as if gripping a stick, the sleeve rolled to the elbow, the arm cut off cleanly just below the elbow. Single object, no body, no ground, no scenery.\n\n---\n\n## Tier 2: towns, shops and camps (on every floor) (29)\n\n**22. barrels**: …comic style line… A pair of oak barrels bound with iron hoops, one with a tap and a drip stain, a ladle hooked on the rim. *small*\n\n**23. crates**: A pile of three wooden shipping crates with rope handles and stencilled numbers, a crowbar resting against them. *small*\n\n**24. bed**: A narrow iron-framed inn bed with a lumpy mattress, patched quilt and a flat pillow, a chamber pot underneath.\n\n**25. counter**: A long wooden shop counter with a worn top, an old brass cash register, a bell and a jar of sweets.\n\n**26. bar_back**: A tavern back-bar shelf unit full of mismatched bottles, a cracked mirror and a dartboard. Flat back. *big*\n\n**27. food_shelf**: A grocery shelf unit stacked with tins, jars, bread loaves and a few suspicious dented cans.\n\n**28. potion_shelf**: A wooden apothecary shelf of bubbling coloured potion bottles in odd shapes, labels in scrawled handwriting, a skull bookend.\n\n**29. weapon_rack**: (in TRIPO_PROPS #27, skip.)\n\n**30. armor_stand**: A wooden armour stand wearing a patchwork set of sports pads, a saucepan helmet and a bin-lid shield.\n\n**31. workbench**: A heavy wooden workbench with a vice, scattered tools, sawdust and a half-built mechanical contraption.\n\n**32. table_set**: A round tavern table with two wobbly chairs, two tankards and a candle stuck in a bottle.\n\n**33. lectern**: A tall carved wooden lectern holding a huge open ledger, a quill and an inkpot.\n\n**34. kiosk**: A small street newspaper kiosk with a hinged shutter open, newspapers pegged up and a hand-written sign. *big*\n\n**35. market_stall**: A wooden market stall with a striped canopy, crates of strange fruit and a hanging set of scales. *big*\n\n**36. sign_bracket**: A wrought-iron shop sign bracket with a hanging blank wooden sign board on two chains. Flat back. *small*\n\n**37. awning**: A striped canvas shop awning on a metal frame, sagging slightly, with a scalloped edge. Flat back.\n\n**38. door_frame**: A heavy wooden door in a stone frame with iron studs, a knocker and a little barred viewing window. Flat back.\n\n**39. window**: A town-house sash window with a painted wooden frame, a window box of flowers and a crack in one pane. Flat back. *small*\n\n**40. mailbox**: (Floor 5 version is in the comic kit; this is the town one.) A wall-mounted red post box with a brass slot and a slightly ajar door. *small*\n\n**41. laundry_cart**: A wheeled canvas laundry cart overflowing with towels and one wriggling sock.\n\n**42. washer**: A chunky front-loading launderette washing machine with a round porthole door and coin slot.\n\n**43. cauldron**: (in TRIPO_PROPS #34, skip.)\n\n**44. well**: A round stone well with a wooden roof, a crank handle and a bucket on a rope. *big*\n\n**45. clothesline**: Two wooden posts with a sagging line of pegged laundry: shirts, socks and one very large pair of pants.\n\n**46. fence**: A section of weathered wooden picket fence with one broken picket and a little gate. *small*\n\n**47. gate**: A tall wrought-iron double gate with spikes on top and a padlocked chain. *big*\n\n**48. hedge**: A neatly clipped boxy hedge section with a few stray branches and a hidden pair of eyes. *small*\n\n**49. junk_pile**: (similar to the comic kit's junk heap; skip if you do that one.)\n\n**50. guild_banner**: A tall cloth guild banner on a wooden pole with a crossbar, a bold crest of a fist holding a key.\n\n**51. mannequin**: A shop mannequin on a stand, slightly turned head, wearing a hat and scarf, one hand missing.\n\n**52. escalator**: (in the comic kit as f4_escalator, skip.)\n\n**53. treehouse_platform**: (in TRIPO_PROPS #37, skip.)\n\n**54. bus**: (in TRIPO_PROPS #14, skip.)\n\n**55. car**: A boxy little city car, parked, with a dent in the door and a parking ticket under the wiper. *big*\n\n---\n\n## Tier 3: out in the wilds (20)\n\n**56. car_parked**: A family estate car parked at the kerb, roof rack with a suitcase, a dog's nose print on the back window. *big*\n\n**57. shopping_cart**: (in TRIPO_PROPS #43, skip.)\n\n**58. power_pole**: A wooden telegraph pole with crossbars, insulators, sagging wires and a lost-cat poster stapled on. *big*\n\n**59. cctv_pole**: A tall metal pole with two boxy CCTV cameras pointing different ways and a red light. *small*\n\n**60. folding_table**: A long folding camping table with a gas stove, a dented kettle and a stack of tin plates.\n\n**61. bbq_grill**: A round kettle barbecue grill on three legs, the lid open, smoking sausages and a pair of tongs.\n\n**62. swing_set**: A metal garden swing set with two chain swings, one wrapped round the top bar.\n\n**63. water_tower**: (in the comic kit as bld_water_tank, skip.)\n\n**64. drainpipe**: A tall cast-iron drainpipe with brackets and a curved spout at the bottom, a dribble of water. *small*\n\n**65. storefront**: A whole small shop front with a big window, a door, a hand-painted sign board and a little bench outside. Flat back. *big*\n\n**66. photo_booth**: An old coin-operated photo booth with a curtain, a strip of photos hanging out of the slot and flickering bulbs.\n\n**67. mine_cart**: (in TRIPO_PROPS #18, skip.)\n\n**68. jetty**: (in the comic kit as f7_dock, skip.)\n\n**69. rock_pillar**: A tall weathered stone pillar of stacked layers, cracked, with a bird's nest on top. *big*\n\n**70. broken_pillar**: A broken classical stone column, the top snapped off and lying beside it, ivy creeping up. *big*\n\n**71. slab_pile**: A tumbled pile of broken concrete slabs with rebar sticking out.\n\n**72. pump_engine**: A clanking old iron water pump engine with a flywheel, pipes and pressure gauges. *big*\n\n**73. furnace_stack**: A tall brick furnace chimney with an iron door glowing orange at the bottom and soot stains. *big*\n\n**74. deposit_boxes**: A wall of steel bank safety-deposit boxes, some doors hanging open and empty. Flat back.\n\n**75. kennel**: A wooden dog kennel with a pitched roof, a name plate reading REX and a chain leading inside.\n\n**76. abandoned_mower**: A rusty push lawnmower abandoned in long grass, the bag split and spilling cuttings.\n\n---\n\n**How to write the short ones (22 onwards):** paste the style line, then the description, then the ending:\n\n- **Style line (before):** *3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, worn.*\n- **Ending (after):** *Single object, no ground, no scenery.*\n\n**Total:** about 63 new models (76 minus the ones marked skip), roughly 3,150 credits.\n\n**Suggested order:** Tier 1 first. The Landing and your own arm are the first impression, and the desk, boxes, bins and lights repeat on every floor.\n"}, {"id": "t-props", "name": "Tripo props", "path": "art/TRIPO_PROPS.md", "md": "# Tripo: props, weapons and vehicles\n\nThese replace the block-built Blender stand-ins that show up most around the maps, plus the first held weapons and the cars you'll be able to get into.\n\n**Settings** (same as the characters): Model > text (pencil tab), Geometry & Texture **4K**, **PBR off**, **Triangle**, polycount **40000** (use **20000** for the small props marked *small*), AI Model **H3.1 Best Quality**.\n\n**Saving:** Export > GLB 4K, saved as **art/incoming/props/<folder>/<folder>.glb**. Then tell Claude \"import the props\". The *height* line is what the importer scales each one to; you don't need to type it into Tripo.\n\nEvery prompt starts with the same style line, so the props match the cast.\n\n---\n\n## A. Weapons (held in first person)\n\nThese are what you see in your hand, so they matter most. Each weapon type swings differently in game: blunt swings sideways, blades slash diagonally, polearms thrust and heavy weapons do slow overhead chops. Enchantments (fire, frost, storm and so on) are added in the game as glowing effects, so make one plain version of each. Transmog will reuse these models.\n\n### 1. Lead Pipe (starter, blunt)\nfolder: wpn_lead_pipe · height: 0.9 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A length of old grey lead plumbing pipe with an elbow joint at one end, two brass couplings and a strip of black electrical tape as a grip. Single object lying straight, no hands, no ground, no base, no scenery.\n\n### 2. Nail Bat (blunt)\nfolder: wpn_nail_bat · height: 0.95 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A chipped wooden cricket bat with bent nails hammered through the end, a frayed taped handle and a hand-painted orange cone stripe. Single object, straight, no hands, no ground, no base, no scenery.\n\n### 3. Fire Axe (heavy)\nfolder: wpn_fire_axe · height: 0.95 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A red fire axe with a long wooden handle, a chipped steel head with a pick on the back, and a faded EMERGENCY USE ONLY sticker. Single object, straight, no hands, no ground, no base, no scenery.\n\n### 4. Butcher's Cleaver (blade)\nfolder: wpn_cleaver · height: 0.45 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. An oversized square kitchen cleaver with a heavy rectangular blade, a nicked edge, a hole near the spine and a riveted dark wooden handle. Single object, no hands, no ground, no base, no scenery.\n\n### 5. Rebar Spear (polearm)\nfolder: wpn_rebar_spear · height: 1.9 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A long improvised spear made of ribbed rusty rebar with a sharpened traffic-sign blade lashed to the tip with wire and cloth strips. Single object, straight, no hands, no ground, no base, no scenery.\n\n### 6. Golf Club (blunt, fast)\nfolder: wpn_golf_club · height: 1.0 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A bent steel golf driver with a dented oversized head, a worn leather grip and a little fluffy club cover still hanging off the end. Single object, no hands, no ground, no base, no scenery.\n\n### 7. Frying Pan (blunt, parry bonus)\nfolder: wpn_frying_pan · height: 0.55 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A heavy black cast-iron frying pan with a long handle, a dented base and a burnt crust of old soup inside. Single object, no hands, no ground, no base, no scenery.\n\n### 8. Shovel (heavy)\nfolder: wpn_shovel · height: 1.2 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A long-handled spade with a sharpened, battered steel blade, a D-shaped grip and mud caked on the end. Single object, straight, no hands, no ground, no base, no scenery.\n\n### 9. Umbrella Rapier (blade, fast)\nfolder: wpn_umbrella_rapier · height: 1.0 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A closed black gentleman's umbrella with a curved wooden hook handle and a thin steel sword blade sticking out of the tip. Single object, straight, no hands, no ground, no base, no scenery.\n\n### 10. Crowbar (blunt)\nfolder: wpn_crowbar · height: 0.8 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A red-painted steel crowbar with a curved claw at one end and a flat chisel at the other, the paint worn off in patches. Single object, no hands, no ground, no base, no scenery.\n\n### 11. Cone Mace (blunt, trophy)\nfolder: wpn_cone_mace · height: 0.9 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A war mace made from a short steel pole topped with a cluster of small orange traffic cones bolted together like spikes, with hi-vis tape wound round the grip. Single object, no hands, no ground, no base, no scenery.\n\n### 12. Mop Halberd (polearm)\nfolder: wpn_mop_halberd · height: 1.9 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A janitor's mop handle turned into a halberd: a grey filthy mop head at the bottom and a sharpened dustpan blade bolted on at the top. Single object, straight, no hands, no ground, no base, no scenery.\n\n---\n\n## B. Vehicles you can get into\n\nThese will be hollow inside so you can climb in, sit and drive or ride. Ask for open doors and a visible interior.\n\n### 13. Abandoned Hatchback\nfolder: veh_hatchback · height: 1.5 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A small dented hatchback car with both front doors hanging open and the interior visible: two seats, a steering wheel, a cracked dashboard, a fluffy dice. Faded paint, a cracked windscreen and one flat tyre. Single object, no ground, no base, no scenery.\n\n### 14. Burnt-Out City Bus\nfolder: veh_bus · height: 3.2 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, scorched and creepy. A long city bus, scorched black down one side, with its folding front door open, windows smashed, and rows of seats visible inside. A route sign above the windscreen reads DOWN. Single object, no ground, no base, no scenery.\n\n### 15. Ice-Cream Van\nfolder: veh_icecream_van · height: 2.8 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and slightly sinister. A boxy ice-cream van with a big serving hatch open on the side, a counter and freezers visible inside, a giant fibreglass cone on the roof and peeling pastel paint. Single object, no ground, no base, no scenery.\n\n### 16. Safari Jeep\nfolder: veh_safari_jeep · height: 2.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, muddy and worn. An open-top safari jeep with a roll bar, zebra-striped seats, a spare tyre on the back, a gun rack and a tourist camera hanging off the mirror. Single object, no ground, no base, no scenery.\n\n### 17. Mall Security Golf Cart\nfolder: veh_golf_cart · height: 1.9 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A white mall security golf cart with an open cabin, a flashing amber light on the roof, a bench seat and a SECURITY decal on the side. Single object, no ground, no base, no scenery.\n\n### 18. Mine Cart\nfolder: veh_mine_cart · height: 1.3 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, rusty. A riveted iron mine cart with an open top, a hand brake lever, a lantern hook and a plank seat inside, sitting on four small rail wheels. Single object, no rails, no ground, no base, no scenery.\n\n### 19. Rowing Boat\nfolder: veh_rowboat · height: 1.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, waterlogged and grimy. A small wooden rowing boat with two oars resting inside, a bench seat, a lantern on a pole at the bow and a rope coiled in the bottom. Single object, no water, no ground, no base, no scenery.\n\n---\n\n## C. Camp and outpost props (seen at every camp)\n\n### 20. Loot Box\nfolder: prop_loot_box · height: 1.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A TV game-show loot chest: a sturdy metal-banded crate painted gold and purple, with a glowing NETWORK logo on the lid, a chunky padlock and little light bulbs around the rim. Single object, closed lid, no ground, no base, no scenery.\n\n### 21. Camp Tent\nfolder: prop_tent · height: 2.2 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, filthy and patched. A ragged monster camp tent made of stitched tarps, traffic-cone plastic and old curtains over bent poles, with bones and trinkets tied to the ropes and the front flap open. Single object, no ground, no base, no scenery.\n\n### 22. Barricade Section\nfolder: prop_barricade · height: 1.4 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A wide section of improvised barricade: a car door, pallets, sheet metal and a road sign lashed together with chains and wire, with spikes poking out of the top. Single object, no ground, no base, no scenery.\n\n### 23. Bonfire\nfolder: prop_bonfire · height: 1.2 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A camp bonfire in a ring of broken bricks, built from smashed furniture and a burning shopping trolley, with a spit over it holding something best not looked at. Single object, no ground, no base, no scenery.\n\n### 24. Bone Heap\nfolder: prop_bone_heap · height: 1.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, creepy. A heap of gnawed bones, skulls, torn contestant wristbands and a single fuzzy slipper. Single object, no ground, no base, no scenery.\n\n### 25. Human Remains\nfolder: prop_remains · height: 0.5 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. The slumped remains of a fallen contestant in a torn bathrobe, mostly skeleton, still wearing a glowing contestant wristband, curled against nothing. Single object, no ground, no base, no scenery.\n\n### 26. Camp Banner\nfolder: prop_camp_banner · height: 3.2 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, ragged. A tall monster war banner on a scaffold pole, a torn hi-vis cloth painted with a crude snarling face, with cones and skulls hanging off the crossbar. Single object, no ground, no base, no scenery.\n\n### 27. Weapon Rack\nfolder: prop_weapon_rack · height: 1.6 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy. A rough wooden weapon rack holding pipes, a bent road sign, a broom spear and a hockey stick. Single object, no ground, no base, no scenery.\n\n### 28. Crates and Barrels\nfolder: prop_crates · height: 1.3 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and worn. A stack of two wooden supply crates stencilled NETWORK PROPERTY with a dented oil drum beside them. Single object, no ground, no base, no scenery.\n\n### 29. Noticeboard\nfolder: prop_noticeboard · height: 2.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, weathered. A freestanding cork noticeboard on two wooden legs, covered in pinned missing-person posters, torn maps, scrawled warnings and one cheerful Network flyer. Single object, no ground, no base, no scenery.\n\n---\n\n## D. Landmarks and hero props (one or two per floor)\n\n### 30. The Exit Sign Door (Floor 1)\nfolder: prop_exit_door · height: 3.2 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, creepy. A grey steel fire door in a concrete frame under a glowing green EXIT sign, the frame covered in hundreds of scratched tally marks and initials. Single object, no ground, no base, no scenery.\n\n### 31. Ticket Machine Booth (Floor 1)\nfolder: prop_ticket_booth · height: 2.6 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy and abandoned. A small car-park attendant's booth with a ticket machine on the front: eighteen numbered buttons, each with a strange little symbol above it, a ticket slot and a cracked green screen. Single object, no ground, no base, no scenery.\n\n### 32. Traffic-Cone Totem (Floor 1)\nfolder: prop_cone_totem · height: 3.0 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A tall goblin totem of stacked traffic cones, the top one holding a severed hand, with candles and offerings piled around its base. Single object, no ground, no base, no scenery.\n\n### 33. Giant Washing Machine (Floor 2)\nfolder: prop_giant_washer · height: 4.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy. A huge old launderette washing machine, the round door open like a mouth, socks and a shoe spilling out, and coin slots on the front. Single object, no ground, no base, no scenery.\n\n### 34. Soup Cauldron (Floor 3)\nfolder: prop_cauldron · height: 1.8 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A giant black iron hag's cauldron bubbling with green soup, a ladle the size of an oar, a boot and a finger floating in it, over a fire of broken chairs. Single object, no ground, no base, no scenery.\n\n### 35. Mall Kiosk (Floor 4)\nfolder: prop_mall_kiosk · height: 2.6 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, abandoned. A round shopping-mall phone-case kiosk with a striped canopy, smashed glass display, dangling price tags and a mannequin hand reaching from under the counter. Single object, no ground, no base, no scenery.\n\n### 36. Grinning Garden Gnome Statue (Floor 5)\nfolder: prop_gnome_statue · height: 1.6 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A large ceramic garden gnome statue with a chipped red hat, a too-wide grin full of sharp teeth and eyes that follow you, holding a small rake. Single object, no ground, no base, no scenery.\n\n### 37. Treehouse Platform (Floor 6)\nfolder: prop_treehouse · height: 4.5 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, weathered. A rickety wooden treehouse platform on stilts with a rope ladder, a plank railing, a tarp roof and lanterns hanging off it. Single object, no tree, no ground, no base, no scenery.\n\n### 38. Drowned Hand Statue (Floor 7)\nfolder: prop_drowned_hand · height: 3.0 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A giant mossy stone hand reaching up out of the ground, fingers curled, barnacles and eviction notices stuck to it. Single object, no water, no ground, no base, no scenery.\n\n### 39. Drill Rig (Floor 8)\nfolder: prop_drill_rig · height: 4.0 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, oily and rusty. A towering mining drill rig with a huge spiral bit, an iron frame, pressure gauges, steam pipes and a little worker's seat. Single object, no ground, no base, no scenery.\n\n### 40. Rat King Statue (Floor 9)\nfolder: prop_rat_statue · height: 3.2 m\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A grand bronze statue of a crowned rat in a mayor's sash on a plinth, green with age, with real rats nesting in its cloak. Single object, no ground, no base, no scenery.\n\n---\n\n## E. Street and house dressing (used everywhere)\n\n### 41. Street Lamp\nfolder: prop_lamp_post · height: 4.5 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, weathered. An old cast-iron street lamp with a cracked glass lantern, a flyer taped to the post and a small dent where something hit it. Single object, no ground, no base, no scenery.\n\n### 42. Wrecked Car\nfolder: prop_car_wreck · height: 1.4 m\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, rusty. A crushed, rusted-out saloon car with no wheels, smashed windows, the bonnet torn open and claw marks down the side. Single object, no ground, no base, no scenery.\n\n### 43. Shopping Trolley\nfolder: prop_trolley · height: 1.0 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, grimy. A bent supermarket shopping trolley with a wobbly wheel, a carrier bag caught on it and a cone sitting in the child seat. Single object, no ground, no base, no scenery.\n\n### 44. Wooden Bench\nfolder: prop_bench · height: 0.9 m · *small*\n\n3D game prop, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours, weathered. A park bench with peeling green slats, iron legs, a memorial plaque and a knife carved message. Single object, no ground, no base, no scenery.\n\n### 45. Manhole and Grate\nfolder: prop_manhole · height: 0.3 m · *small*\n\n3D game prop, stylized comic book horror cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A raised round iron manhole cover pushed half open, with green light glowing from below and grey fingers curled over the rim. Single object, no ground, no base, no scenery.\n\n---\n\n**Total:** 45 prompts, about 2,250 credits. If you're short on credits, do these first:\n\n1. The weapons (1–12)\n2. The Loot Box (20)\n3. The vehicles (13–19)\n"}], "floors": [{"n": 1, "name": "FLOOR 1 · THE UNDERCROFT", "hub": "Stairwell Camp", "stairs": {"flag": "f1_stairs", "how": "Four padlocks on the stairwell chain. Pylon has one key, Lost Property has one, the Moth Matron swallowed one, and the fourth lock eats validated tickets. Marta knows the rest.", "locked": "Chained. Four padlocks, four different shapes."}, "quests": [{"id": "f1_lay", "name": "Lay of the Land", "desc": "Marta wants you to know the ground before you try anything stupid. Climb high, find the hideout, read the shrine.", "main": true, "after": ["nobody_out"], "steps": [{"t": "go", "at": "point:lookout", "label": "Climb to the Lookout"}, {"t": "go", "at": "point:hideout", "label": "Find the Survivor Hideout"}, {"t": "find", "at": "point:shrine", "say": "read the names scratched into the shrine", "label": "Read the names on the Shrine", "text": "Hundreds of names. Some of the dates are from before Earth was taken.", "act": ["lore:1"]}], "reward": {"xp": 360, "gold": 100}}, {"id": "the_stairs", "name": "The Chained Stairwell", "desc": "Four padlocks on the stairwell chain. Pylon has one key. Lost Property has another. The Moth Matron swallowed the third. The fourth lock takes a validated parking ticket.", "main": true, "steps": [{"t": "quest", "id": "f1_key_toll", "label": "The Toll Key (Sergeant Pylon)"}, {"t": "quest", "id": "f1_key_lost", "label": "The Lost Property Key"}, {"t": "quest", "id": "f1_key_moth", "label": "The Moth's Key"}, {"t": "quest", "id": "f1_key_ticket", "label": "The Ticket Lock"}], "reward": {"xp": 900, "gold": 250, "flags": ["f1_stairs"]}, "giver": "marta"}, {"id": "f1_key_toll", "name": "The Toll Key", "desc": "Pylon wears the first key on a lanyard and charges a toll to look at it.", "main": true, "with": "the_stairs", "steps": [{"t": "go", "at": "camp:Pylon Point", "label": "Get to Pylon Point"}, {"t": "kill", "family": "goblin", "n": 8, "label": "Break the toll line: 8 Traffic-Cone Goblins"}, {"t": "flag", "flag": "pylon_handled", "label": "Deal with Sergeant Pylon: kill him, or a truce through Pickles"}], "reward": {"xp": 360, "gold": 100}}, {"id": "f1_key_lost", "name": "Lost Property", "desc": "Somebody handed the second key in. Lost Property has it now, and Lost Property does ector holds the Gallery, and the Gallery holds the way down. The off-air engineer has a plan: ten seconds of dead air.", "locked": "ON AIR. DO NOT ENTER."}, "quests": [{"id": "f16_crew", "name": "The Crew", "desc": "An engineer in the Canteen says she can take the whole broadcast down for ten seconds. She needs people who don't mind being off camera.", "main": true, "arrive": true, "steps": [{"t": "find", "at": "hub", "say": "meet the off-air engineer", "label": "Meet the off-air engineer", "text": "\"Ten seconds of dead air. That's all you get. Make them count.\""}], "reward": {"xp": 2460, "gold": 700}}, {"id": "f16_plan", "name": "Casing the Job", "desc": "Learn the schedule, scout the dead zone, steal the keys.", "main": true, "after": ["f16_crew"], "steps": [{"t": "find", "at": "landmark:The Big Mast", "say": "copy the tower schedule", "label": "Steal the tower schedule from the Big Mast"}, {"t": "go", "at": "landmark:The Dead Air Zone", "label": "Scout the Dead Air Zone"}, {"t": "boss", "kind": "the_censor", "label": "Get the Censor's keys"}], "reward": {"xp": 3690, "gold": 1050}}, {"id": "f16_towers", "name": "Lights Out", "desc": "The Dish Array would reroute the signal around the dead air. Take it down first.", "main": true, "after": ["f16_plan"], "steps": [{"t": "kill", "family": "static_man", "n": 12, "label": "Take down 12 Static Men"}, {"t": "boss", "kind": "static_king", "label": "Topple the Static King"}], "reward": {"xp": 2460, "gold": 700}}, {"id": "f16_heist", "name": "Dead Air", "desc": "The dead air will not last. Kill the Live Light, then run for the Gallery before it comes back on.", "main": true, "after": ["f16_towers"], "steps": [{"t": "find", "at": "landmark:The Live Light", "say": "kill the live light", "label": "Kill the Live Light", "text": "TEN SECONDS OF DEAD AIR. Somewhere, every screen on Earth goes black."}, {"t": "go", "at": "camp:The Gallery", "label": "Storm the Gallery"}, {"t": "flag", "flag": "the_director_handled", "label": "Take the Gallery from the Director"}], "reward": {"xp": 7380, "gold": 2100, "flags": ["f16_way"]}, "timer": {"s": 150, "from": 1, "to": 1, "reset": 0, "label": "DEAD AIR", "fail": "The Live Light flickers back on. ON AIR. Every camera on the floor swings round to look at you. Kill the light again."}}, {"id": "f16_dex", "name": "Dex's Choice", "desc": "Dex has found out what fans are.", "board": true, "steps": [{"t": "go", "at": "point:crew:Team Dex", "label": "Find Dex"}, {"t": "find", "at": "point:crew:Team Dex", "say": "tell Dex the truth", "label": "Tell him the truth", "text": "He goes very quiet. \"So every one of them...\" He turns off his camera."}], "reward": {"xp": 1940, "gold": 530, "flags": ["dex_told"]}, "main": false}, {"id": "f16_feed", "name": "Ratings", "desc": "Your number, live, in the Ratings Room.", "board": true, "steps": [{"t": "go", "at": "camp:The Ratings Room", "label": "Go to the Ratings Room"}, {"t": "boss", "kind": "the_feed", "label": "Unplug the Feed"}], "reward": {"xp": 1940, "gold": 530}, "main": false}, {"id": "f16_prompt", "name": "Your Lines", "desc": "The Teleprompter has your lines for the rest of your life.", "board": true, "steps": [{"t": "go", "at": "camp:The Teleprompter", "label": "Find the Teleprompter"}, {"t": "boss", "kind": "the_teleprompter", "label": "Go off script"}], "reward": {"xp": 1940, "gold": 530}, "main": false}], "chambers": [{"name": "The Green Screen", "boss": "the_chroma", "title": "THE CHROMA", "sub": "Now you see it.", "look": "A tall bright green figure with no features that is half invisible, edges shimmering like a bad special effect, long chroma-key arms.", "intro": ["THE CHROMA: \"*nothing. then everything. then nothing again.*\"", "NIGEL: The Network keys it out of every shot. It's been invisible on telly for forty years. It's very, very lonely. And very, very angry."], "unlock": "bell", "step2": "Ring the studio bell"}, {"name": "The Vision Mixer's Desk", "boss": "vision_mixer", "title": "THE VISION MIXER", "sub": "Camera three. Camera three. CAMERA THREE.", "look": "A many-armed broadcast technician fused into a huge mixing desk, headphones grown into its skull, faders for fingers, a red tally light eye.", "intro": ["THE VISION MIXER: \"Cut to the contestant. Cut to the blood. CUT TO THE BLOOD.\"", "NIGEL: It chooses what the audience sees. Right now it's choosing you. Smile."], "unlock": "trap", "lure": {"name": "Camera Three", "desc": "\"YOU'RE ON CAMERA THREE. Report to the Vision Mixer's Desk for your mark.\"", "label": "Find your mark at the desk", "say": "stand on your mark"}}]}, {"n": 17, "name": "FLOOR 17 · THE HOST'S HOUSE", "hub": "Main Street", "stairs": {"flag": "f17_way", "how": "The Host is in the Studio, and the Studio only opens once you've played through his episodes.", "locked": "A sign on the Studio door: TAPING. PLEASE WAIT FOR THE LAUGH."}, "quests": [{"id": "f17_e1", "name": "Episode 1: Welcome Home", "desc": "Main Street, fifty years ago. Everyone knows your name. There's a laugh track.", "main": true, "arrive": true, "steps": [{"t": "go", "at": "landmark:The House", "label": "Go home to the House"}, {"t": "find", "at": "landmark:The House", "say": "sit down for family dinner", "label": "Sit down for family dinner", "text": "Everyone at the table has the Host's face, at different ages. *laughter*"}], "reward": {"xp": 2600, "gold": 740}}, {"id": "f17_e2", "name": "Episode 2: The Big Game", "desc": "The whole town is at the game. The Fan Club President is very, very excited to meet you.", "main": true, "after": ["f17_e1"], "steps": [{"t": "go", "at": "camp:The Fan Club", "label": "Go to the Fan Club"}, {"t": "boss", "kind": "fan_club_president", "label": "Survive the Fan Club President"}], "reward": {"xp": 2600, "gold": 740}}, {"id": "f17_e3", "name": "Episode 3: Mirror, Mirror", "desc": "In the Mirror Maze someone has your face and is doing your lines better than you.", "main": true, "after": ["f17_e2"], "steps": [{"t": "go", "at": "landmark:The Mirror Maze", "label": "Enter the Mirror Maze"}, {"t": "boss", "kind": "the_stand_in", "label": "Beat your Stand-In"}], "reward": {"xp": 2600, "gold": 740}}, {"id": "f17_reel", "name": "Behind the Scenes", "desc": "The drive-in is showing old footage nobody was meant to see.", "main": true, "after": ["f17_e3"], "steps": [{"t": "find", "at": "landmark:The Drive-In Screen", "say": "watch the reel", "label": "Watch the old reel at the Drive-In", "text": "Season One. The winner holds up the trophy. It's him. The Previous Winner is the Host."}, {"t": "go", "at": "camp:The Trophy Room", "label": "Find the Trophy Room"}, {"t": "boss", "kind": "the_mother", "label": "Get past the Mother"}], "reward": {"xp": 3900, "gold": 1110}}, {"id": "f17_finale", "name": "Series Finale", "desc": "The Studio is open. Live audience. One take.", "main": true, "after": ["f17_reel"], "steps": [{"t": "go", "at": "camp:The Studio", "label": "Walk onto the Studio set"}, {"t": "flag", "flag": "the_host_handled", "label": "Face the Host"}], "reward": {"xp": 7800, "gold": 2220, "flags": ["f17_way"]}}, {"id": "f17_runnerup", "name": "Runner-Up", "desc": "Last season's runner-up almost won. He's glad he didn't.", "board": true, "steps": [{"t": "go", "at": "camp:The Runner-Up's House", "label": "Visit the Runner-Up"}, {"t": "boss", "kind": "the_runner_up", "label": "Hear him out, the hard way"}], "reward": {"xp": 2050, "gold": 560}, "main": false}], "chambers": [{"name": "The Nursery", "boss": "baby_host", "title": "BABY HOST", "sub": "Look who's a big boy now.", "look": "A huge uncanny baby in a tiny tuxedo and bib with the Host's perfect hair and smile, holding a microphone rattle, eyes far too old.", "intro": ["BABY HOST: \"Good evening, ladies and gentlemen... and welcome... to MY show!\"", "NIGEL: The Host's first memory, given a body by the Floor. He was charming even then. Especially then."], "unlock": "trap", "lure": {"name": "Babysitter Wanted", "desc": "\"Little one needs his rattle. ": "open the Door", "label": "Open the Door"}, {"t": "go", "at": "camp:The Builders' Seat", "label": "Walk to the Builders' Seat"}, {"t": "flag", "flag": "the_absence_handled", "label": "Face the Absence, and choose"}], "reward": {"xp": 8220, "gold": 2340, "flags": ["f18_way"]}}, {"id": "f18_ming", "name": "First Here", "desc": "Ming Zhao got to the bottom first.", "board": true, "steps": [{"t": "go", "at": "point:crew:The Speedrun", "label": "Find the Speedrun's camp"}, {"t": "find", "at": "point:crew:The Speedrun", "say": "find Ming", "label": "Find Ming", "text": "She's sitting on an empty plinth. \"There's no prize,\" she says. \"There's just a chair.\""}], "reward": {"xp": 2160, "gold": 590}, "main": false}], "chambers": [{"name": "The Antechamber", "boss": "doorkeeper", "title": "THE DOORKEEPER", "sub": "There is a door. There was always a door.", "look": "A colossal grey stone figure made of a doorframe, a giant key held across its body, a blank face with a keyhole, ancient and patient.", "intro": ["THE DOORKEEPER: \"Name. Season. Reason for leaving.\"", "NIGEL: The Builders left it here to guard the way out. It has never once opened the door. Nobody has ever given the right answer."], "unlock": "password", "step2": "Learn the knock"}, {"name": "The Hall of Winners", "boss": "every_previous_host", "title": "EVERY PREVIOUS HOST", "sub": "Thank you, and goodnight. Forever.", "look": "A towering tangle of a dozen game-show hosts fused together, many tuxedo arms, many microphones, many perfect smiles stacked into one body.", "intro": ["EVERY PREVIOUS HOST: \"Good evening! Good evening! GOOD EVENING!\"", "NIGEL: Every winner became a Host. Every Host became the set. And here they all are, still hosting. Still smiling. Still winning."], "unlock": "trap", "lure": {"name": "Thank You For Watching", "desc": "A gold card with your name embossed: \"Collect your award in the Hall of Winners.\"", "label": "Collect your award", "say": "take the award"}}]}], "oldq": {"quest ead Custodian Ebb to rest yourself.", "obj": [{"t": "boss", "kind": "ebb", "label": "Defeat Head Custodian Ebb"}], "reward": {"xp": 700, "gold": 200, "gear": "keyring"}}, "soup_feud": {"name": "Soup Feud", "giver": "wickley", "desc": "Two hag families run rival kitchens and their feud is poisoning the district. Taste-test both recipes, then come back to Wickley.", "obj": [{"t": "visit", "poi": "Grandma Gristle's Kitchen", "label": "Taste Grandma Gristle’s broth"}, {"t": "visit", "poi": "Auntie Brine's Pot", "label": "Taste Auntie Brine’s chowder"}], "reward": {"xp": 900}}, "cone_king": {"name": "Long Live the Cone", "giver": "wickley", "main": true, "desc": "The stairs to Floor 4 run under the Cone King’s throne in the Cone Cathedral. He is not going to move for you.", "obj": [{"t": "boss", "kind": "coneKing", "label": "Defeat the Cone King"}], "reward": {"xp": 2000, "gold": 400, "flags": ["coneKing_handled"]}}, "lights_out": {"name": "Lights Out", "giver": "ash", "desc": "Moths swarm Soup Row every night. Brother Ash wants you to track their Queen to the Lamp Market.", "obj": [{"t": "visit", "poi": "The Lamp Market", "label": "Find the Bulb Queen’s court"}], "reward": {"xp": 700}}, "ash_queen": {"name": "The Last Light", "giver": "ash", "desc": "You chose to end the Bulb Queen. Brother Ash will pray for both of you.", "obj": [{"t": "boss", "kind": "bulbQueen", "label": "Defeat the Bulb Queen"}], "reward": {"xp": 1500, "gold": 250, "gear": "mothTrophy"}}, "five_stars": {"name": "Five Stars", "giver": "vrask", "arc": true, "desc": "Judge Vrask is reviewing the Soup District. Cook something at your Cookstove and bring it to the judge.", "obj": [{"t": "flag", "flag": "has_dish", "label": "Bring a dish you cooked (Cookstove)"}], "reward": {"xp": 800, "gold": 150}}}, "story": {"ticket_machine": {"name": "Validated Parking", "giver": "", "desc": "An attendant's booth near the Exit Sign has a ticket machine with eighteen level buttons. Three damaged tickets lie around it, each with a symbol, a number and a time. They read like instructions.", "obj": [{"t": "flag", "flag": "ticket_1", "label": "Find the first ticket"}, {"t": "flag", "flag": "ticket_2", "label": "Find the second ticket"}, {"t": "flag", "flag": "ticket_3", "label": "Find the third ticket"}, {"t": "flag", "flag": "machine_solved", "label": "Enter the symbols into the machine"}], "reward": {"xp": 220, "flags": ["truth_clue_1"]}}, "drowned_bracelet": {"name": "Still Receiving", "giver": "", "desc": "Something at the Flooded Bay is guarding a body, not treasure. The bracelet on its wrist is still getting Network notifications.", "obj": [{"t": "flag", "flag": "bay_bracelet", "label": "Read the bracelet at the Flooded Bay"}], "reward": {"xp": 180, "flags": ["truth_clue_2"]}}}}, "beasts": [{"id": "agent_twelve_percent", "name": "Agent Twelve Percent", "title": "Camp Boss · The Agency", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "AGENT TWELVE PERCENT", "sub": "Boss of the Agency. Takes twelve percent of everything.", "lines": ["Agent Twelve Percent. A short, round man in a shiny suit, with slicked-back hair, a phone in each hand, a cigar the size of a rolling pin and a smile that stops a long way from his eyes.", "He represents everyone who's anyone in the Green Room. Nobody gets booked without him. He takes twelve percent. Of fees. Of fans. Of your organs, if it comes to it. He has a fridge in his office. Do not open the fridge.", "He's never lost a client. He's never had a client who left. He has a filing cabinet full of contracts, and some of the people in them have been dead for seasons and are still paying commission.", "Strengths: he summons hounds and paparazzi, he negotiates you into a worse position mid-fight and his contracts bind. Weaknesses: he can't fight. At all. He's a talker.", "Sign with him and you'll get booked. Or take his contacts book and get booked anyway, and save yourself twelve percent of a kidney."]}}, {"id": "agitator", "name": "The Agitator", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [2, "The Drum"], "narr": {"title": "THE AGITATOR", "sub": "The Drum. Heavy duty. Extra spin.", "lines": ["The Agitator. The beating heart of a washing machine the size of a cathedral: a great twisted spindle of steel paddles, spinning, churning, thrashing in a drum of grey foam, with three contestants still going round in it.", "It's been on the same cycle for forty years. Heavy duty. Extra spin. No rinse. Everything it washes comes out cleaner than God and in about nine pieces.", "It doesn't think. It doesn't feel. It just agitates. That's its whole name and its whole personality, and honestly, you've been on dates with worse.", "Strengths: it spins you, it slams you into the drum and the foam blinds you. Weaknesses: unbalance it. Every washing machine on Earth goes mental when the load's on one side."]}}, {"id": "alpha", "name": "Alpha", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [6, "The Kennel Pit"], "narr": {"title": "ALPHA", "sub": "The Kennel Pit. Every good boy, all at once.", "lines": ["Alpha. A dog. Several dogs. Every lost dog in the Wild Kennel, fused into one enormous, many-headed, many-legged hound, still wagging all of its tails, howling with a hundred voices.", "They were somebody's good boys. All of them. Pets from Earth, taken with their owners, lost on the Canopy. They found each other in the Kennel Pit, and they wanted so badly to be a pack that they became one, literally, in the most horrible way imaginable.", "The 'lost dog' poster on the board? There's a photo on it. It's mostly one dog. The other ninety-nine are just out of frame.", "Strengths: a hundred mouths, a hundred legs and a pounce that covers half the pit. Weaknesses: they're still good boys. Tell them to sit. Some of them will."]}}, {"id": "auditor", "name": "The Auditor", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [9, "The Counting House"], "narr": {"title": "THE AUDITOR", "sub": "The Counting House. Your accounts are overdue.", "lines": ["The Auditor. A thin, grey man made of ledger paper, with a calculator for a face and fingers like fountain pens, sitting behind a desk in the Counting House, going through your accounts line by line.", "He works for Saint Tally, the god of counting. Everything is counted. Everything is recorded. And everything, eventually, is audited. That tax rebate notice with your name already on it? He wrote it. He knew your name because he knows everything.", "He's found discrepancies in your accounts. Lots of them. He'll explain them to you very slowly while you bleed out.", "Strengths: he audits your buffs away, he throws columns of figures that hurt like knives and he never makes a mistake. Weaknesses: cook his books. One wrong number and he seizes up."]}}, {"id": "autograph_hound", "name": "Autograph Hound", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "AUTOGRAPH HOUND", "sub": "Fans. Very, very keen fans.", "lines": ["Autograph Hounds. People on all fours, sniffing the corridors of the Green Room, with notebooks in their mouths and pens behind their ears, howling for signatures.", "They want your autograph. They want everyone's autograph. They'll take it on paper, on skin, on bone. Some of them have the signatures of every star on the Network tattooed across their bodies, and they're always looking for space for a new one.", "They're fans. That's the horrible thing. They love you. They'll love you to death. They've loved people to death before.", "Strengths: they're fast, they swarm and once one's got your scent, they never stop following. Weaknesses: sign the book. They lose all interest.", "Sign something for one and he'll whimper with joy and run away. Then he'll be back tomorrow with forty friends."]}}, {"id": "baby_host", "name": "Baby Host", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [17, "The Nursery"], "narr": {"title": "BABY HOST", "sub": "The Nursery. Look who's a big boy now.", "lines": ["Baby Host. The Host, aged two. In a nappy, in a cot, in the Nursery of his childhood home, with his famous smile already on his little face. Except he's twelve feet tall.", "He's the first memory. The Host's earliest moment. And even then, the cameras were on him. His mother filmed everything. He learned to smile for the lens before he learned to walk.", "He wants his rattle. He's always wanted his rattle. And that babysitting job is very, very easy, if you don't mind a toddler the size of a house screaming for it.", "Strengths: tantrums that shake the room, a bottle that sprays and a nappy that you really, really do not want him to sit on. Weaknesses: his rattle. Find it."]}}, {"id": "bailiff", "name": "The Bailiff", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [7, "The Rent Office"], "narr": {"title": "THE BAILIFF", "sub": "The Rent Office. Everything you own is now evidence.", "lines": ["The Bailiff. A huge man in a long black coat, with a clipboard, a bunch of keys, a crowbar and a face like a slapped arse, standing in the Rent Office surrounded by everything he's ever repossessed.", "He works for the Landlord. He takes things. Furniture, money, clothes, pets, kidneys. He's taken the roof off houses. He's taken the floor out from under people standing on it. He once repossessed a man's trousers while the man was still in them.", "He's very calm. He's very reasonable. He'll explain, in a gentle voice, exactly what he's going to take and in which order.", "Strengths: he seizes your gear mid-fight, he hits like a door coming off its hinges and the Collectors back him up. Weaknesses: the case number. Quote it to him and he has to check the file."]}}, {"id": "baron", "name": "The Fryer Baron", "title": "Borough Boss · The Fryer Manor", "boss": true, "stats": {"hp": 760, "dmg": 17, "speed": 3.1, "xp": 1700}, "ranged": false, "barks": ["Everything's better battered."], "chamber": null, "narr": {"title": "THE FRYER BARON", "sub": "Borough Boss of the Fryer Manor. Everything's better battered.", "lines": ["The Fryer Baron. A man so steeped in chip fat he's practically translucent, in a velvet smoking jacket with a crust of batter on the lapels, presiding over a manor of bubbling vats like a lord of the manor in hell's chippy.", "He believes everything is better battered. Fish, chips, sausages, Mars bars, shoes, cats, enemies. He has deep-fried things that should never have met oil. He once deep-fried a contestant's entire personality, and they were much nicer afterwards.", "His vats are full of the best fuel on the floor: grease that burns hot, slow and dirty. The drill needs it. He needs it more.", "Strengths: he flings boiling oil, summons golems and leaves puddles that set you alight. Weaknesses: water, and his own vanity. Insult his batter.", "Kill him and the manor smells like a seaside town for weeks. Lovely, really."]}}, {"id": "bathwater", "name": "Old Lady Bathwater", "title": "Neighbourhood Boss · Bathwater Baths", "boss": true, "stats": {"hp": 520, "dmg": 15, "speed": 3.1, "xp": 1100}, "ranged": false, "barks": ["Who left the tap running? Oh. Me."], "chamber": null, "narr": {"title": "OLD LADY BATHWATER", "sub": "Boss of the Bathwater Baths. The water never drains.", "lines": ["Old Lady Bathwater. An ancient woman, wrinkled like a prune that's been in the bath too long, which she has, sitting up to her neck in a tub the size of a swimming pool, surrounded by foam, rubber ducks and things that are not rubber ducks.", "She ran a bath one evening, a hundred years ago, and she never got out. The water stayed warm. The foam stayed up. And slowly, the bath filled the room, then the house, then the street. Half the Cistern is technically her bathwater. You're paddling in it right now. You're welcome.", "She's lonely, really. She invites people to share her bath. Some of them say yes. They're still in there, in the foam, pink and wrinkled and very, very relaxed.", "Strengths: scalding splashes, puddles that pull you under and sewer wyrms who'll do anything for her. Weaknesses: the plug. There's always a plug.", "Pull the plug and the whole Baths drains in a roar that sounds like the end of the world, and she'll look up at you, quite small, and say, 'Oh. Is it time?'"]}}, {"id": "bigSucker", "name": "The Big Sucker", "title": "Neighbourhood Boss · The Flooded Bay", "boss": true, "stats": {"hp": 480, "dmg": 15, "speed": 1.9, "xp": 600}, "ranged": false, "barks": ["Feeeeed meeee…", "My clutch! Away from my clutch!", "The drains all lead to ME."], "chamber": null, "narr": {"title": "THE BIG SUCKER", "sub": "Boss of the Flooded Bay. Biggest mouth on the floor.", "lines": ["And this horror is the Big Sucker: the great-great-grandmother of every lamprey on the floor, the size of a bus, with a mouth you could park a hatchback in.", "She lairs in the Flooded Bay, and she doesn't move. Not for food, not for fights, not for anything. Everyone assumes she's guarding treasure. She isn't. She's curled round a body: a contestant who died down there years ago, and whose wristband is still buzzing with notifications nobody will ever read.", "Why she guards it, nobody knows. Lampreys aren't sentimental. Maybe it's the buzzing. Maybe she likes the company. Maybe the dead are just easier to love.", "Strengths: a lunging bite that'll take a leg off, a summoning shriek that brings every lamprey running, and a body made of pure thick rubber. Weaknesses: she can't leave the water, she's slow to turn, and she will not stop guarding that body even while you're killing her.", "Read the bracelet. It'll tell you something about this place that'll keep you awake for floors."]}}, {"id": "big_foam_finger", "name": "Big Foam Finger", "title": "Camp Boss · The Mascot Pen", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "BIG FOAM FINGER", "sub": "Boss of the Mascot Pen. Number one.", "lines": ["Big Foam Finger. A giant foam hand, twelve feet tall, raised in the 'we're number one' position, with a face somewhere around the knuckle and a mascot's legs sticking out the bottom.", "He runs the Mascot Pen. He's the most senior mascot in the Arena, and he got there by being the loudest and the pointiest. He believes he's number one. He's told so every match by forty thousand screaming fans.", "He's not. He's never been number one. There's a Champion in this arena, and the Finger has never been allowed within a hundred yards of him. That eats at him.", "Strengths: he pokes, he slams, he whips the mascots into a frenzy and he falls on you like a felled tree. Weaknesses: he's foam. He's top-heavy. Topple him.", "Bend the finger back and he screams like you've broken a real one. You haven't. Probably."]}}, {"id": "bindery_foreman", "name": "Bindery Foreman", "title": "Camp Boss · The Bindery", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "BINDERY FOREMAN", "sub": "Boss of the Bindery. Binds anything. Anyone.", "lines": ["The Bindery Foreman. A hulking paper golem folded from a book the size of a wardrobe, with a needle and thread like a harpoon and a guillotine for one hand, presiding over the Bindery's presses like a foreman on a factory floor.", "He binds things. Books, mostly. But anything can be bound. He's bound contestants between hardback covers, pressed flat, every word they ever said printed on the pages. They're on the shelves in the Stacks. You can take them out. They're overdue.", "He's not a monster. He's a craftsman. He takes enormous pride in his work. His stitching is immaculate. His spines never crack.", "Strengths: a guillotine chop that'll take your arm off, a binding thread that pins you in place and a summons that wakes every golem in the Bindery. Weaknesses: unbinding. Cut his stitches.", "Unbind him and he unfolds, page by page, into a single flat sheet of paper on the floor. It's his life story. It's surprisingly moving."]}}, {"id": "bit_rot", "name": "Bit Rot", "title": null, "boss": false, "stats": {"hp": 102, "dmg": 13, "speed": 3.5, "xp": 64}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "BIT ROT", "sub": "Corruption. It spreads.", "lines": ["Bit Rot. Shapeless, glitching creatures made of corrupted data: flickering blocks of colour, scrambled pixels and fragments of faces that never quite resolve, crawling across the frozen racks.", "They're what happens to memory that's been stored too long. The Builders' records are rotting, and the rot has started to walk. Every byte that goes bad crawls out of the servers and joins them.", "They eat good data. Including yours. Get bitten by Bit Rot and you'll forget things. Small things at first. Your shoe size. Your mum's maiden name. The way out.", "Strengths: corruption that drains your abilities, they're hard to hit and there's always more rot. Weaknesses: backups. Restore what they've eaten.", "If you forget something important after fighting them, don't panic. It might come back. Probably not, though."]}}, {"id": "blob", "name": "The Birthday Blob", "title": "Neighbourhood Boss · The Bounce Castle", "boss": true, "stats": {"hp": 1100, "dmg": 26, "speed": 2.6, "xp": 2300}, "ranged": false, "barks": ["IT’S MY PARTY!", "Cake! CAKE!"], "chamber": null, "narr": {"title": "THE BIRTHDAY BLOB", "sub": "Boss of the Bounce Castle. Nine years old forever.", "lines": ["The Birthday Blob. A slime the size of a marquee, in a paper party hat, covered in candles that never go out, with dozens of contestants floating inside it like fruit in a jelly.", "It was the birthday slime. The big one, at the centre of the party. Nine years ago, a party started in the Bounce Castle, and the Blob decided it would never end. And it hasn't. Same cake. Same song. Same balloons, getting sadder.", "Everyone it swallows is still at the party. They're smiling. They're bobbing. They're on their nine-thousandth slice of cake. Some of them have been in there so long they've got grey hair, and they're still wearing the hats.", "Strengths: it swallows you whole, it splits into smaller blobs and its belly-flop will flatten you into the bouncy floor. Weaknesses: popping. Sharp things. And someone, anyone, finally telling it the party's over.", "When it pops, everyone inside falls out at once, in a great wet heap of grown adults wearing party hats. Some of them thank you. Some of them were having a lovely time and are absolutely furious."]}}, {"id": "bone_broth", "name": "The Bone Broth", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [3, "The Stock Cellar"], "narr": {"title": "THE BONE BROTH", "sub": "The Stock Cellar. Simmering since the first season.", "lines": ["The Bone Broth. A cauldron the size of a swimming pool, bubbling in the Stock Cellar, and the broth inside it has stood up, grown arms made of marrow bones and a face made of fat, and started talking.", "It's been simmering since the first season. Every bone from every kitchen on the Soup District has gone in. It's the richest, deepest, most flavoursome broth in the dungeon, and it's achieved consciousness, and it's absolutely furious about having been boiled.", "The recipe is older than the Network. The password to its cellar is the name of the first ingredient. The first ingredient was a person.", "Strengths: scalding splashes, bones thrown like javelins and a smell so good you'll want to drink it mid-fight. Do not drink it mid-fight. Weaknesses: cold. Let it cool and it congeals."]}}, {"id": "bookwyrm", "name": "Bookwyrm", "title": null, "boss": false, "stats": {"hp": 70, "dmg": 9, "speed": 3.2, "xp": 40}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "BOOKWYRM", "sub": "Something that lives in the shelves. And reads.", "lines": ["Bookwyrms. Long, pale, many-legged creatures made of pages, with a spine for a spine and a mouth full of paper-cut teeth, burrowing through the shelves of the Stacks like woodworm the size of a canoe.", "They eat books. They've eaten whole sections of the library. Periodicals is mostly gone. The Large Print section is a hollow shell with a very fat bookwyrm sleeping in it.", "Everything they've eaten, they remember. Every word. They'll quote you Shakespeare while they're chewing on your leg. Some of them have eaten so much poetry that they hiss in iambic pentameter.", "Strengths: they ambush from the shelves, their bite gives you a paper cut you'll feel for a week and they climb anything. Weaknesses: fire. Obviously. They're made of paper.", "Kill one and it'll disintegrate into a drift of loose pages. Read them. Sometimes they ate something important."]}}, {"id": "boom_gremlin", "name": "Boom Gremlin", "title": null, "boss": false, "stats": {"hp": 102, "dmg": 13, "speed": 3.5, "xp": 64}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "BOOM GREMLIN", "sub": "Sound department. Very nosy.", "lines": ["Boom Gremlins. Spindly little green monkeys with huge ears, each one carrying a boom microphone three times longer than it is, which it holds directly over your head at all times.", "They record everything. Every word, every grunt, every fart you let slip in a quiet moment. All of it, beamed straight up to the audience, who love it. Your best moments on the Backlot are mostly you swearing at a gremlin.", "They giggle. They follow you. They'll dangle that boom into your shot just to ruin the take, then scurry off cackling. They're the most annoying creatures in the dungeon, and that's a dungeon with a Laugh Track in it.", "Strengths: they're fast, they're in your face and they call the whole crew whenever you do something interesting. Weaknesses: they hate silence. Stand still and say nothing, and they get bored.", "Smash a boom and the gremlin cries like a child who's dropped an ice cream. It's genuinely heartbreaking. You'll do it again."]}}, {"id": "brisket", "name": "Brisket, The Butcher Hag", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [3, "The Larder"], "narr": {"title": "BRISKET, THE BUTCHER HAG", "sub": "The Larder. Fresh in today. That's you.", "lines": ["Brisket. A hag the size of a meat fridge, in a bloodstained apron, with a cleaver in each hand and a necklace of sausages, standing in a larder full of hanging things you really should not look at too closely.", "She's Grandma Gristle's sister. She does the meat. Gristle does the soup. Between them, nothing on the Soup District goes to waste, including contestants, especially contestants, mainly contestants.", "That job advert for a kitchen hand? She wrote it. She's had nine kitchen hands this season. They're all hanging up behind her. Two of them are mince.", "Strengths: cleavers, meat hooks and an appetite that would shame a stag weekend in Magaluf. Weaknesses: she's slow, she's greedy, and she'll stop to sample anything that smells good. Bring a sausage roll."]}}, {"id": "bulbQueen", "name": "The Bulb Queen", "title": "Neighbourhood Boss · The Lamp Market", "boss": true, "stats": {"hp": 640, "dmg": 22, "speed": 3.6, "xp": 1300}, "ranged": false, "barks": ["You stand in MY light.", "Children! A new lamp has come to play!", "Every flame belongs to me."], "chamber": null, "narr": {"title": "THE BULB QUEEN", "sub": "Boss of the Lamp Market. Starving for light.", "lines": ["The Bulb Queen. A moth the size of a horse, with wings like stained-glass church windows and a body that glows a sickly yellow, like a nightlight in a hospice.", "She rules every moth in the Soup District. Every night her children swarm Soup Row and smash themselves against every lamp they can find, and everyone thinks it's an attack. It isn't. They're starving. The Lamp Market is going dark, one bulb at a time, and moths need light like you need a piss after six pints.", "And it's not just here. The light is failing on every floor. Something down below is pulling it. The Queen knows. She's been screaming about it for years. She just screams in moth, so nobody's listened.", "Strengths: blinding wing-flashes, swarms that blot out the sky and dust that makes you cough up glitter for a week. Weaknesses: darkness. Kill the lights and she panics. Feed her light and she'll stop fighting altogether.", "Brother Ash will pray for you either way. Kill her, feed her, or find out why she's hungry. Only one of those answers a question you're going to need answering."]}}, {"id": "cable_crawler", "name": "Cable Crawler", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "CABLE CRAWLER", "sub": "The Cold Store's wiring. It moves.", "lines": ["Cable Crawlers. Knotted bundles of thick black wire with sparking copper ends for heads, coiling across the frozen floors of the Cold Store like snakes made of electrical tape.", "They're the Builders' wiring, gone feral. They carry power from the Core to every rack on the floor, and somewhere along the way, they started thinking for themselves. Mainly about where the warmth is. And it's in you.", "They wrap round you to steal your heat. It feels like a hug. Then it feels like a tourniquet. Then it feels like a defibrillator, a very angry one.", "Strengths: they shock, they strangle and they come up out of the floor. Weaknesses: cut them. They're cables.", "Never step on one in the dark. They don't like it. Neither will you."]}}, {"id": "cable_mother", "name": "Cable Mother", "title": "Camp Boss · The Cable Jungle", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks":
