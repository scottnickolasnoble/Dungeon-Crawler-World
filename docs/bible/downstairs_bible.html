f the Mirror Maze. Has your face. Does it better.", "lines": ["The Stand-In. You. Perfectly you. Your face, your body, your voice, your clothes, but taller, better lit and with better posture, standing in the heart of the Mirror Maze delivering your lines better than you've ever delivered them.", "Every contestant who makes it to Floor 17 gets a stand-in, ready to take their place in the show if they die. He's been rehearsing being you since the moment you came down the stairs. He's very good. The audience likes him more.", "He's not evil. He's just ready. And if he beats you, he walks out of the Maze, and the show carries on, and nobody up there ever notices you're gone.", "Strengths: everything you can do, he can do, better. Weaknesses: he only knows who you were. Become someone else.", "Beat your Stand-In. Look him in the eye. He'll smile your smile and say, 'Good luck. You'll need it more than I would have.'"]}}, {"id": "the_stunt_double", "name": "The Stunt Double", "title": "Camp Boss · The Western Set", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE STUNT DOUBLE", "sub": "Boss of the Western Set. Played your death.", "lines": ["The Stunt Double. A broad, scarred man in a cowboy hat and a duster coat, with two revolvers, a face that's been broken in more places than it hasn't, and the uncanny feeling that you've seen him before. You have. In the mirror.", "He does the dangerous bits. Every contestant who's been filmed on the Backlot has had a stunt double, and it's always him, wearing their face. He's played your death already. Seven times. Different angles. He's got it down to a fine art.", "He's taken so many hits for so many people that he doesn't feel pain any more. He doesn't feel anything. He just waits on the Western Set for someone to say 'action', and then he does exactly what the script says.", "Strengths: quick draw, dives, rolls and falls you'd break your neck doing, and he's been in every fight you're about to have. Weaknesses: he only knows the script. Do something stupid. He can't improvise.", "Beat him at high noon and he'll take his hat off, look at you with your own face, and say 'nice'. Then he falls off the roof, perfectly, onto exactly the right spot."]}}, {"id": "the_teleprompter", "name": "The Teleprompter", "title": "Camp Boss · The Teleprompter", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE TELEPROMPTER", "sub": "Boss of the Teleprompter. Your lines, forever.", "lines": ["The Teleprompter. A tall glass screen on a stand, with scrolling text, a reflection that isn't quite you and a voice that reads the text out loud in your own voice, slightly before you say it.", "It has your lines. All of them. For the rest of your life. Everything you're going to say, scrolling past, and you have to say it, because the Teleprompter has already said it, and it's never wrong.", "It's how the Network keeps the Host on script. It's how it keeps everyone on script. It's why every contestant interview sounds the same. They're all reading.", "Strengths: it makes you say what it wants, it predicts your attacks and it can freeze you mid-sentence. Weaknesses: go off script. Swear. A lot.", "Say something that isn't on the screen. Something filthy. The Teleprompter will stutter, freeze and blue-screen. Then you're free."]}}, {"id": "the_warden", "name": "The Warden", "title": "Camp Boss · The Wardens' Gate", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "THE WARDEN", "sub": "Boss of the Wardens' Gate. Decides who sees.", "lines": ["The Warden. An enormous Maintainer, twelve feet tall, in grey overalls covered in keys, with a lantern for a head that shines a cold white light into every corner of the Wardens' Gate.", "He decides who sees the Builders' work. Nobody has ever passed him. Nobody has ever got this far. The Network doesn't even know he exists. He has been standing at this gate since before there were contestants to stand against.", "He doesn't care who you are. He doesn't care what you've done. He only cares whether you're ready to see. And nobody's ever ready.", "Strengths: he locks you out, he calls every Maintainer and his light burns. Weaknesses: show him the Builders' mark. Show him you know.", "Get past him and he'll stand aside, and dim his light, and say, in a voice like grinding gears, 'Mind the step.'"]}}, {"id": "thrower", "name": "Cone Chucker", "title": null, "boss": false, "stats": {"hp": 30, "dmg": 7, "speed": 3, "xp": 22}, "ranged": true, "barks": ["Heads up! HEH HEH.", "Cone incoming!", "Catch!"], "chamber": null, "narr": {"title": "CONE CHUCKER", "sub": "A goblin with an arm on it.", "lines": ["The cone chucker: a lanky goblin with arms like wet rope and a deeply held belief that everything is better at speed and from a distance.", "Chuckers are the goblin artillery. They hang back behind the pack and lob cones, bricks, bottles and, on one documented occasion, another goblin. They can hit a contestant in the face from sixteen metres, and they'll tell you about it for weeks.", "Goblin culture considers the chucker the most respected position after captain, mostly because chuckers never have to get close to anything dangerous. They are cowards, and they're proud of it.", "Strengths: range, accuracy, and very loud gloating. Weaknesses: they're useless up close; once you're on top of one, it'll try to throw you a cone in self-defence and then cry.", "Watch the ground. When the red circle appears under your feet, something's about to land on it. Probably a cone. Possibly a goblin."]}}, {"id": "troll", "name": "Cone Troll", "title": null, "boss": false, "stats": {"hp": 190, "dmg": 15, "speed": 3.0, "xp": 95}, "ranged": false, "barks": ["TROLL TOLL.", "Hrrrm. Crunchy one.", "Bridge is MINE. All bridges is mine.", "Smash first. Ask never."], "chamber": null, "narr": null}, {"id": "trouser_press", "name": "The Trouser Press", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [2, "The Pressing Room"], "narr": {"title": "THE TROUSER PRESS", "sub": "The Pressing Room. Creases you'll never get out.", "lines": ["The Trouser Press. Two vast iron plates hinged at the back, steaming hot, opening and closing like the jaws of a whale, with an ironing-board tongue and a voice like a posh tailor who's had a stroke.", "It presses things. Shirts, trousers, suits, people. It's offered a free pressed suit to every contestant who's walked into the Pressing Room, and every one of them has been pressed. They're on the rails now, flat as pancakes, with a perfect crease down the front.", "It takes enormous pride in its work. It's never left a wrinkle in its life. It just doesn't understand why the suits keep screaming.", "Strengths: it slams shut, it steams and it flattens. Weaknesses: it can only press what's between the plates. Don't be between the plates. This is the most obvious advice I've ever given."]}}, {"id": "ultra", "name": "Ultra", "title": null, "boss": false, "stats": {"hp": 94, "dmg": 12, "speed": 3.2, "xp": 58}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "ULTRA", "sub": "The Away End's finest. Here for the fight.", "lines": ["Ultras. Shirtless, tattooed, scarf-wrapped hooligans in balaclavas, holding flares, banners and bits of the stadium they've ripped off, chanting songs whose lyrics are mostly swearing and the occasional threat against your mum.", "They've been in the Away End since the first match. They've never seen a game. They're not here for the game. They're here to fight the away fans, and if there aren't any away fans, they'll fight you.", "They have a code. It's mostly about scarves. Touch a scarf and you're dead. Wear the wrong scarf and you're very dead. Don't wear a scarf at all and you're a fucking tourist.", "Strengths: they're never alone, they throw flares and they will not stop. Weaknesses: they'll follow anyone with a better chant.", "Learn their songs. Sing them back. They'll go very quiet, and then they'll pick you up on their shoulders, and you'll be one of them for life. That's not a figure of speech."]}}, {"id": "under_the_bed", "name": "The Thing Under His Bed", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [17, "The Bedroom"], "narr": {"title": "THE THING UNDER HIS BED", "sub": "The Bedroom. He was always afraid of it. He was right.", "lines": ["The Thing Under His Bed. Long, thin, black, all arms and fingers, with eyes that glow when the nightlights go out, curled up beneath the Host's childhood bed. It's been there since he was five.", "He was afraid of it. Every night. His mother told him it wasn't real. She was wrong. It was very real, and it's still here, and it's been waiting for him to come home for sixty years.", "It's the only thing in the Host's whole life that he's ever been truly afraid of. Understand it, and you'll understand him.", "Strengths: it lives in the dark, it grabs from below and its fingers are everywhere at once. Weaknesses: the light. Turn the nightlights off. Wait. What? No, you want them ON. Why would you turn them off? Oh. Oh no."]}}, {"id": "undermayor", "name": "The Undermayor", "title": "City Boss · City Hall", "boss": true, "stats": {"hp": 1150, "dmg": 19, "speed": 3.1, "xp": 2600}, "ranged": false, "barks": ["I was never elected. I was installed.", "Order of business: you."], "chamber": null, "narr": {"title": "THE UNDERMAYOR", "sub": "City Boss of City Hall. Never elected.", "lines": ["The Undermayor. A thin, sleek man in a pinstripe suit, with a chain of office, a smile like a shark that's been to finishing school and a voice so smooth it could talk the paint off a wall.", "He runs the Undercity. He has never once been elected. He was installed, years ago, by someone who doesn't live down here, and his job is very simple: keep the survivors happy enough that they never go any deeper, and keep the elections exciting enough that nobody notices the result never changes.", "He works for the Network. He'd never say it, but you can tell. He gets memos. He gets them on paper that glows.", "Strengths: he summons ratkings, he talks so well that you lose your turn, he's protected by procedure and he will never, ever concede. Weaknesses: votes. Real ones. And the truth.", "Win the election. Watch him smile and say 'recount'. Then drag him out of City Hall by his chain of office. The Undercity will cheer louder than it has in a hundred years."]}}, {"id": "vision_mixer", "name": "The Vision Mixer", "title": null, "boss": true, "stats": {}, "ranged": false, "barks": [], "chamber": [16, "The Vision Mixer's Desk"], "narr": {"title": "THE VISION MIXER", "sub": "The Vision Mixer's Desk. Camera three.", "lines": ["The Vision Mixer. A woman with six arms, each hand on a fader, sitting at a desk covered in buttons, switching between cameras so fast the screens are a blur, screaming 'CAMERA THREE! CAMERA THREE!'", "She decides what the audience sees, second by second. She cuts between shots. She makes the drama. She has never had a break, never had lunch, never been to the toilet. She has a bag. Don't ask.", "Your mark is on her desk. She's been waiting for you to stand on it.", "Strengths: she cuts between angles, teleporting around the room, and she can make you vanish from the shot. Weaknesses: she can only cut to what's on camera. Stay off camera three."]}}, {"id": "wax_witch", "name": "Wax Witch", "title": "Camp Boss · The Witch's Tower", "boss": true, "stats": {"hp": 600, "dmg": 16, "speed": 3.3, "xp": 1200}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "WAX WITCH", "sub": "Boss of the Witch's Tower. Keeps a key in a candle.", "lines": ["The Wax Witch. A tall, pale woman made half of wax, dripping constantly, with candles burning in her hair and a face that slides slowly down her skull and has to be pushed back up every few minutes.", "She lives in the tower on the crag above Castle Dread, with her collection of waxworks around her. She was the Season Nine witch. The castle cast her, and she took the part far too seriously and never, ever stopped.", "The castle's second key is inside a candle on her altar. She's never lit it. She's afraid of what she'll lose if she does.", "Strengths: hot wax that sets on your skin, waxworks that rise to defend her and fire she controls. Weaknesses: her own heat. She's made of wax. She melts.", "Melt her and she'll puddle onto the floor of her tower with a sound like a sigh. The candle on the altar will light itself."]}}, {"id": "waxwork", "name": "Waxwork", "title": null, "boss": false, "stats": {"hp": 78, "dmg": 10, "speed": 3.5, "xp": 46}, "ranged": false, "barks": [], "chamber": null, "narr": {"title": "WAXWORK", "sub": "The Wax Witch's collection. Lifelike.", "lines": ["Waxworks. Perfect, glossy, lifelike wax figures of people, standing in poses: mid-step, mid-scream, mid-sentence. They're beautiful. They're detailed down to the eyelashes. And they move when you're not looking.", "The Wax Witch made them. She makes them out of people. Dip a contestant in wax, let it set and you have a statue that's still alive inside, still aware, still trying to scream with a mouth that won't open.", "When she commands them, they walk. Stiffly. Creaking. Leaving drips of hot wax on the floor behind them. They don't want to hurt you. They don't get a vote.", "Strengths: they're hard as candles, they hit like statues and they don't feel a thing. Weaknesses: heat. Melt them.", "If you melt one, there's a person inside. Mostly. Sometimes. Be ready for that."]}}, {"id": "wight", "name": "Mop Wight", "title": null, "boss": false, "stats": {"hp": 55, "dmg": 9, "speed": 2.7, "xp": 28}, "ranged": false, "barks": ["...still... on... shift...", "Mind... the... floor...", "Clock... in..."], "chamber": null, "narr": {"title": "MOP WIGHT", "sub": "Night staff. Still on shift.", "lines": ["The Mop Wight. A dead cleaner in a grey tabard, still pushing a mop across a floor that's been clean for forty years, dripping bleach and something much worse out of its sleeves.", "Every one of these sad bastards was a contestant once. They died on Spin City, and the laundromat, being a fucking laundromat, decided they should be useful. So it gave them a mop. You don't get a funeral down here. You get a rota.", "They don't hate you. They don't feel anything at all. You're a spill, mate. A walking stain. And there is nothing on God's soapy earth a Mop Wight wants more than for the spill to stop moving.", "Strengths: they come in numbers, they swing that mop like a war hammer, and their bleach puddles will strip the skin off your ankles. Weaknesses: slow, stupid, and absolutely incapable of ignoring a mess. Knock something over and watch them all turn round.", "Kill one and it'll thank you, very quietly, with the last of its breath. Then another one comes round the corner with a fresh mop. Shift change."]}}, {"id": "wyrm", "name": "Sewer Wyrm", "title": null, "boss": false, "stats": {"hp": 100, "dmg": 12, "speed": 3.6, "xp": 58}, "ranged": false, "barks": ["*gurgle*"], "chamber": null, "narr": {"title": "SEWER WYRM", "sub": "What lives in the Cistern. And what it lives on.", "lines": ["The Sewer Wyrm. Twenty feet of grey-brown serpent, slick as a wet turd and roughly the same colour, with a mouth like a drain cover that's learned to open.", "They breed in the Drowned Cistern, in water so thick with the Undercity's leavings you could stand a spoon up in it. Everything that gets flushed on every floor above ends up down here, and the wyrms eat all of it. All of it. Think about that next time you go.", "They're attracted by movement in the water. Splashing. Wading. Opening a sluice gate, for instance. Every time the water level drops, they come up to see where their dinner's gone.", "Strengths: they lunge from the water, they wrap and crush, and they come in numbers when the tide turns. Weaknesses: they can't leave the wet. Get on dry ground and they're just very angry pipes.", "If you see the water start to move in a circle, stop wading. Just stop. Stand very still and think about your choices."]}}], "races": [{"id": "human", "title": "HUMANS", "sub": "Homo panicus. The default setting.", "lines": ["Ah. Humans. The beige wallpaper of the dungeon. Two arms, two legs, one functioning brain cell between every four of them, and that one's usually busy screaming.", "Humans arrived in the Stack the same way you did: they walked down a stairwell in their pyjamas because a voice on the telly told them to. Billions of years of evolution and the species folds to a cheerful announcement and a free snack.", "They are, I must admit, absurdly adaptable. Drop a human in a car park full of goblins and within a week he's running a soup stall, charging admission to the toilets and complaining that the goblins are bringing down property values.", "Strengths: stubbornness, sarcasm, and an almost supernatural ability to turn any catastrophe into a small business. Weaknesses: everything else. They bruise like fruit and they trust anyone with a clipboard.", "Most of the people you'll meet down here are human, and most of them are lovely, and most of them will be dead by Floor 4. Learn their names anyway. Somebody should."]}, {"id": "gutterkin", "title": "GUTTERKIN", "sub": "Rat-folk. Do not call them rats. They will bite your ankles off.", "lines": ["The gutterkin. Rat-folk, if you're being rude, and you'd better not be, because they hold grudges the way other people hold down jobs.", "They've lived in the Stack longer than anyone remembers, which isn't saying much, since nobody down here remembers fucking anything. They came up through the drains, the pipes and the bits of the building nobody's supposed to know about, and they know every single one of them.", "A gutterkin family will happily share a burrow with forty cousins, a stolen vending machine and a grandmother who is technically a pile of coats. They are loud, warm, endlessly hungry and the best scavengers on any floor. If something's gone missing, a gutterkin has it, and is about to sell it back to you.", "Strengths: speed, noses that can smell a loot box through concrete, and an encyclopaedic knowledge of shortcuts. Weaknesses: shiny things, cheese-flavoured anything, and an inability to walk past an unlocked door.", "Treat them fairly and they'll fight for you till their whiskers fall off. Cheat one and every gutterkin on the floor will know your name by teatime."]}, {"id": "stoneblood", "title": "STONEBLOOD", "sub": "Living rock with feelings. Mostly the feeling of being very, very heavy.", "lines": ["Ah, the stoneblood. Gentle walking boulders with glowing cracks and the patience of a geological epoch. Ask one a question and you'll get an answer. Eventually. Bring snacks.", "Stoneblood claim the Builders carved their first ancestors out of the Stack's own foundations to hold the walls up. Whether that's true or just something they say at parties, they do take load-bearing extremely seriously. One leaned on a dodgy pillar on Floor 2 eleven years ago and has been holding up the ceiling ever since. He says it's fine. It's not fine.", "They run half the crafting in the dungeon. Benchwright Bo and his endless bloody cousins sell tables on every floor, and every single table is built to survive the heat death of the universe. They also sweat gravel when they're nervous, which is disgusting and frankly a slip hazard.", "Strengths: immense toughness, a cheerful disregard for being stabbed, and craftsmanship that could make a dwarf weep. Weaknesses: water seeping into the cracks, sledgehammers, and stairs, which they hate with the bitter passion of anyone who weighs six hundred kilos.", "If a stoneblood calls you a friend, you have a friend for the next nine hundred years. If you insult one, it will remember long after you've become a fossil."]}, {"id": "fennix", "title": "FENNIX", "sub": "Fox-folk. Charming, quick, and absolutely nicking your wallet.", "lines": ["The fennix. Fox-folk with gorgeous tails, gorgeous smiles and gorgeous fingers that are, right now, in your pocket.", "Fennix came down the Stack in the very early seasons as performers: jugglers, singers, card sharps, contestants who realised the cameras loved them. They've been playing to the Network ever since, and the Network adores them, which should worry you more than it does.", "A fennix will charm you, flatter you, sell you a map to a treasure that doesn't exist and then, for a small extra fee, guide you to it. They're also braver than they let on: more than one fennix has dived into a goblin camp to drag a stranger out, purely so they could tell the story afterwards.", "Strengths: speed, dexterity, luck that seems borderline rigged, and an ego so large it has its own postcode. Weaknesses: vanity, an uncontrollable urge to show off when a camera is pointed at them, and fleas, which they will deny until they die.", "Never play cards with a fennix. Never lend one money. And never, ever tell one they look tired."]}, {"id": "ogrekin", "title": "OGREKIN", "sub": "Large. Kind. Accidentally lethal.", "lines": ["Ogrekin. Huge, tusked, soft-hearted lumps who would never hurt a fly on purpose and have crushed several thousand by accident.", "They came from somewhere deep in the Stack, so far down that the ogrekin themselves have only folk songs about it, and every one of those songs is about a really good lunch. They're the dungeon's labourers, bouncers, haulers and, when nobody's looking, its best bakers.", "An ogrekin's idea of a gentle tap will put you through a wall. Their idea of a quiet word is audible on the next floor. And their idea of a snack is a whole roast and the plate. But they are fiercely, tearfully loyal, and there's nothing safer in this whole bastard dungeon than being behind one.", "Strengths: strength, stamina, a skull thick enough to stop bullets, and warmth enough to heat a camp. Weaknesses: slow, clumsy, easily tricked, and they cry at absolutely everything, including adverts.", "If you need a wall knocked down, call an ogrekin. If you need a door opened gently, call literally anyone else."]}, {"id": "lumen", "title": "LUMEN", "sub": "Glow-in-the-dark elves. Smug about it.", "lines": ["The lumen. Tall, pale, softly glowing, terribly serene, and very aware of how good they look in low light, which, down here, is all of it.", "Lumen say they were born from the first lamps the Builders hung in the Stack, which is a lovely story and almost certainly bollocks. What is true is that they were here before the Network, they remember things they won't talk about, and every one of them flinches when a light goes out.", "They're healers, scholars, priests and insufferable dinner guests. A lumen will explain your own feelings to you, correct your pronunciation of your own name, and then save your life without being asked, and you'll feel oddly guilty about all three.", "Strengths: magic, memory, the ability to read in the dark without a torch, and long lives. Weaknesses: total darkness, which weakens them horribly; arrogance; and Lady Lumen's priests, who want every one of them in a temple.", "Be polite to the lumen. They're older than they look, they know more than they say, and they glow brightest right before something terrible happens."]}, {"id": "bogling", "title": "BOGLINGS", "sub": "Frog-folk. Damp, delightful, sticky.", "lines": ["Boglings! Short, round, frog-folk with eyes like dinner plates and the cheerful disposition of someone who has never once been dry.", "Boglings live wherever water collects, which in this leaky arsehole of a building is everywhere. They were already here when the Laundromat flooded, and frankly they think the Laundromat is an improvement. They farm algae, raise tadpoles in old washing machines and treat a flooded corridor as prime real estate.", "A bogling will share its last fly with you. Literally, a fly. You should eat it. It's a whole social thing. They sing at night in great croaking choirs that sound like a drain being strangled, and they consider this their finest art.", "Strengths: swimming, holding their breath for frankly suspicious lengths of time, sticky hands for climbing, and resistance to poison. Weaknesses: dry heat, salt, and herons, of which there are mercifully none. Yet.", "Old Damp is their god, whether they know it or not. Watch the boglings when the water starts rising. They always know before anyone else."]}, {"id": "clanker", "title": "CLANKERS", "sub": "Robots. Possibly people. Possibly both. They're not sure either.", "lines": ["Clankers. Riveted, dented, teal-eyed robots that walk, talk, trade and swear at you in a pleasant electronic voice.", "Nobody knows who built the first clanker. The clankers certainly don't. Some say they're Builder machines that woke up. Some say they're old Network security units that wandered off. A very few, late at night, say they remember being people once, and then go very quiet.", "They're precise, practical, honest to a fault and terrible at jokes, which they tell constantly. A clanker will fix your armour, calculate your odds of survival out loud, and remind you of them every few minutes as a courtesy.", "Strengths: tough plating, no need to eat or sleep, perfect memory, and immunity to poisons and fear. Weaknesses: water in the joints, magnets, rust, and an existential crisis lurking right behind the eyes.", "Be kind to the clankers. One day you'll find out where they really came from, and you'll wish you'd been kinder."]}, {"id": "grimhide", "title": "GRIMHIDE", "sub": "Orc-folk. Big tusks, big hearts, big punches.", "lines": ["The grimhide. Tall green orc-folk with tusks, scars and a sense of humour so dry it's technically a fire hazard.", "Grimhide came down the Stack as soldiers in some early season's war that nobody won, and they've been the dungeon's muscle ever since: guards, mercenaries, bouncers and, in one memorable case, a very successful florist.", "They don't trust easily, they don't talk much, and they don't forgive. But a grimhide's word is iron, and a grimhide's friendship comes with a free bodyguard. They have about nine thousand words for 'fight' and only one for 'sorry', and they use it about once a decade.", "Strengths: strength, toughness, battle sense, and a death stare that can curdle milk. Weaknesses: pride, temper, and an inability to back down from a challenge, even a stupid one, especially a stupid one.", "Never insult a grimhide's mother. Never insult a grimhide's cooking. Actually, just don't insult a grimhide."]}, {"id": "quillback", "title": "QUILLBACKS", "sub": "Hedgehog-folk. Small. Spiky. Furious.", "lines": ["Quillbacks: hedgehog-folk the height of your knee, the temper of a wasp and the dress sense of a Victorian bank clerk.", "Quillbacks are tidy. Terrifyingly tidy. They came down to the Stack, saw the state of it and decided, as a people, to sort it out. That was eleven seasons ago and they are still absolutely livid about the goblins' filing system.", "They're clerks, accountants, archivists and the only reason half the towns down here have working toilets. A quillback will lend you money, track every copper of it, and appear at your shoulder on the exact day it's due with a little invoice and a very big stare.", "Strengths: spines that make biting them a terrible decision, a perfect head for numbers, and burrowing. Weaknesses: they curl into a ball when frightened, which is adorable and useless, and they cannot leave a mess alone, even in combat.", "Saint Tally loves the quillbacks. Every one of them is counting something, right now, and they don't know why."]}, {"id": "mothwing", "title": "MOTHWING", "sub": "Moth-folk. Soft, gentle, unbearably drawn to lamps.", "lines": ["The mothwing. Soft grey moth-folk with feathery antennae, huge dark eyes and the bad luck of being born attracted to the one thing the dungeon sets on fire most.", "Mothwing used to live near the Lightwell on Floor 1, before the Moth Matron's lot went feral and the Lamplighters started burning them out for being 'too close' to the moths. Now they're scattered across every floor, gentle refugees with very good night vision.", "They're poets, weavers, musicians and astonishingly good thieves of light: a mothwing can steal the glow out of a lamp and carry it in its hands. They hum when they're happy and fall silent when something's watching, so if the mothwing go quiet, so should you.", "Strengths: flight, of a fluttery sort; seeing in the dark; light magic; and being far tougher than they look. Weaknesses: bright lights are almost irresistible, they're fragile, and they bruise their wings on everything.", "Lady Lumen calls to them. Most of them don't answer. The ones that do are never quite the same."]}], "narrator": "Nigel Bramble-Hogg, Network Wildlife Correspondent"};
const $main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECTIONS = [['cast','Cast to make'],['floors','Floors & quests'],['bestiary','Bestiary'],['races','Races'],['doc-story','Story'],['doc-world','World'],['doc-voice','Voice'],['docs','All docs']];
const STEP = {go:'Go', find:'Find', kill:'Kill', boss:'Boss', flag:'Do', quest:'Quest', chamber:'Chamber', trap:'Trap', visit:'Visit', talk:'Talk', collect:'Collect'};
const UNLOCK = {sigils:'Break the sigils', keys:'Collect the keys', switches:'Throw the switches', password:'Learn the password', bell:'Ring the bell', trap:'Trap: lured in by a quest'};

function nav(route) {
  document.getElementById('nav').innerHTML = SECTIONS.map(([id, n]) => {
    const on = route === id || (id === 'floors' && route.startsWith('floor-')) || (id === 'cast' && route.startsWith('cast')) || (id === 'docs' && route.startsWith('doc-') && !SECTIONS.some(s => s[0] === route));
    return `<a href="#${id}" class="${on ? 'on' : ''}">${n}</a>`;
  }).join('');
}

function floorView(n) {
  const f = DATA.floors.find(x => x.n === n) || DATA.floors[0];
  const chips = DATA.floors.map(x => `<a class="chip ${x.n === f.n ? 'on' : ''}" href="#floor-${x.n}">${x.n}</a>`).join('');
  const main = f.quests.filter(q => q.main), side = f.quests.filter(q => !q.main);
  const st = f.stairs;
  let h = `<div class="chips">${chips}<a class="chip" href="#older-quests">Older quests</a></div>
    <h1 class="view">${esc(f.name.replace('—', '·'))}</h1>
    <p class="lede">${f.hub ? 'Hub: ' + esc(f.hub) + ' · ' : ''}${main.length} main quests · ${side.length} side quests · ${f.chambers.length} boss chambers</p>`;
  if (st) h += `<div class="stairs"><div class="label">The way down</div><p>${esc(st.how || '')}</p>
    ${st.locked ? `<p class="mono">Locked: ${esc(st.locked)}</p>` : ''}${st.exit ? `<p class="mono">Exit: ${esc(st.exit.text || st.exit.at)}</p>${st.exit.old ? `<p class="mono">Old stairs: ${esc(st.exit.old)}</p>` : ''}` : ''}
    ${st.flag ? `<p class="mono">Unlocks on: ${esc(st.flag)}</p>` : ''}</div>`;
  h += `<h2>Main line</h2>` + main.map(questHTML).join('');
  if (side.length) h += `<h2>Side quests</h2>` + side.map(questHTML).join('');
  if (f.chambers.length) h += `<h2>Boss chambers</h2>` + f.chambers.map(chamberHTML).join('');
  return h;
}

function questHTML(q) {
  const tags = [];
  if (q.main) tags.push('<span class="tag main">Main</span>');
  if (q.arrive) tags.push('<span class="tag">Starts on arrival</span>');
  if (q.board) tags.push('<span class="tag">Notice board</span>');
  if (q.with) tags.push(`<span class="tag">Starts with ${esc(q.with)}</span>`);
  if (q.after) tags.push(`<span class="tag">After ${esc([].concat(q.after).join(', '))}</span>`);
  if (q.giver) tags.push(`<span class="tag">Giver: ${esc(q.giver)}</span>`);
  if (q.timer) tags.push(`<span class="tag timer">Timed: ${Math.round(q.timer.s / 60 * 10) / 10} min${q.timer.label ? ' · ' + esc(q.timer.label) : ''}</span>`);
  const steps = (q.steps || q.obj || []).map(s => `<li><span class="k">${STEP[s.t] || esc(s.t)}</span>${esc(s.label || s.say || s.kind || s.at || '')}${s.text ? `<span class="say">“${esc(s.text)}”</span>` : ''}</li>`).join('');
  const r = q.reward || {};
  const rw = [r.xp && r.xp + ' XP', r.gold && r.gold + ' gold', r.item && 'item: ' + r.item].filter(Boolean).join(' · ');
  return `<div class="quest"><h3>${esc(q.name)}</h3><div class="tags">${tags.join('')}</div>
    ${q.desc ? `<p class="desc">${esc(q.desc)}</p>` : ''}${steps ? `<ol class="steps">${steps}</ol>` : ''}${rw ? `<div class="reward">Reward: ${esc(rw)}</div>` : ''}</div>`;
}

function chamberHTML(c) {
  const isTrap = c.unlock === 'trap';
  return `<div class="chamber"><div class="label">${esc(c.name)}${isTrap ? ' · trap chamber' : ''}</div>
    <h3>${esc(c.title)}</h3>${c.sub ? `<div class="sub" style="font-style:italic;color:var(--muted)">${esc(c.sub)}</div>` : ''}
    <p class="mono">Unlock: ${esc(UNLOCK[c.unlock] || c.unlock || 'sigils')}${c.step2 ? ' · ' + esc(c.step2) : ''}</p>
    ${c.lure ? `<p class="mono">Lure: ${esc(typeof c.lure === 'string' ? c.lure : (c.lure.name || JSON.stringify(c.lure)))}</p>` : ''}
    ${c.intro ? `<div class="intro">${c.intro.map(l => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
    ${c.look ? `<details><summary>Model look</summary><p>${esc(c.look)}</p></details>` : ''}
    <p class="mono"><a href="#beast-${esc(c.boss)}" style="color:var(--main)">Bestiary entry →</a></p></div>`;
}

function olderQuests() {
  const list = (o) => Object.values(o).map(questHTML).join('');
  return `<div class="chips"><a class="chip" href="#floor-1">← Floors</a></div><h1 class="view">Older quest files</h1>
    <p class="lede">Quests from quests.json (Floor 0 / Mall era) and story_quests.json. Some may be superseded by the floor quest lines.</p>
    <h2>quests.json</h2>${list(DATA.oldq.quests)}<h2>story_quests.json</h2>${list(DATA.oldq.story)}`;
}

function narrHTML(n) {
  if (!n) return '';
  return `${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ''}<div class="narr">${(n.lines || []).map(l => `<p>${esc(l)}</p>`).join('')}</div>`;
}

function bestiary(focus) {
  const h = `<h1 class="view">Bestiary</h1><p class="lede">Every monster and boss the game knows about, with ${esc(DATA.narrator)}'s discovery narration where it's written.</p>
    <input id="q" type="search" placeholder="Search names, narration, barks…" aria-label="Search the bestiary">
    <div class="chips" id="bf">
      <a class="chip on" data-f="all">All</a><a class="chip" data-f="boss">Bosses</a><a class="chip" data-f="narr">Narrated</a><a class="chip" data-f="none">No narration yet</a></div>
    <div class="count" id="bc"></div><div id="bl"></div>`;
  $main.innerHTML = h;
  let filter = 'all';
  const render = () => {
    const q = document.getElementById('q').value.toLowerCase();
    const list = DATA.beasts.filter(b => (filter === 'all' || (filter === 'boss' && b.boss) || (filter === 'narr' && b.narr) || (filter === 'none' && !b.narr))
      && (!q || JSON.stringify(b).toLowerCase().includes(q)));
    document.getElementById('bc').textContent = `${list.length} of ${DATA.beasts.length}`;
    document.getElementById('bl').innerHTML = list.map(b => {
      const s = b.stats, stats = Object.entries(s).map(([k, v]) => `<span>${k.toUpperCase()} <b>${v}</b></span>`).join('');
      return `<div class="beast" id="beast-${esc(b.id)}"><h3>${esc(b.narr?.title || b.name)}</h3>
        <div class="tags">${b.boss ? '<span class="tag boss">Boss</span>' : ''}${b.ranged ? '<span class="tag">Ranged</span>' : ''}${b.chamber ? `<span class="tag">Floor ${b.chamber[0]} · ${esc(b.chamber[1])}</span>` : ''}${b.title ? `<span class="tag">${esc(b.title)}</span>` : ''}<span class="tag">${esc(b.id)}</span></div>
        ${stats ? `<div class="stats">${stats}</div>` : ''}${narrHTML(b.narr)}
        ${b.barks.length ? `<div class="barks">Barks: ${b.barks.map(x => '“' + esc(x) + '”').join(' ')}</div>` : ''}</div>`;
    }).join('');
  };
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('bf').addEventListener('click', e => {
    const c = e.target.closest('[data-f]'); if (!c) return;
    filter = c.dataset.f; document.querySelectorAll('#bf .chip').forEach(x => x.classList.toggle('on', x === c)); render();
  });
  render();
  if (focus) { const el = document.getElementById('beast-' + focus); if (el) el.scrollIntoView(); }
}

const STATUS = {
  'done': ['Done', 'In the game with Mixamo clips'],
  'ready': ['Ready for Mixamo', 'Model is made: grab its FBX from the mixamo-uploads branch'],
  'remake': ['Remake in Tripo', 'Needs a new model first (T-pose, chunky hands)'],
  'not made': ['Not made yet', 'Needs a Tripo model first (T-pose, chunky hands)'],
};
function floorLabel(c) { return c.floor ? 'Floor ' + c.floor + (c.floorName ? ' · ' + esc(c.floorName.replace(/^FLOOR \d+\s*\S\s*/, '')) : '') : 'No floor yet'; }
function castView(which) {
  const list = DATA.cast[which];
  const count = s => list.filter(c => c.status === s).length;
  const isM = which === 'monsters';
  $main.innerHTML = `<h1 class="view">Cast to make</h1>
    <p class="lede">Every character in the game, what state it's in, and the Mixamo clips it needs. Sorted by floor; within a floor, remakes first, then ones ready for Mixamo, then ones still to make.</p>
    <div class="chips"><a class="chip ${!isM ? 'on' : ''}" href="#cast-npcs">NPCs (${DATA.cast.npcs.length})</a><a class="chip ${isM ? 'on' : ''}" href="#cast-monsters">Monsters (${DATA.cast.monsters.length})</a></div>
    <div class="stairs"><div class="label">${isM ? 'Clips every monster needs' : 'Clips every NPC needs'}</div>
    ${isM ? `<p><b>Idle</b>, <b>Walk</b> (or <b>Run</b> if it's fast), its <b>Attack</b>, and a <b>Death</b>. A <b>Hit reaction</b> is a nice extra. Then one clip for each special move listed on its card.</p>
      <p class="mono">Creatures (not human-shaped) can't go through Mixamo: Claude rigs and animates those in Blender, so they need nothing from you.</p>`
    : `<p><b>Breathing Idle</b>, <b>Walking</b>, and <b>two Talking</b> clips (they take turns while talking to you). Shopkeepers, innkeepers and quest givers: add a <b>Waving</b> to greet you.</p>`}
    <p class="mono">Download one clip With Skin (the walk is best), every other clip Without Skin. FBX Binary.</p></div>
    <input id="q" type="search" placeholder="Search names, floors, moves…" aria-label="Search the cast">
    <div class="chips" id="cf"><a class="chip on" data-f="all">All</a>${Object.keys(STATUS).map(s => `<a class="chip" data-f="${s}">${STATUS[s][0]} (${count(s)})</a>`).join('')}${isM ? '<a class="chip" data-f="boss">Bosses</a><a class="chip" data-f="humanoid">Mixamo-able only</a>' : ''}</div>
    <div class="count" id="cc"></div><div id="cl"></div>`;
  let filter = 'all';
  const draw = () => {
    const q = document.getElementById('q').value.toLowerCase();
    const shown = list.filter(c => (filter === 'all' || c.status === filter || (filter === 'boss' && c.boss) || (filter === 'humanoid' && c.humanoid))
      && (!q || JSON.stringify(c).toLowerCase().includes(q)));
    document.getElementById('cc').textContent = `${shown.length} of ${list.length}`;
    let lastFloor = -1;
    document.getElementById('cl').innerHTML = shown.map(c => {
      const st = STATUS[c.status];
      const fl = c.floor || 0;
      const head = fl !== lastFloor ? `<h2>${fl ? 'Floor ' + fl + (c.floorName ? ' · ' + esc(c.floorName.replace(/^FLOOR \d+\s*\S\s*/, '')) : '') : 'No floor yet'}</h2>` : '';
      lastFloor = fl;
      const tags = [`<span class="tag ${c.status === 'done' ? 'main' : c.status === 'remake' ? 'boss' : c.status === 'ready' ? 'timer' : ''}">${st[0]}</span>`];
      if (c.boss) tags.push('<span class="tag boss">Boss</span>');
      if (!c.humanoid) tags.push('<span class="tag">Creature: Claude rigs it</span>');
      if (c.role) tags.push(`<span class="tag">${esc(c.role)}</span>`);
      (c.moves || []).forEach(m => tags.push(`<span class="tag">${esc(m)}</span>`));
      let body = '';
      if (isM && c.humanoid) {
        body = `<ol class="steps">${c.need.map(n => `<li>${esc(n)}</li>`).join('')}${c.extra.map(n => `<li><span class="k">Special</span>${esc(n)}</li>`).join('')}</ol>`;
      } else if (!isM && c.humanoid) {
        const greet = /keeper|merchant|trader|quest|leader|shop|giver|sells|potions|weapons|armour/i.test(c.role || '');
        body = `<div class="reward">Breathing Idle · Walking · Talking × 2${greet ? ' · Waving' : ''}</div>`;
      }
      return head + `<div class="quest"><h3>${esc(c.name)}</h3><div class="tags">${tags.join('')}</div>
        <div class="reward">${c.title ? esc(c.title) + ' · ' : ''}<span class="mono">${esc(c.id)}</span></div>${body}
        <div class="reward" style="margin-top:4px">${esc(st[1])}</div></div>`;
    }).join('');
  };
  document.getElementById('q').addEventListener('input', draw);
  document.getElementById('cf').addEventListener('click', e => {
    const c = e.target.closest('[data-f]'); if (!c) return;
    filter = c.dataset.f; document.querySelectorAll('#cf .chip').forEach(x => x.classList.toggle('on', x === c)); draw();
  });
  draw();
}

function races() {
  return `<h1 class="view">Races</h1><p class="lede">Playable and townsfolk races, with their discovery narration.</p>` +
    DATA.races.map(r => `<div class="beast"><h3>${esc(r.title)}</h3>${narrHTML(r)}</div>`).join('');
}

function docsIndex() {
  return `<h1 class="view">All docs</h1><p class="lede">Every design doc in the repo. The Tripo lists are long prompt catalogues.</p>
    <div class="chips" style="flex-direction:column;align-items:flex-start">${DATA.docs.map(d => `<a class="chip" href="#doc-${d.id}">${esc(d.name)} <span class="src">· ${esc(d.path)} · ${Math.round(d.md.length / 1000)}k</span></a>`).join('')}</div>`;
}

function docView(id) {
  const d = DATA.docs.find(x => x.id === id);
  if (!d) return docsIndex();
  let html;
  try { html = marked.parse(d.md); } catch (e) { html = `<pre>${esc(d.md)}</pre>`; }
  const box = document.createElement('div'); box.className = 'doc'; box.innerHTML = html;
  box.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tablewrap'; t.replaceWith(w); w.appendChild(t); });
  const heads = [...box.querySelectorAll('h2, h3')];
  heads.forEach((hd, i) => hd.id = 'h-' + i);
  const toc = heads.length > 3 ? `<details class="toc" open><summary>Contents</summary>${heads.map((hd, i) => `<a class="${hd.tagName.toLowerCase()}" href="javascript:void 0" data-h="h-${i}">${esc(hd.textContent)}</a>`).join('')}</details>` : '';
  $main.innerHTML = `<div class="chips"><a class="chip" href="#docs">← All docs</a><span class="src" style="align-self:center">${esc(d.path)}</span></div>${toc}`;
  $main.appendChild(box);
  $main.querySelectorAll('[data-h]').forEach(a => a.addEventListener('click', () => document.getElementById(a.dataset.h).scrollIntoView()));
}

function route() {
  const r = (location.hash || '#cast').slice(1);
  nav(r);
  if (r.startsWith('floor-') || r === 'floors') $main.innerHTML = floorView(parseInt(r.slice(6)) || 1);
  else if (r === 'older-quests') $main.innerHTML = olderQuests();
  else if (r === 'bestiary') bestiary();
  else if (r.startsWith('beast-')) { nav('bestiary'); bestiary(r.slice(6)); return; }
  else if (r === 'races') $main.innerHTML = races();
  else if (r === 'cast' || r === 'cast-npcs' || r === 'cast-monsters') { nav('cast'); castView(r === 'cast-monsters' ? 'monsters' : 'npcs'); window.scrollTo(0, 0); return; }
  else if (r === 'docs') $main.innerHTML = docsIndex();
  else if (r.startsWith('doc-')) docView(r.slice(4));
  else $main.innerHTML = floorView(1);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
