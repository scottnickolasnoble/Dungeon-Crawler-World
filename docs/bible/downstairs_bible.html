ost is watching.\n- `town_trader_03` — No refunds. No returns. No questions.\n\n### gossip\n\n- `town_gossip_01` — Did you hear? Marta says nobody ever reaches the bottom.\n- `town_gossip_02` — Pickles has been buying cones. Why does he want cones?\n- `town_gossip_03` — They say the stairwell door only opens if Pylon falls.\n- `town_gossip_04` — My cousin went down to Floor 2. Came back damp.\n- `town_gossip_05` — The Host winked at me. I think. Hard to tell with a hologram.\n\n### healer\n\n- `town_healer_01` — Hold still. This’ll sting. Everything stings.\n- `town_healer_02` — Drink water. Then drink more water.\n- `town_healer_03` — Bandages are two copper. Sympathy is free.\n\n### quest\n\n- `town_quest_01` — Got a minute? No? Later then.\n\n### kid\n\n- `town_kid_01` — Are you a contestant? Can I have your boots when you die?\n- `town_kid_02` — I’m gonna be on telly one day!\n- `town_kid_03` — Race you to the fire!\n\n### worker\n\n- `town_worker_01` — These tents won’t patch themselves.\n- `town_worker_02` — Pass me that hammer. No, the other hammer.\n- `town_worker_03` — Union break in five.\n\n## Opening cutscene (narrator and the Host)\n\n- `intro_01` (Narrator) — 3:17 in the morning. Somewhere ordinary.\n- `intro_02` (Narrator) — Dale was asleep. Dale was always asleep at 3:17. He worked nights at a fireworks warehouse, and this was his one night off.\n- `intro_03` (Narrator) — Then the television switched itself on.\n- `intro_04` (The Host) — Good morning, Earth! Sorry about the hour. Big news, huge news!\n- `intro_05` (The Host) — Your planet has been acquired by the Network. Congratulations! The surface is being renovated.\n- `intro_06` (The Host) — In ten minutes, every building on Earth will fold neatly into the ground. Please do not be inside them.\n- `intro_07` (Narrator) — Dale looked out of the window. The city was folding itself away like a pop-up book in reverse.\n- `intro_08` (The Host) — But here is the good news! Every stairwell on the planet now leads to one place. Downstairs!\n- `intro_09` (The Host) — Downstairs is the greatest show in the galaxy. Eighteen floors. Monsters. Loot. Ratings!\n- `intro_10` (The Host) — The rules are simple. Go down. Stay alive. Eat, drink, and entertain the audience. They are watching. All of them.\n- `intro_11` (The Host) — Reach Floor Eighteen and you win. Nobody has ever reached Floor Eighteen. No pressure!\n- `intro_12` (Narrator) — Dale had nine minutes, one bathrobe, and the lighter from work.\n- `intro_13` (Narrator) — It would have to do.\n- `intro_14` (The Host) — Stairwells close in sixty seconds! Anyone still upstairs becomes part of the scenery!\n- `intro_15` (Narrator) — The whole street was running for the same green sign.\n- `intro_16` (The Host) — Contestant number four million, one hundred seventeen thousand and twenty-one. Class detected: Pyromancer. Cute.\n- `intro_17` (The Host) — Welcome to the dungeon, Dale. Find the camp, find the people, find a way down. And try not to die before the commercial break!\n"}, {"id": "art", "name": "Art direction", "path": "art/ART_DIRECTION.md", "md": "# Downstairs: art direction\n\n**Goal:** believable cartoon. Real proportions and readable, normal faces, drawn like a hand-inked comic with thick black lines and flat painted colour. The reference for the style is Borderlands; every character stays an original Downstairs design.\n\n**Keep:** every character's concept, personality and props, and the backbone of the level layouts.\n**Replace:** all character models, then the look of the levels.\n\n## The look, from the user's reference images\n- **Main reference:** a first-person game drawn in thick black brush ink, with panel lines drawn on every surface, in cream, mustard and teal, with a black-and-cream checker floor.\n- **Warmth and clutter:** a colourful shop where every surface holds something, in warm saturated colour.\n- **Depth:** a sunlit town square with warm light, cool shadows and a dense street receding into the distance.\n- Nothing should read as a placed block. Every prop gets real shape, worn paint and small story details.\n\nFloor 0 sets the standard. To rebuild it: `tools/blender/build_landing_kit.py` makes the props, `tools/paint_landing_textures.mjs` paints the textures, and `godot/shaders/` holds the ink and shading.\n\n## Floors 1 and down: real towns\n- Every floor's town is different and built around that floor's theme. No shared town kit with new colours.\n- Buildings have real interiors you walk into: shops with shopkeepers, guild halls, inns and homes. The town shouldn't be all exteriors.\n- Keep the backbone of each floor's layout, and the locations and characters already in the prototype.\n\n## Rules for every character\n- Clear, appealing face: well-placed eyes with pupils, a real nose and mouth, and a readable expression. Nothing melted or skull-like unless the concept calls for it.\n- Slightly exaggerated proportions: bigger hands and head, strong silhouette, one bold idea you can read from across a room.\n- Painted surfaces: flat colours, big shapes, ink-style shadow lines. Grime is drawn on, not noisy.\n- Funny before scary. The game's a dark-comedy TV show.\n\n## Pipeline\n1. **Tripo** (tripo3d.ai): make the model from a prompt below. Hands and arms should be clear of the body. Download as `.glb`.\n2. **Mixamo** (mixamo.com), humanoids only: upload the model, auto-rig, download idle, walk, attack and hit animations. Mixamo wants `.fbx` or `.obj`, so export that format from Tripo as well.\n3. Non-humanoids (moths, lampreys, mimics and so on) can't use Mixamo. They get rigged in Tripo or Blender.\n4. Put every download in `art/incoming/<character name>/`. Claude takes it from there: cleanup in Blender, import into Godot, inked shading.\n\nWeapons are made as separate models so they don't get fused to a hand, and attached in Godot.\n\n## Pilot: three characters to prove the look\nSettings if Tripo offers them: text to model, highest texture quality, T-pose on.\n\nNegative prompt for all three, if there's a field for it:\n`photorealistic, horror, gore, melted face, distorted face, extra limbs, pedestal, base, ground plane, multiple characters, blurry texture`\n\n### 1. Traffic-Cone Goblin (Floor 1 regular)\n```\nFull-body 3D game character, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A scrawny, cocky green goblin with a big expressive face: large yellow eyes with clear pupils, long pointed ears, big hooked nose, wide toothy grin with an underbite. Wears an orange and white traffic cone as a helmet, tilted to one side, a leather strap across his bare chest, and a ragged brown loincloth. Wiry arms, oversized hands and bare feet. Standing in a T-pose, arms straight out, facing forward, empty hands.\n```\n\n### 2. Intern Pip (Floor 0, tutorial guide)\n```\nFull-body 3D game character, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A nervous, friendly young TV network intern with a likeable human face: big anxious eyes, raised eyebrows, freckles, an awkward hopeful smile, messy hair. Wears a slightly too large red polo shirt with a staff lanyard and ID badge, khaki trousers and worn sneakers, with a pen tucked behind one ear. Skinny build, slightly oversized head and hands. Standing in a T-pose, arms straight out, facing forward, empty hands.\n```\n\n### 3. Sergeant Pylon (Floor 1 boss)\n```\nFull-body 3D game character, stylized comic book cartoon, hand-painted texture with bold black ink lines and cel-shaded colours. A big, stocky, self-important goblin sergeant with a broad green face: heavy brow, small furious yellow eyes, huge jaw with jutting lower tusks, a bristling moustache and a whistle on a cord around his neck. Five traffic cones stacked as a tall helmet of rank, the top one yellow. Wears a battered hi-vis yellow security vest with reflective stripes over a bare barrel chest, a belt with road-worker gear, torn work trousers and heavy boots. Huge forearms and hands. Standing in a T-pose, arms straight out, facing forward, empty hands.\n```\n\n## Design notes\n- Pip's prototype outfit is a blue jumpsuit with a yellow stripe, which looks a lot like a famous game's vault suit. The redesign uses a TV-network intern look instead, which also suits the story better.\n- After the pilot, the full roster follows the same template: Floor 0–6 monsters and bosses from `godot/data/monsters.json`, then named NPCs (Marta Vance, Pickles, Spin Cycle, Old Reggie, Wickley, Brother Ash, Sunny, Madame Prickle, Big Deb, the Neighbourhood Watch, Gusset, Elder Lantern), then the nine playable races.\n"}, {"id": "pipeline", "name": "Character pipeline", "path": "art/CHARACTER_PIPELINE.md", "md": "# Getting a character into Downstairs yourself\n\nThis guide takes a character from AccuRig, through Mixamo, into the game, and covers how to change it once it's there.\nAll paths are relative to the project folder `F:\\Downstairs\\Dungeon-Crawler-World-claude-device-sync-offline-start-tlcj0x\\Dungeon-Crawler-World-claude-device-sync-offline-start-tlcj0x`.\n\n## How the game finds characters\n\n- Every character model lives in `godot/models/characters/<name>.glb`, for example `traffic_cone_goblin.glb`. The `<name>` part is the character's ID. Use exactly the same name all the way through.\n- If there is a file with the same name in `godot/models/characters/rigged/`, the game uses that one instead, and it moves.\n- The game plays animations by name. Your rigged file needs these, spelled exactly like this:\n\n| Name | Used for | Needed? |\n|---|---|---|\n| `idle` | standing, breathing | yes |\n| `walk` | wandering | yes |\n| `run` | chasing you | yes for monsters |\n| `attack` | hitting you | yes for monsters |\n| `hit` | being hit | nice to have |\n| `die` | dying | nice to have |\n| `talk` | townsfolk talking | nice to have for NPCs |\n\nAnything missing is skipped: no crash, the character just holds its last pose.\n\n## Step 1: AccuRig\n\n1. **Grab the character from `art/mixamo/upload/<name>.fbx`.** Every character has one there, with its texture built in.\n   If one is missing, make it with:\n   `F:\\Downstairs\\Blender\\blender.exe -b --python tools/ai3d/export_for_mixamo.py -- <name>`\n2. Open that FBX in AccuRig, rig it, and check that the fingers and elbows bend properly in AccuRig's preview.\n3. Export as **FBX**, in **T-pose**, with the mesh and textures included.\n4. **Save it into `art/accurig/<name>.fbx`**, keeping the same name. Use this separate folder so the original stays untouched.\n\n## Step 2: Mixamo\n\n1. Go to mixamo.com and click **Upload Character**. Choose your AccuRig file, `art/accurig/<name>.fbx`.\n2. Mixamo should keep AccuRig's skeleton. If it asks you to place markers, do so: chin, wrists, elbows, knees, groin.\n3. Pick each animation and download it as **FBX**, **30 frames per second**:\n   - **The first one must be \"With Skin\".** Use `idle` for this one. It provides the model itself.\n   - **All the others \"Without Skin\".** They're smaller and faster.\n   - For walking and running, tick **In Place** if Mixamo offers it. The import script pins them to the spot anyway.\n4. Save every download into `art/mixamo/download/` with a clear name, for example:\n   `goblin_idle.fbx`, `goblin_walk.fbx`, `goblin_run.fbx`, `goblin_attack.fbx`, `goblin_hit.fbx`, `goblin_die.fbx`\n\nGood Mixamo picks for a monster: Breathing Idle, Zombie Walk or Mutant Walking, Mutant Run, Zombie Attack or Mutant Punch, Hit Reaction, Dying. For townsfolk: Idle, Walking, Talking.\n\n## Step 3: Turn the downloads into the game's model\n\nOpen a terminal (Git Bash or PowerShell) in the project folder and run this, all on one line:\n\n```\nF:\\Downstairs\\Blender\\blender.exe -b --python tools/ai3d/import_from_mixamo.py -- traffic_cone_goblin goblin_idle.fbx idle goblin_walk.fbx walk goblin_run.fbx run goblin_attack.fbx attack goblin_hit.fbx hit goblin_die.fbx die\n```\n\n- **First word after `--`:** the character's ID, the same `<name>` as the file in `godot/models/characters/`.\n- **After that, pairs:** a file from `art/mixamo/download/`, then the animation name it becomes. The first pair must be the \"With Skin\" file.\n- **The result:** `godot/models/characters/rigged/<name>.glb`.\n\n**Never** overwrite `godot/models/characters/rigged/intern_pip.glb`. Other characters copy Pip's moves from it.\n\n## Step 4: See it in the game\n\n1. Open the Godot editor once (`F:\\Downstairs\\Godot_v4.7.2-stable_win64.exe\\Godot_v4.7.2-stable_win64.exe`, then open the project in the `godot` folder) so it picks up the new file. Wait for the import bar to finish, then close it. Starting the game alone does **not** import new files. Without opening the editor window, this does the same thing from a terminal:\n   `F:\\Downstairs\\Godot_v4.7.2-stable_win64.exe\\Godot_v4.7.2-stable_win64_console.exe --headless --path godot --editor --quit`\n2. Run `F:\\Downstairs\\Play Downstairs.bat` and pick the floor where that character lives.\n3. Press **M** for the travel map and click their camp or town. Press **F1** to fly, which is safe and fast.\n\n## Step 5: Changing it\n\n**Too big or too small:**\n1. In the Godot editor, find the file under `models/characters/rigged/` in the FileSystem panel and click it once.\n2. Open the **Import** tab (beside the Scene tab, top left) and change **Root Scale**. For example, 1.2 makes it 20% bigger.\n3. Click **Reimport**.\n\n**Face, skin or colours:**\n1. The textures are the `.jpg` and `.png` files with the character's name, next to the `.glb`.\n2. Open one in any paint program. Krita is free.\n3. Paint over it and save it with the **same name**. Godot picks it up the next time it opens.\n\n**A different animation:**\n1. Download the new one from Mixamo (\"Without Skin\").\n2. Run Step 3 again with the whole list, swapping the new file in for the old one. Animations that aren't listed are left out, so list them all every time.\n\n**Looks wrong after import:**\n- **Stands in a T-pose:** the animation names don't match the table above. Check the spelling, all lower case.\n- **Invisible, or only bones:** the first file wasn't downloaded \"With Skin\".\n- **Slides along the ground:** the walk or run wasn't In Place. Download it again with In Place ticked.\n- **Very dark or one flat colour:** a texture file is missing next to the `.glb`. Copy it in from `art/incoming/<name>/`.\n- **Arms twisted:** AccuRig's rig was off. Redo the rig in AccuRig and start again from Step 1.\n\n## What Mixamo can't do\n\n- **Non-humanoid monsters:** Mixamo only animates humanoids, meaning two arms, two legs and a head. Moths, lampreys, slimes, the Kraken, wyrms and the Big Sucker need custom rigs in Blender. Leave those for when you have credits again.\n- **Already-made characters:** most AI characters were already rigged by `tools/ai3d/auto_rig.py`. A Mixamo or AccuRig version you make simply replaces them, because it's the same file in `rigged/`.\n\n## Where everything is\n\n| What | Where |\n|---|---|\n| Unrigged character models | `godot/models/characters/<name>.glb` |\n| Rigged, animated versions (the game prefers these) | `godot/models/characters/rigged/<name>.glb` |\n| Characters to open in AccuRig (FBX with texture) | `art/mixamo/upload/` |\n| Your AccuRig exports, going to Mixamo | `art/accurig/` |\n| Mixamo downloads | `art/mixamo/download/` |\n| Original Tripo downloads | `art/incoming/<name>/` |\n| The import script | `tools/ai3d/import_from_mixamo.py` |\n\n## Notes from the cone troll (2026-11-09)\n\n- Only **one** download needs to be *With Skin* (usually the walk). Every other clip can be *Without Skin*.\n- Mixamo saves the With Skin file in the model's own pose (for a Tripo model this can be lying down) and the Without\n  Skin ones in a T-pose. The import notices, stands the model up in the T-pose, and copies every clip across bone by\n  bone, so this needs nothing from you.\n- Put `!` after a clip name on the import command to pin it in place (a lunge or a leap that travels):\n  `import_from_mixamo.py -- cone_troll walk.fbx walk swipe.fbx \"attack!\" jump.fbx \"slam!\" roar.fbx taunt die.fbx die`\n- Per-character finishing touches (an idle made from another clip, texture size, height) go in\n  `tools/ai3d/extras/<character>.py`.\n- Tripo textures can come at 8192 px; the troll's extras shrink the colour map to 2048 and drop the rest.\n"}, {"id": "audit", "name": "Character audit", "path": "art/CHARACTER_AUDIT.md", "md": "# Character audit (2026-11-09)\n\nEvery character model in the game was rendered from the front and checked for whether its arms stand clear of its body,\nwhich Mixamo's auto-rigger needs. Results, and what to do with each group.\n\n## 1. Remake in Tripo (4)\n\nThese need a new model, made the strict way: a T-pose picture with chunky hands (made locally by\n`tools/ai3d/make_concepts.py`; AccuRig must be closed while it runs), then Tripo **image-to-3D**, then Mixamo.\n\n| Character | Why |\n|---|---|\n| captain_kevlar | Bulky armour, with the arms pressed against the body |\n| the_cone_king | Merged into his throne and robes |\n| traffic_cone_goblin | Arms are fine now, but the hands are thin melted claws |\n| sergeant_pylon | Arms are fine now, but the hands are thin melted claws |\n\nAlso: **marta_vance** is rigged and animated, but needs the **Texture** step in Tripo (she's grey).\n\n## 2. Ready for Mixamo as they are (about 77)\n\nArms out in a T-pose, so they can go straight into Mixamo's auto-rigger with no Tripo work. Upload the FBX from\n`art/mixamo/upload/<name>.fbx` (one is already there for every character).\n\narchmage_pell, auntie_dumpling, auntie_sludge, barb_the_innkeeper, bark_blade, benchwright_bo, bev, big_deb, bix,\nbogling_townsperson, cardboard_goblin, cave_troll, chief_grubtooth, cinnamon_sue, clanker_townsperson, clearance_carl,\ncleaver_jo, clockwork_debt_collector, cone_captain, cone_chucker, curbside_cal, dot, drill_prophet, fennix_townsperson,\nforager_fern, foreman_gruss, foreman_tuck, grandma_gristle, gravy_the_innkeeper, grimhide_townsperson, gutter_hag,\ngutterkin_townsperson, human_townsperson, judge_vrask, lawn_gnome_cultist, lemonade_lee, lord_hunter_facet,\nlost_receipts, lumen_townsperson, madame_prickle, mall_cop_ogre, mangle_the_innkeeper, matron_hale, mattress_mo,\nmayor_eternal, mrs_doily, nan_gangway, neighbourhood_watch, officer_brick, ogrekin_townsperson, old_bramble,\nold_reggie, pickles, quillback_townsperson, registrar_odessa, rinse, rusty_kell, scraps, spin_cycle, spool,\nstoneblood_townsperson, suds, sunny_the_sponsor_rep, supervisor_mox, the_fryer_baron, the_gnome_pope,\nthe_hoa_president, the_host, the_rat_senate_speaker, the_rat_throne_king, the_undermayor, tourist_hunter,\ntunnel_mole_kin, twig, yard_sale_yolanda\n\nAlready done in Mixamo: intern_pip, marta_vance.\n\nKeep an eye on: officer_brick (odd blocky outline) and cave_troll (ape-like arms angled down).\n\nThe 11 `*_townsperson` models will probably be replaced by the base-body crowd (Quaternius), so do those last, or skip them.\n\n## 3. Creatures: no Mixamo, no Tripo remake (45 made)\n\nNon-humanoid monsters (moths, slimes, lampreys, wyrms, the Kraken, Lost & Found...). Mixamo can't rig them, and a\nTripo remake wouldn't help. They get custom rigs in Blender, done by Claude.\n\n## 4. Not made yet (21 humanoids, 21 creatures)\n\nMostly deep-floor characters still on the Tripo lists. Make them the strict way from the start (T-pose picture, then\nimage-to-3D).\n\nHumanoids: archivist_quire, commercial_break_imp, cue_card_cal, dust, executive_shade, gaffer_tape, gladiator_bot,\ngloria_from_hr, head_archivist_vellum, intern_zero, janitor_sol, librarian_lich, madame_encore, ratings_wraith,\nsir_skip_ad, stamp, the_chairman, the_editor_in_chief, the_number_one, the_showrunner, ulti_max\n\n## Saving Mixamo work\n\nAll Mixamo rigs share the same bone names. So **each character only needs one download from Mixamo: the rigged model\nitself, With Skin, in its T-pose, no animation.** The animations can be downloaded **once**, on one character, as a\nshared library (idle, walk, run, talk, wave, attack, hit, die and so on), and Claude copies that library onto every\ncharacter during import. This turns about 6 downloads per character into 1.\n"}, {"id": "engine", "name": "Engine port", "path": "ENGINE_PORT.md", "md": "# Moving Downstairs to a game engine\n\n## Recommendation: Godot 4\n\n| | Godot 4 | Unity 6 | Unreal 5 |\n|---|---|---|---|\n| Cost | Free forever, no royalties | Free until about $200K a year in revenue | Free, then 5% of revenue after $1M |\n| Runs on a modest laptop | Yes (editor is about 150 MB) | So-so (multi-GB, heavy) | No, wants a strong GPU |\n| Can Claude write and change it directly | **Yes.** Scripts (GDScript) *and* scenes (`.tscn`) are plain text | Scripts yes, scenes and prefabs are awkward | Mostly visual Blueprints, hard for an AI to edit |\n| Can Claude run and test it | Yes: Godot runs headless from the command line | Limited | No |\n| Play in a browser | Yes (web export) | Yes | No |\n| Comic-ink outline look | Easy: one screen shader | Easy | Easy |\n\nGodot wins for this project. It's free with no strings, it runs on your laptop, and nearly everything in a Godot project is a text file. Claude can write, edit and test those files the same way it built the browser prototype.\n\nUse **Godot 4 \"Standard\"**, not the .NET/C# version, and write the scripts in **GDScript**. GDScript is the language that also exports to web.\n\n## What carries over, and what gets rebuilt\n\n| Prototype (browser) | In Godot | How |\n|---|---|---|\n| Classes, races, skills (`game/classes.js`) | `data/*.json`, loaded by a `Data` autoload | Converted by script, nothing lost |\n| Monster stats (`MOBDEFS`), loot, 720 recipes, shops | `data/*.json` | Converted by script |\n| Quests and dialog trees (`game/story.js`) | `data/quests.json`, `data/dialogs.json` plus a dialog runner | Converted. Dialog choices that run code become named actions |\n| Floor layouts (`worlds/floors.js`, town and camp generator) | GDScript generator that builds the same towns, camps and scenery | Re-written (same rules, same seeds) |\n| Monster, NPC and building meshes | `.glb` model files | Exported from the prototype as-is, to replace with better art later |\n| Walk cycles (vertex-shader rig) | Real skeletons plus animations | Rebuilt: Mixamo (free) or Blender rigging |\n| Combat, mob AI, parry, dodge | `CharacterBody3D` plus `NavigationAgent3D` (real navmesh) | Re-written, same numbers |\n| HUD, inventory, skill tree, crafting, quests UI | Godot `Control` scenes | Re-written |\n| Ink outline post-process | One screen-space shader | Ported (same maths) |\n| Voices, SFX, music | `AudioStreamPlayer3D`; your recordings go in `audio/voice/` | Your `voice/SCRIPTS.md` file names still apply |\n| Save game | `user://save.json` | Re-written |\n\nThe design work carries over unchanged: classes, quests, numbers, floors and story. The code that runs it gets rewritten for the engine.\n\n## Step by step at home\n\n### Step 1: Install the tools (one evening)\n1. **Godot 4** (latest 4.x stable, *Standard* build): https://godotengine.org/download. It's a zip with no installer: unzip it, then run `Godot_v4.x-stable_win64.exe`.\n2. **Git**: https://git-scm.com/download/win (accept the defaults).\n3. **Claude Code** on your computer: install the Claude desktop app (Code tab), or the CLI from https://code.claude.com. This lets Claude launch Godot, read its errors and fix them, instead of you copying errors back and forth.\n4. **Blender** (free): https://www.blender.org/download/. You need it in Step 6.\n5. Optional: **VS Code** (https://code.visualstudio.com) with the \"godot-tools\" extension, if you want to read the scripts yourself.\n\n### Step 2: Get the project\n```\ngit clone https://github.com/scottnickolasnoble/dungeon-crawler-world.git\ncd dungeon-crawler-world\ngit checkout claude/device-sync-offline-start-tlcj0x\n```\nThe browser prototype stays in `prototype/` as the reference. The new engine project goes in `godot/` next to it.\n\n### Step 3: Have Claude scaffold the Godot project\nOpen Claude Code in the `dungeon-crawler-world` folder and ask for **Phase 1** (below). It's best to tell Claude where Godot is, e.g. *\"Godot is at C:\\Godot\\Godot_v4.4-stable_win64.exe\"*, so it can run headless checks. Claude will:\n- create `godot/project.godot` and the folder layout (`data/`, `scenes/`, `scripts/`, `models/`, `shaders/`, `audio/`, `ui/`);\n- run a converter that turns the prototype's JS data into JSON;\n- export every prototype model to `.glb` files (a headless browser script);\n- write the player controller, the ink outline shader and Floor 0.\n\n### Step 4: Open it and play\n1. Start Godot, click **Import**, pick `godot/project.godot`, then **Import & Edit**.\n2. Press **F5** (Run Project). You should be on Floor 0 with the lead pipe.\n3. When something's off, tell Claude what you saw. Claude can also run the game headless and read the error log itself.\n\n### Step 5: Port phase by phase (each phase ends playable)\n| Phase | What you get | Rough size |\n|---|---|---|\n| 1. Foundation | Project, data converted, models exported, player movement and camera, ink shader, Floor 0 hall | 1–2 sessions |\n| 2. Fighting | Melee, parry, block, dodge, mobs with navmesh AI and swing tells, loot drops, XP curve | 2–3 sessions |\n| 3. Floor 1 | Floor generator (towns, camps, scenery kit), Stairwell Camp, quests, dialog, merchants, Safe Room | 2–3 sessions |\n| 4. Character | HUD, inventory, equipment, character sheet, skill tree, Hall of Callings, guilds, crafting benches | 3–4 sessions |\n| 5. Floors 2–6 | All floors, bosses, audio and voices, settings menu, save and load | 3–5 sessions |\n| 6. Art upgrade | Real models and animations (Step 6) | Ongoing |\n\n### Step 6: Upgrade the art (when the game plays well)\n- **Characters and monsters:** generate a base model in **Tripo AI** (free plan, about 300 credits a month; free models are public but fine for a personal game) or sculpt in Blender. Auto-rig humanoids for free at **Mixamo** (https://www.mixamo.com, Adobe account) and download walk, attack and idle animations. Then drop the `.glb`/`.fbx` into `godot/models/`.\n- **Blender MCP** (free): install the add-on from https://github.com/ahujasid/blender-mcp and connect it to Claude Desktop. Claude can then build, fix and texture models directly in your Blender.\n- **Textures:** Dream Textures (free Blender add-on, needs a decent GPU) for painted building and skin textures.\n- Each model swaps in by replacing the file; the game code doesn't change.\n\n### Step 7: Build a version to play\n- **Windows game:** Godot → Project → Export → add \"Windows Desktop\" (first time: \"Manage Export Templates\" → Download). You get a `.exe` you can run anywhere.\n- **Browser:** add a \"Web\" export. The output is too big for a Claude artifact, but you can upload it free and private on https://itch.io (set it to \"Restricted\" or \"Draft\").\n\n## Tips\n- Keep `prototype/` working: it's the spec. When the Godot version disagrees, the prototype shows what was intended.\n- Commit after every phase (`git add -A`, then `git commit -m \"Phase 2: combat\"`), so you can always roll back.\n- The project uses Godot's **Forward+** renderer, because the game stays on the home PC (RTX 3070) and the ink shader reads Forward+'s normal buffer. A browser build or a much weaker machine would need the Compatibility renderer and a reworked ink shader.\n"}, {"id": "t-plan", "name": "Tripo plan", "path": "art/TRIPO_PLAN.md", "md": "# Tripo plan: 17,500 credits (revised: props mostly made on your PC)\n\n**Plan:**\n- **Tripo:** 241 models, 12,050 credits: all 216 characters (including the 36 chamber bosses) plus the 25 props that need Tripo's detail.\n- **Your PC:** everything else, free. Claude runs a local AI batch for furniture and clutter and builds architecture in Blender.\n- **Spare:** 5,450 credits held back for redoing characters that come out badly, or for upgrading any PC-made prop you don't like.\n\nCharacters go in `art/incoming/<folder>/`; props in `art/incoming/props/<folder>/`.\n\n---\n\n## Part 1: characters, all 216 (10,800 credits)\n\nAll from **TRIPO_CAST_3.md**, in its order:\n\n1. Floors 7–9 townspeople (14)\n2. New faction units (8)\n3. Floors 10–18 casts (119)\n4. Rivals (16)\n5. Club regulars (5)\n6. Gods (11)\n7. Priests (10)\n8. Chamber bosses (36), two per floor\n\n## Part 2: props that need Tripo (25 props, 1,250 credits)\n\n- **From TRIPO_PROPS.md, weapons, all 12** (you hold them in front of your face, so they need the detail): wpn_lead_pipe · wpn_nail_bat · wpn_fire_axe · wpn_cleaver · wpn_rebar_spear · wpn_golf_club · wpn_frying_pan · wpn_shovel · wpn_umbrella_rapier · wpn_crowbar · wpn_cone_mace · wpn_mop_halberd\n- **From TRIPO_EVERYDAY.md:** fp_hand (your arm, in every frame)\n- **From TRIPO_PROPS.md, vehicles you sit inside:** veh_hatchback · veh_safari_jeep · veh_golf_cart\n- **From TRIPO_PROPS.md:** prop_loot_box (the game's signature object)\n- **From TRIPO_DEEP_PROPS.md, organic gothic pieces the PC methods do badly:** gargoyle · gothic_throne · iron_chandelier · candelabra · coffin · haunted_portrait · club_jukebox · camera_crane\n\n---\n\n## Made on your PC instead (Claude does these)\n\n- **Local AI batch** (overnight on the RTX 3070): about 70 pieces.\n  - TRIPO_EVERYDAY's furniture and clutter (desk, shelves, boxes, bins, barrels, crates, beds, counters, plants, lights and so on)\n  - TRIPO_COMIC_KIT's K1–K10 clutter and the hill dressing\n  - the 13 temple altars\n  - the camp props (tent, bonfire, bone heap, banner, weapon rack)\n- **Blender, built by Claude:** about 65 pieces. Castle walls, towers, gatehouse, drawbridge, gallows, bridges, fences, headstones, crypt doors; stadium stands, bleachers, set fronts; bookshelves, card catalogues, gantries; server racks, cooling towers, dishes, masts; the building-front kit (fire escapes, awnings, shutters, AC units, balconies, boarded windows); the club bar, booths and tables.\n\nIf any PC-made prop isn't good enough, its full Tripo prompt is still in the lists. Spend the spare credits there.\n"}, {"id": "t-cast3", "name": "Tripo cast 3", "path": "art/TRIPO_CAST_3.md", "md": "# Tripo: every remaining character (cast 3)\n\nThis is everything the game still needs. It covers:\n\n- the Undercity's missing townspeople\n- the new faction units\n- the rival contestants\n- the hidden-club regulars\n- the gods and their priests\n- Floors 10 to 18\n\nIt was built from `art/WORLD.md`.\n\n**Settings:** same as before (text tab, H3.1 Best Quality, 4K, PBR off, Triangle, 40,000).\n\n**Saving:** `art/incoming/<folder>/<folder>.glb`, then tell Claude \"import the new ones\". Heights come from `art/tripo_queue_3.json`, so you don't type them.\n\n**Creatures** (no T-pose) won't walk until they're rigged; they're marked with ⚠.\n\n## Floors 7 to 9: the Undercity townspeople still missing\n\n### 1. clerk damp\nfolder: clerk_damp · height 1.7 m\n\nFull-body 3D game character, stylized comic book cartoon with a clear, expressive, readable face and believable proportions, hand-painted texture with bold black ink lines and cel-shaded colours. A damp, earnest tenant advocate in a soggy cardigan and wellies, clutching a dripping folder of complaints, glasses fogged. Standing in a T-pose, arms straight out, facing forward, empty hands, no base.\n\n### 2. rivet rosie\nfolder: rivet_rosie · height 1.75 m\n\nFull-body 3D game character, stylized comic book cartoon with a clear, expressive, readable face and believable proportions, hand-painted texture with bold black ink lines and cel-shaded colours. A muscular riveter armourer in a welding apron covered in rivets, a bandana, rolled sleeves and a hammer on her belt. Standing in a T-pose, arms straight out, facing base.\n\n## 103. Bogling townsperson\nfolder: bogling_townsperson\n\nFull-body 3D game character, stylized comic book cartoon with believable proportions and a clear, readable, appealing face, hand-painted texture with bold black ink lines and cel-shaded colours. A short, big-headed frog-person with wet green spotted skin, huge round eyes, a wide mouth and a leaf cloak. Standing in a T-pose, arms straight out, facing forward, empty hands, no base.\n\n## 104. Clanker townsperson\nfolder: clanker_townsperson\n\nFull-body 3D game character, stylized comic book cartoon with believable proportions and a clear, readable, appealing face, hand-painted texture with bold black ink lines and cel-shaded colours. A humanoid robot of old grey metal plates with a dented friendly face plate and teal glowing eyes. Standing in a T-pose, arms straight out, facing forward, empty hands, no base.\n\n## 105. Grimhide townsperson\nfolder: grimhide_townsperson\n\nFull-body 3D game character, stylized comic book cartoon with believable proportions and a clear, readable, appealing face, hand-painted texture with bold black ink lines and cel-shaded colours. A tall muscular green-skinned orc-person with tusks, pointed ears, an underbite and sturdy leather clothes. Standing in a T-pose, arms straight out, facing forward, empty hands, no base.\n\n## 106. Quillback townsperson\nfolder: quillback_townsperson\n\nFull-body 3D game character, stylized comic book cartoon with believable proportions and a clear, readable, appealing face, hand-painted texture with bold black ink lines and cel-shaded colours. A short hedgehog-person with spines over the back and head, a small black nose, bright eyes and a neat waistcoat. Standing in a T-pose, arms straight out, facing forward, empty hands, no base.\n\n## 107. Mothwing townsperson\nfolder: mothwing_townsperson\n\nFull-body 3D game character, stylized comic book cartoon with believable proportions and a clear, readable, appealing face, hand-painted texture with bold black ink lines and cel-shaded colours. A slim moth-person with soft fur, big dark eyes, feathered antennae and dusty folded wings, in a plain tunic. One single character, neutral pose, facing forward, no ground, no base, no scenery.\n\n"}, {"id": "t-comic", "name": "Tripo comic kit", "path": "art/TRIPO_COMIC_KIT.md", "md": "# Tripo: the comic kit (detail for every floor)\n\nThis list is about **density and character**. Comics never have an empty wall or a bare corner, so this kit covers:\n\n- building-front pieces that cover the plain box walls\n- clutter to fill every street and camp\n- dressing for the new hills\n- one or two signature pieces per floor\n\nIt's separate from `TRIPO_PROPS.md` (weapons, vehicles, camp basics). Do that list first if you haven't.\n\n**Settings:** same as before (text tab, H3.1 Best Quality, 4K, PBR off, Triangle). Use these polycounts:\n\n- **Big:** 40,000 (building pieces, landmarks)\n- **Mid:** 20,000 (furniture-sized things)\n- **Small:** 8,000 (clutter, placed by the hundred)\n\n**Saving:** `art/incoming/props/<folder>/<folder>.glb`, then tell Claude \"import the props\". The *height* line is for the importer only; don't paste it into Tripo.\n\n**Every prompt below already includes the style line.** It asks for the ink outlines to be painted into the texture, which is what makes props sit inside the comic look rather than on top of it.\n\n---\n\n## Everywhere (used on every floor, so do these first)\n\n### K1. Overflowing Wheelie Bin\nfolder: kit_wheelie_bin · height: 1.2 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy and worn. A dented green wheelie bin with the lid propped open by overflowing rubbish bags, a fish skeleton hanging over the edge and a sticker reading DO NOT FEED. Single object, no ground, no base, no scenery.\n\n### K2. Pile of Rubbish Bags\nfolder: kit_bin_bags · height: 0.9 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A heap of five shiny black rubbish bags, one torn open spilling cans and paper, with flies drawn as little ink squiggles. Single object, no ground, no base, no scenery.\n\n### K3. Wooden Pallet Stack\nfolder: kit_pallets · height: 0.8 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, weathered. A leaning stack of four splintered wooden pallets with a coil of rope and a crushed paint tin on top. Single object, no ground, no base, no scenery.\n\n### K4. Traffic Barrier and Cones\nfolder: kit_roadworks · height: 1.1 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A red-and-white striped roadworks barrier with a blinking amber lamp, three orange cones leaning against it and a ROAD CLOSED sign. Single object, no ground, no base, no scenery.\n\n### K5. Missing-Posters Lamp Post Box\nfolder: kit_utility_box · height: 1.4 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A grey street utility cabinet covered in layers of torn MISSING posters, graffiti tags and a NETWORK sticker, one door hanging open with tangled wires. Single object, no ground, no base, no scenery.\n\n### K6. Graffiti Concrete Barrier\nfolder: kit_jersey_barrier · height: 1.0 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A chunky concrete road barrier covered in bright spray-paint graffiti: an arrow pointing down, the words DON'T and a crude smiling face. Single object, no ground, no base, no scenery.\n\n### K7. Burning Oil Drum\nfolder: kit_fire_barrel · height: 1.1 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A rusty oil drum with holes punched in its sides and stylised cartoon flames rising out of the top, a pair of gloves draped on the rim. Single object, no ground, no base, no scenery.\n\n### K8. Network Camera on a Pole\nfolder: kit_network_camera · height: 3.0 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A tall thin pole topped with a bulky TV broadcast camera with a red ON AIR light and a little satellite dish, cables dangling. Single object, no ground, no base, no scenery.\n\n### K9. Fan Box Drop (sponsor crate)\nfolder: kit_fan_box · height: 0.8 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A gift box wrapped in shiny foil paper printed with hearts and the word FANS, a big bow on top and a little parachute crumpled beside it. Single object, no ground, no base, no scenery.\n\n### K10. Debris Pile\nfolder: kit_debris · height: 0.7 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A low pile of broken bricks, a bent pipe, a cracked tile and a single shoe, like rubble swept into a heap. Single object, no ground, no base, no scenery.\n\n---\n\n## Building-front kit (stuck onto the plain walls of every town)\n\nThese are placed onto existing walls. Each should be **flat on the back**.\n\n### B1. Fire Escape\nfolder: bld_fire_escape · height: 9.0 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, rusty. A three-storey iron fire escape with zig-zag stairs, railed landings and a drop ladder, a plant pot and a hanging shirt on one landing. Flat back to fix against a wall. Single object, no wall, no ground, no scenery.\n\n### B2. Shop Awning and Window\nfolder: bld_shopfront · height: 3.6 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A small shop front panel: a big display window with hand-painted lettering, a striped canvas awning, a glass door with a CLOSED sign and a crate of produce on the step. Flat back to fix against a wall. Single object, no ground, no scenery.\n\n### B3. Roller Shutter with Graffiti\nfolder: bld_roller_shutter · height: 3.0 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A metal roller shutter in a steel frame, half pulled down, covered in graffiti and dents, with a dark gap at the bottom and two glowing eyes painted in the dark. Flat back. Single object, no ground, no scenery.\n\n### B4. Air Conditioning Units and Pipes\nfolder: bld_ac_units · height: 2.2 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A cluster of two boxy wall air-conditioning units with dripping pipes, a tangle of cables and a drainpipe running down beside them. Flat back to fix against a wall. Single object, no ground, no scenery.\n\n### B5. Balcony with Laundry\nfolder: bld_balcony · height: 2.0 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A small apartment balcony with an iron railing, a washing line of colourful laundry, a deck chair and a satellite dish. Flat back to fix against a wall. Single object, no ground, no scenery.\n\n### B6. Neon Sign (blank board)\nfolder: bld_neon_sign · height: 1.6 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A projecting neon sign bracket with a glowing pink and blue tube border around a blank dark panel, a pigeon sitting on top. Flat back. Single object, no ground, no scenery.\n\n### B7. Boarded-Up Window\nfolder: bld_boarded_window · height: 1.8 m · *mid*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A window frame boarded over with mismatched planks nailed at angles, one board pried loose, scratch marks on the wood and KEEP OUT painted in red. Flat back. Single object, no ground, no scenery.\n\n### B8. Rooftop Water Tank\nfolder: bld_water_tank · height: 4.5 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, weathered. A wooden rooftop water tower on a steel stand with a conical roof, a ladder and a faded painted advert on the side. Single object, no ground, no scenery.\n\n---\n\n## Hills and wild ground (dressing for the new terrain)\n\n### H1. Boulder Cluster\nfolder: hill_boulders · height: 2.2 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines and crack lines painted into the texture and flat cel-shaded colours. A cluster of three chunky rounded boulders with moss on top and a crack running through the biggest one. Single object, no ground, no base, no scenery.\n\n### H2. Rock Outcrop Ledge\nfolder: hill_outcrop · height: 4.0 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines and crack lines painted into the texture and flat cel-shaded colours. A jagged layered rock outcrop that juts out of a hillside like a shelf, with a flat top you could stand on. Single object, no ground, no scenery.\n\n### H3. Dead Twisted Tree\nfolder: hill_dead_tree · height: 5.0 m · *mid*\n\n3D game prop, stylized comic book horror cartoon, exaggerated proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A gnarled leafless tree with a twisted trunk and clawing branches, a frayed rope swing hanging from one branch and a crow on top. Single object, no ground, no base, no scenery.\n\n### H4. Hiker's Cairn and Flag\nfolder: hill_cairn · height: 1.8 m · *small*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A stacked stone cairn with a tattered flag on a stick at the top and a contestant wristband tied around the stick. Single object, no ground, no base, no scenery.\n\n### H5. Wooden Trail Steps\nfolder: hill_trail_steps · height: 1.2 m · *mid*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, weathered. A short flight of five rough log steps pegged into a slope, with a rope handrail on wooden posts. Single object, no ground, no scenery.\n\n### H6. Junk Heap Mound\nfolder: hill_junk_heap · height: 3.0 m · *big*\n\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A big heaped mound of junk: a fridge, tyres, a bike wheel, a broken TV, a mattress and bags, all piled into a rough hill. Single object, no ground, no scenery.\n\n---\n\n## One signature set per floor\n\n### Floor 2: The Laundromat\n**L2a. Lost Sock Mountain** · folder: f2_sock_mountain · height: 3.0 m · *big*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A towering heap of thousands of odd socks in every colour and pattern, a few shoes buried in it, one striped sock hanging off the top like a flag. Single object, no ground, no scenery.\n\n**L2b. Coin-Op Change Machine** · folder: f2_change_machine · height: 1.8 m · *mid*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, grimy. A wall-mounted coin change machine with a dented front, a coin tray overflowing with old coins and an OUT OF ORDER note that has been crossed out and rewritten as OUT OF MERCY. Single object, no ground, no scenery.\n\n### Floor 3: The Soup District\n**L3a. Soup Kitchen Stall** · folder: f3_soup_stall · height: 2.8 m · *big*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A street soup stall with a striped canopy, three steaming cauldrons on the counter, hanging ladles and a chalkboard menu reading TODAY: GUESS. Single object, no ground, no scenery.\n\n**L3b. Butcher's Hanging Rail** · folder: f3_meat_rail · height: 2.5 m · *mid*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A butcher's iron rail on two posts with hooks holding cuts of meat, strings of sausages and one suspiciously human-shaped boot. Single object, no ground, no scenery.\n\n### Floor 4: The Endless Mall\n**L4a. Escalator Section** · folder: f4_escalator · height: 5.0 m · *big*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A short broken shopping-mall escalator rising one storey, steps jammed, a shopping bag stuck halfway up and a SALE banner on the side. Single object, no ground, no scenery.\n\n**L4b. Food Court Table Set** · folder: f4_food_court · height: 1.2 m · *mid*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A round food-court table with four bolted plastic chairs, an abandoned tray of half-eaten fries and a cup that's still somehow fizzing. Single object, no ground, no scenery.\n\n### Floor 5: Suburbia Infinite\n**L5a. Perfect Picket Mailbox** · folder: f5_mailbox · height: 1.3 m · *small*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A cheerful red suburban mailbox on a white post with the flag up, a letter sticking out that reads WE SEE YOU, and a too-neat flower bed around its base. Single object, no ground, no scenery.\n\n**L5b. Kids' Playset** · folder: f5_playset · height: 3.2 m · *big*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A backyard wooden playset with a slide, two swings and a little fort; one swing moving on its own, a teddy bear left on the slide. Single object, no ground, no scenery.\n\n### Floor 6: The Canopy\n**L6a. Giant Jungle Root Arch** · folder: f6_root_arch · height: 5.0 m · *big*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. An arch of massive twisted jungle roots you can walk under, hung with vines, glowing mushrooms and a tourist's lost camera. Single object, no ground, no scenery.\n\n**L6b. Safari Hunting Hide** · folder: f6_hunting_hide · height: 3.5 m · *big*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A camouflaged wooden hunting hide on stilts with a slit window, a ladder, a row of trophy name-tags nailed on the front and binoculars on the sill. Single object, no ground, no scenery.\n\n### Floor 7: The Drowned Cistern\n**L7a. Sunken Rowing Dock** · folder: f7_dock · height: 1.5 m · *big*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, waterlogged. A short rotting wooden jetty on posts with a lantern on a pole, coiled rope and an eviction notice nailed to the last post. Single object, no water, no ground, no scenery.\n\n**L7b. Brick Sewer Outflow** · folder: f7_outflow · height: 3.0 m · *big*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A round brick sewer outflow arch with a rusted grate half torn off, green slime dripping from the lip and something's tail disappearing inside. Single object, no ground, no scenery.\n\n### Floor 8: The Workings\n**L8a. Coal Slag Heap with Shovel** · folder: f8_slag_heap · height: 2.5 m · *mid*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, sooty. A heap of black coal and glowing orange slag, a shovel stuck in the top and a miner's helmet with a cracked lamp on the side. Single object, no ground, no scenery.\n\n**L8b. Clocking-In Machine** · folder: f8_time_clock · height: 2.0 m · *mid*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A heavy cast-iron factory time clock on a post with a rack of punch cards beside it; the clock face has no numbers, just the word NOW. Single object, no ground, no scenery.\n\n### Floor 9: The Undercity\n**L9a. Civic Ballot Box Kiosk** · folder: f9_ballot_kiosk · height: 2.4 m · *mid*\n3D game prop, stylized comic book cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A grand little civic voting kiosk with a curtained booth, a brass ballot slot shaped like a rat's mouth and election posters all showing the same rat. Single object, no ground, no scenery.\n\n**L9b. Ornate Rat Gate** · folder: f9_rat_gate · height: 4.0 m · *big*\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours. A tall wrought-iron city gate whose bars are shaped like rats climbing over each other, a crest of a crowned rat on top and chains hanging from one side. Single object, no ground, no scenery.\n\n---\n\n**Total:** 42 prompts, about 2,100 credits.\n\n**Suggested order:** Everywhere (K1–K10), then the building-front kit (B1–B8), then the hills (H1–H6), then the floor sets. The first two groups change the look of every floor at once.\n"}, {"id": "t-deep", "name": "Tripo deep props", "path": "art/TRIPO_DEEP_PROPS.md", "md": "# Tripo: the props for Floors 10 to 18, temples, clubs and castles\n\nThe new floors, the temples (Floor 7 onward), the hidden clubs (every floor) and Castle Dread are built from these. The game already asks for these names. Until each one exists that spot stays empty, so the more you make, the fuller the floors get.\n\n**Settings:** same as before (text tab, H3.1 Best Quality, 4K, PBR off, Triangle). Polycount by size:\n\n- **Big:** 40,000\n- **Mid:** 20,000\n- **Small:** 8,000\n\n**Saving:** `art/incoming/props/<folder>/<folder>.glb`, then tell Claude \"import the props\".\n\n## The castle kit (Floor 14, and any castle or keep anywhere)\n\n### 1. castle wall\nfolder: castle_wall · height 6 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A long section of grey stone castle curtain wall with crenellated battlements on top, arrow slits, ivy and moss. Long and straight, flat ends so sections join. Single object, no ground, no base, no scenery.\n\n### 2. castle tower top\nfolder: castle_tower_top · height 5 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. The crenellated top of a round stone castle tower with a pointed slate roof, a tattered flag and a crow. Single object, no ground, no base, no scenery.\n\n### 3. castle gatehouse\nfolder: castle_gatehouse · height 10 m · *big*\n\n3D game prop, stylized comic book horror cartoon, exaggerated chunky proportions, hand-painted texture with bold black ink outlines painted into the texture and flat cel-shaded colours, eerie. A gothic castle gatehouse with two
