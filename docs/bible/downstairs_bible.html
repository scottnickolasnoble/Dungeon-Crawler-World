le", "Walk", "Attack", "Death", "Hit reaction (optional)"], "extra": ["Shout or whistle: search \"Shout\" or \"Battlecry\"", "Charge: search \"Mutant Run\" or \"Running\"", "360 attack: search \"Melee Attack 360\""], "title": "Camp Boss · The Wardens' Gate"}, {"id": "cardboard_goblin", "name": "Cardboard Goblin", "boss": false, "floor": null, "floorName": "", "humanoid": true, "status": "ready", "moves": [], "need": ["Idle", "Walk", "Attack", "Death", "Hit reaction (optional)"], "extra": [], "title": ""}, {"id": "the_deep_fryer", "name": "The Deep Fryer", "boss": false, "floor": null, "floorName": "", "humanoid": false, "status": "ready", "moves": [], "need": ["Idle", "Walk", "Attack", "Death", "Hit reaction (optional)"], "extra": [], "title": ""}]}, "docs": [{"id": "story", "name": "Story", "path": "art/STORY.md", "md": "# Downstairs: the storyline\n\nThis is the story bible. It keeps every floor theme, character and quest already in the game, and turns them into one continuous mystery instead of \"town, camps, boss, stairs\".\n\n## How every floor is built\n\nEach floor has five layers. The boss is the end of the floor's story, not just its strongest monster.\n\n1. **Survival problem.** Food, water, shelter, light, sickness, the environment.\n2. **Civilisation problem.** The town, its factions, merchants, guilds and other contestants, and what they want from you.\n3. **Mystery.** Something on the floor doesn't make sense.\n4. **Dungeon mechanism.** A puzzle, old machine, ritual, collection or route. Each floor uses a different kind, so they never feel like the same puzzle twice.\n5. **Boss.** Whoever controls or protects the floor's central problem. Most bosses have three endings: **kill**, **bargain**, or **uncover the truth**, which needs the floor's knowledge and relationships.\n\n## Four kinds of progress\n\n| Kind | How you earn it | What it gets you |\n|---|---|---|\n| Combat | Kill monsters and bosses | XP, gear, power |\n| Fans | Put on a show: big kills, near deaths, drama, style | Fan boxes, sponsors, Network favour |\n| Knowledge | Investigate, read, solve, notice | Secrets, other ways past problems, the real story |\n| Relationships | Help people and factions, keep promises | Allies, truces, changes on later floors |\n\n**The central tension:** the audience loves violence and spectacle, and the truth is found through mercy and curiosity. Killing the boss earns the most fans. Uncovering the truth earns the least fans and the most knowledge. A player who kills everything can finish the game. A player who looks closer gets a different, stranger story and a different ending. The Network notices which kind of player you are.\n\n**What players should feel, act by act:**\n\n| Floors | The player thinks | What is really going on |\n|---|---|---|\n| 1. Undercroft | \"We're trapped. I need food, water and a way down.\" | Contestants are being sorted and watched. |\n| 2. Laundromat | \"This place has rules and machinery.\" | The dungeon is ancient and automated. The Network found it; it didn't build it. |\n| 3. Soup District | \"We're contestants in a game, and the game changes people.\" | The player is being selected, shaped and manipulated. |\n| 4–6 | \"The Network is selling us.\" | Sponsors, audiences and hunters feed on the contestants. |\n| 7–9 | \"There's a civilisation down here that knows the truth.\" | The Undercity is made of the survivors of past seasons. |\n| 10–18 | \"The show is the machine.\" | The audience's attention is what powers the dungeon. |\n\n## The truth (spoilers, for writers only)\n\nEvery clue in the game points back at this. Players piece it together slowly; nobody ever explains it outright.\n\n- **The dungeon is older than the Network.** It's a vast machine, here called **the Stack**, built by a vanished people (the **Builders**). Its job was to remake a world's population: sort people, give each one a function (worker, merchant, guardian, monster) and build a society out of them, floor by floor. The Builders' mark is the symbol players keep finding.\n- **The Network didn't build the Stack. It found it.** It can't fully control the machine, so it runs it as a game show. The machine needs a fresh population every cycle, and **the audience's attention is the power it runs on**. That's what fans really are, and it's why the Network needs spectacle and doesn't care who dies.\n- **Earth isn't the first world.** Every season is another planet \"acquired\". Some survivors of earlier seasons are still down here, absorbed into the dungeon as townsfolk, custodians, merchants and bosses. Old Reggie clocked in in 1986, Earth time, because the Stack keeps its own clock across seasons.\n- **The Network sealed the old routes.** Traffic cones are **Network-grade seal plastic**, used to contain machinery the Network doesn't understand. The sideways routes between floors, the Great Dryer and the Hall of Callings' old machines are all things the Network has fenced off.\n- **Floor 18 isn't on the Network's map.** The bottom of the Stack is its original control room. The Network has never reached it. \"Winning\" the show as the Network defines it means reaching the Network's last floor and becoming part of the show.\n- **The Host is a past winner.** He won an earlier season and was made the face of the show. The glitches show his real face. He's afraid of the old machinery, and of contestants who ask questions, because he knows where that leads, and because part of him wants them to succeed.\n\n**The ending choice (Floor 18):** take the Network's prize and become the next Host; shut the Stack down, which frees the people inside it but may cost Earth's survivors their way home; or take control of the Stack and turn the show on the Network. Which endings you can reach depends on your knowledge and relationships, not just your level.\n\n## Running threads through Floors 1–3\n\n- **The symbol.** The Builders' mark appears on the Floor 1 ticket machine, Floor 2's employee badge and Floor 3's Scratch Marks. The player learns it means \"the building was here first\".\n- **The scratch marks.** Human tally marks near every way down, from contestants of every season. On Floor 3 they turn out to be pieces of one map of the whole Stack.\n- **Cones as seals.** A running joke that turns out to be load-bearing: from Pickles' \"key\" to Pylon's toll to the Cone Cathedral.\n- **Dave.** He has been eaten before. He'll be eaten again. \"Don't trust the dryers.\"\n- **Network notices.** A cheerful interruption after every discovery. They get slightly less cheerful each floor.\n\n---\n\n## Floor 0: The Landing (orientation)\n\n**Feel:** Bureaucratic, bright, wrong. A TV lobby that's a little too eager.\n\n- **Quests (kept):** *Orientation*, *Contestant Basics*, *Cardboard Combat*, *Going Down* (all from Intern Pip).\n- **The tutorial teaches everything the game uses:**\n  - movement, attacks, dodging and stamina (cardboard goblins)\n  - the skill tree\n  - crafting and material tracking (Pip hands out a starter kit and a \"Network Materials Ledger\")\n  - safe rooms, food and water\n  - fans: your first kill earns a few viewers, and Pip celebrates far too much\n- **First seed of the mystery:** Pip's orientation video skips a section. If you look at the screen when it skips, you see a frame of the symbol. Pip says the video \"does that sometimes\" and quickly changes the subject.\n- **Exit:** the stairs down. Pip says goodbye like someone who has said it many times, and doesn't expect to see anyone again.\n\n## Floor 1: The Undercroft (survive)\n\n**Feel:** Darkness, confusion, community. A car park the size of a town, lit in pockets.\n\n| Layer | On this floor |\n|---|---|\n| Survival | Water (the camp's water line keeps failing), food, light, safe ground. \"Don't wander into the dark.\" |\n| Civilisation | Stairwell Camp: Marta, Pickles, Bo, Rusty Kell, Dot and frightened new arrivals. |\n| Mystery | The Exit Sign leads to a wall, and human scratch marks surround the doorway, one with a date from before this season. |\n| Mechanism | The parking attendant's ticket machine. |\n| Boss | Sergeant Pylon, who guards the chained stairwell, though not for the reason anyone thinks. |\n\n### Opening\n\nYou arrive at Stairwell Camp in your bathrobe. Marta Vance doesn't send you to kill anything. She tells you the first rule: **nobody knows how to leave.** The first survivors spent days searching. Someone found a glowing EXIT sign and everyone celebrated, but behind the door was solid concrete. \"It isn't an exit. It's bait.\"\n\n### Main arc: \"Welcome to the Dungeon\"\n\n1. **Welcome to the Dungeon** (Marta). Where to sleep, where the water is, how to find food, how the map works, safe ground versus monster territory. \"Don't wander into the dark.\" You learn why the first time you do.\n2. **Nobody Gets Out** (Marta). Find the Exit Sign, open the door and find the wall. Around the doorway are hundreds of human scratch marks, old and fresh. One has a date carved beside it, from before this season of Downstairs.\n3. **The ticket machine** (new, optional; the first puzzle). An abandoned attendant's booth near the Exit Sign holds a machine with 18 level buttons, though the Undercroft only seems to have a few levels. Three damaged parking tickets nearby each carry a symbol, a number and a time. They're instructions. Enter the symbols in the right order and the screen reads: *THE BUILDING WAS HERE BEFORE THE CONTESTANTS.* A Network notice follows at once:\n\n   > NETWORK NOTICE: Congratulations, contestant! You have discovered a thing. Things are not currently redeemable for fan boxes.\n\n4. **Find the Leak** (Marta). The camp's water is going missing. The trail leads to Pylon Point and the goblins (see *Thin the Packs*).\n5. **The Chained Stairwell** (Marta). The way down is chained, and Pylon has the key. This is now the floor's main question: get past Pylon.\n\n### Side arc: the goblins (*Thin the Packs*)\n\nThe goblins are attacking the water line. You follow them and find out why: they're stealing valves to build their own crude irrigation, because they need water too. You choose:\n\n- **Kill them.** Water is safe and the camp is grateful. Big fans, and Pylon's camp gets angrier.\n- **Repair the valve and share the water.** The camp grumbles, and the goblins stop raiding. A truce; goblin outposts become passable.\n- **Let Pickles negotiate.** This opens Pickles' arc early and makes the bargain ending with Pylon easier.\n\nThe lesson for the whole game: **not everything you fight has to die.**\n\n### Pickles' arc: *Cone Collector* and *Cone Coup*\n\n- **Cone Collector.** Pickles wants 12 pieces of cone plastic. It looks like a joke, until he reveals he's making a key. The cones are Network-grade plastic, and the dungeon's machinery behaves strangely around them.\n- **Cone Coup.** Pickles wants Pylon removed. The twist: Pylon's cone stacks aren't decoration. They're a crude seal over something under Pylon Point, and Pylon charges a toll because he's terrified of what happens if anyone breaks them.\n\n### Bo's arc: *Bo's Toolbox*\n\nBo's toolbox is at the Ramp Spiral, but the goblins have taken the springs. Tracking them leads into a maintenance tunnel, where a vending machine is moving: not attacking, just moving. Follow it and it walks through a wall that simply opens. This is the floor's first \"what the hell is this place?\" moment, and it foreshadows the Vending Mimics and the Machine That Ate Dave.\n\n### The camps have purpose\n\n- **The Pigeon Loft.** The Pigeon Elder remembers \"the ones who went down\" before this season, but not where they went. Killing him earns fans; listening to him earns a clue to Floor 3.\n- **The Lightwell.** The moths are maintaining the floor's lights. Kill the Moth Matron and the Lightwell goes dark, so the region gets more dangerous. Bring her a lasting light instead, and she opens hidden maintenance tunnels: a shortcut and a loot route.\n- **The Flooded Bay.** The Big Sucker is guarding a body, not treasure. It belongs to a contestant who died years ago, and their bracelet is still receiving Network notifications. If you read it, the last one says: *\"Contestant, you have been selected.\"*\n- **The Lost Property Office.** Lost & Found has kept every item ever lost on this floor, from every season, some labelled in languages that aren't from Earth.\n\n### Boss: Sergeant Pylon\n\nPylon is a joke boss who's genuinely dangerous: loud, stupid, obsessed with cones, and just trying to survive. He isn't evil.\n\n- **Kill him.** It's fast and earns big fans. His cone seals collapse and something under Pylon Point wakes. It becomes a harder fight on the way back up, and it changes the Undercroft's monster camps.\n- **Bargain** (needs Pickles' arc). Pylon hands over the key and admits he's been terrified of what's under the stairwell. The seal holds, and he becomes a grudging ally who turns up again later.\n- **The truth** (needs the ticket machine and the Flooded Bay clue). Pylon shows you the seal himself. You learn the cones are holding something in, and Pickles finishes his key: a cone-plastic key that opens Network seals on later floors.\n\n### The reveal and the ending\n\nWhen Pylon's stairwell opens, the dungeon announces: **FLOOR COMPLETION CONDITION: 1/1.** Nobody knew there was a condition. The Host appears, applauding. \"Oh! You found the secret.\" A pause. \"There isn't one.\" The wall opens behind him. This is the first time the player realises the dungeon has been tracking them all along.\n\nMarta watches you go. \"Come back if you can.\" Then: \"Most don't.\"\n\n## Floor 2: The Laundromat (understand)\n\n**Feel:** Routine. Clean, bright and still working, which is much creepier than darkness.\n\n| Layer | On this floor |\n|---|---|\n| Survival | Bleach, steam, scalding water, slippery floors. Clean water is everywhere but most of it is soapy, so drinking water must be found or filtered. |\n| Civilisation | The laundromat town; Old Reggie; Spin Cycle; Dave (when not eaten). |\n| Mystery | The laundromat is still processing contestants, and people who died long ago still have washes booked. |\n| Mechanism | The Great Dryer: a sequence put together from symbols on laundry found across the floor. |\n| Boss | Head Custodian Ebb, who believes the whole dungeon is his workplace and everyone in it is a spill. |\n\n### Opening\n\nEverything is running: machines turning, lights on, music playing, no monsters. A voice says \"WELCOME TO CUSTOMER SERVICE.\" The doors lock and a screen lights up: **CURRENT LOAD: 4,117,021 CONTESTANTS**, the number who reached the stairs on Earth this season. The laundromat has been processing them, and nobody knows what that means.\n\n### Main arc: Old Reggie (*Clocking Out*, *End of Shift*)\n\n- **Clocking Out.** Reggie says he mopped these floors for forty years. You ask when he came down. He pauses: \"I don't know.\" In Boiler Room 0 you find hundreds of timecards with thousands of names: some from Earth, some from species you've never seen, and some from contestants who haven't arrived yet. Reggie's card reads **CLOCKED IN: 1986.**\n- **End of Shift.** Reggie wants to finish his shift and leave. Choose:\n  - **Let him clock out.** He leaves and doesn't come back. A Network notice reads: *\"Employee reassigned.\"*\n  - **Tear up his card.** He's free and terrified, and he becomes an ally on later floors who knows the old routes.\n  - **Leave it.** He keeps mopping. He's the only character on the floor who's always there for you.\n\n**The first real dungeon rule:** the dungeon doesn't simply kill people. It assigns them functions, such as worker, monster, merchant, boss or custodian.\n\n### Side arcs\n\n- **Coin Jar Raid** (Spin Cycle) and **the Machine That Ate Dave.** The coin jars lead you to the vending machine that ate Dave. Nobody's worried, because Dave has been eaten before. Defeat it and Dave climbs out, alive, more or less. \"Oh. You're new.\" Then: \"Don't trust the dryers.\"\n- **The Lint King.** The lint traps are an ecosystem: lint is insulation, crafting material, monster nests, fire starters and a magical ingredient. The Lint King believes it's all his. You can kill him, bargain, steal it, or help clean the machines, which earns a steady lint supply and a truce.\n- **The drying yards.** Shapes behind the sheets. Most are just laundry, and some aren't.\n\n### Mechanism: the Great Dryer\n\nThe Great Dryer is enormous, and nobody knows what it does. It has 18 settings, 18 symbols, 18 temperature controls and a timer counting backward from an unknown number. Laundry across the floor carries symbols; collecting it lets you rebuild the sequence. The dryer isn't for clothes. It's a transport system between floors. Put something in, and the screen reads **DESTINATION: FLOOR 18**, then **ERROR: FLOOR 18 DOES NOT EXIST.** The Host cuts in, \"Oops! Let's not play with the old machinery, contestants,\" and shuts it down. It's the first time he seems uncomfortable. (Later in the game, the dryer becomes a shortcut that sends items between floors.)\n\n### Boss: Head Custodian Ebb\n\nEbb is a broken employee, still doing his job. Contestants are spills, monsters are messes. \"You are tracking mud on my floor.\" Then: \"Shift change, wights!\" and dead custodians answer.\n\n- **Kill him.** The doors open, and the Mop Wights keep cleaning without him, more aggressively.\n- **Bargain.** Clock him out. He leaves his post, and the floor stops processing new arrivals for a while.\n- **The truth** (needs Reggie's arc). Show him Reggie's card. Ebb realises he was a contestant once too, and gives you his keyring, which opens old service doors on later floors.\n\n### Ending\n\nBefore descending, you find an old employee badge carrying the symbol from the Floor 1 ticket machine. The floors are connected. There's one system underneath everything.\n\n## Floor 3: The Soup District (choose)\n\n**Feel:** The first real civilisation: markets, music, children, street performers. Finally, a place to live, until the Dinner Bell.\n\n| Layer | On this floor |\n|---|---|\n| Survival | The Dinner Bell. Every night everyone must eat. Refuse and you sicken; eat the wrong soup and you change. Soup has real effects, some good. |\n| Civilisation | Soup Row; Wickley; Brother Ash; the Guild Hall (Archmage Pell, Foreman Gruss, Supervisor Mox, Matron Hale); Judge Vrask; Registrar Odessa. |\n| Mystery | Grandma Gristle's and Auntie Brine's soups come from one ancient recipe, and the Scratch Marks are a map. |\n| Mechanism | The First Broth: rebuilding a recipe from tablets found across the district. Also the Hall of Callings' old machines. |\n| Boss | The Cone King, keeper of the Cone Cathedral and the machinery under it. |\n\n### Arrival\n\nSoup Row is full of contestants having fun. Someone mentions, \"Dinner Bell's in twenty minutes.\" You ask what that is, and everyone goes quiet. **The Dinner Bell** is the floor's recurring system: soup buffs and changes you, and you learn which soups to trust.\n\n### The Hall of Callings (race and calling)\n\nThe biggest moment of Act One. Registrar Odessa explains that every contestant who reaches Floor 3 chooses a race and a calling. \"Why Floor 3?\" \"Because that's when the dungeon decides you're worth investing in.\"\n\n- **Choosing a race** is a story event: the old machines wake and show possible versions of you. The Host cuts in, \"Choose carefully!\", and Odessa goes pale: \"He shouldn't be able to see this room.\" Avatar customisation happens here as well as at the start.\n- **Choosing a calling** is a trial, done through *Guild Trial I–III* (kept). Each class is tested by doing what it does:\n  - Pyromancer: keep a flame alive while monsters try to put it out.\n  - Warrior: protect someone for a few minutes.\n  - Rogue: steal something unseen.\n  - Mage: solve a magical puzzle.\n  - Healer: keep several people alive.\n\n### Main arcs\n\n- **Soup Feud** (Wickley). Grandma Gristle's soup has bones, memories and old magic; Auntie Brine's has salt, magic and something newer. Taste both. Then the twist: both come from one ancient recipe that has gone wrong. Recipe tablets around the district carry an ingredient, a temperature, a cooking time and a symbol. Rebuild **the First Broth**, and you learn it was never food. It was used to make life.\n- **Lights Out** and **The Last Light** (Brother Ash). The moths aren't attacking. They're starving for light, because the Lamp Market is going dark. Kill the Bulb Queen, feed her, or find out why she's starving: the dungeon's light system is failing floor by floor. That's the best route, and a thread for later floors.\n- **Five Stars** (Judge Vrask). Vrask judges the district's food and keeps the peace with taste. Earning five stars opens his support in the Cone King's ending.\n- **Old Man Coo.** He saw contestants go sideways, not down. The Stack used to have routes between floors, and the Network sealed them.\n- **The Scratch Marks.** The marks from Floors 1, 2 and 3 fit together into a map of the whole Stack. The dungeon was built as one machine.\n\n### Grandma Gristle\n\nThe first boss the player should question killing. She knows about the First Broth and what the scratches mean, and she refuses to say, because she's protecting something.\n\n- **Kill her.** You get her loot and the fans, but the secret dies with her.\n- **Investigate her kitchen.** You find a cookbook older than this season, with a recipe titled **CONTESTANT**. This is the floor's big horror reveal.\n\n### Boss: the Cone King (*Long Live the Cone*)\n\nHe knows Pylon, the Undercroft and the old system. He smells your equipment: \"You have been down below. The old things smell different.\" Pylon wasn't the first Sergeant; there have been hundreds, one every season, and the dungeon replaces them. The Cone Cathedral is built of traffic cones, and under it is ancient machinery. He isn't worshipping cones. He's guarding the machine, and the cones are seals.\n\n- **Kill him.** The seals break and the stairs open, and something changes back on Floor 1.\n- **Bargain.** He gives you the key if you promise to keep the seals intact.\n- **The truth** (needs enough Floor 1–3 knowledge and allies). Convince him the Network is manipulating everyone, and he gives you an **Ancient Token**, which lets you use old dungeon machinery on later floors.\n\n### The Act One ending (first big cutscene)\n\nYou walk towards the stairs. The Host appears to applause and confetti: \"THREE FLOORS!\" Then he stops, looks straight at you, and his smile shrinks a little. \"You're asking questions.\" The screen glitches, and for half a second there's a different face. Then he's back. \"Don't.\" Cut to black.\n\n**What the player now knows:** the dungeon is ancient, the Network didn't build all of it, past contestants have been here for decades, people get absorbed into the dungeon, the floors are connected, the Host doesn't control everything and is afraid of something, the player is being watched and judged, and there are ways through besides killing.\n\n**What they still don't know:** who built it, what Floor 18 is, why Earth was taken, why the Network needs contestants, where the earlier contestants went, and whether anyone wants them to reach the bottom.\n\n---\n\n## Act Two: Floors 4–6, the show (sold)\n\nThe player starts working the system. The question changes from \"what is this?\" to \"who profits?\"\n\n### Floor 4: The Endless Mall (sponsorship)\n\n| Layer | On this floor |\n|---|---|\n| Survival | Food courts serve endless free food, which is addictive and slowly changes you. Real food has to be bought. |\n| Civilisation | The Food Court Free State; Clearance Carl, Cinnamon Sue, Lost Receipts; Mattress Mo's inn; Sunny the Sponsor Rep. |\n| Mystery | The mall's \"veins\" all lead to the Atrium, and the Mall Mother is alive. |\n| Mechanism | Sponsorship. Sponsors give you power with conditions attached (\"wear our logo\", \"kill three on camera\"). |\n| Boss | The Mall Mother, the heart that keeps the mall alive. |\n\n- **Quests:** *Sponsored Content* (Sunny, main) and *Lost Child Announcement* (Madame Prickle).\n- **The story:** Sunny signs you to a sponsor. Sponsorship is the fan system made physical: power now, with conditions you discover later. Timmy, the lost child, is real and hiding in the Changing Rooms. He's one of the few children who survived this long, and the mall is trying to keep him. The dummies are past shoppers.\n- **The boss:** the Mall Mother is a colossal heart fused with the mall, calm and motherly. She keeps everyone fed, safe and still. **Kill** her and the mall dies around you. **Bargain** to let people leave. **The truth:** she was the mall's first contestant, and she's keeping them from going deeper because she knows what's below.\n\n### Floor 5: Suburbia Infinite (conformity)\n\n| Layer | On this floor |\n|---|---|\n| Survival | The HOA fines you for anything and everything. Unpaid fines become monsters. |\n| Civilisation | Fort Cul-de-Sac; Big Deb; Yard Sale Yolanda, Lemonade Lee, Curbside Cal, Mrs Doily; the Neighbourhood Watch. |\n| Mystery | The same family waves from every yard, and the houses further out have gone wrong. |\n| Mechanism | The HOA rulebook. Rules can be learned, exploited and rewritten through the town council. |\n| Boss | The HOA President; Mayor Eternal at Town Hall. |\n\n- **Quests:** *Notice of Violation* (Big Deb, main) and *Good Boy* (the Watch: Mr. Fetch was somebody's dog once).\n- **The story:** Suburbia is the Stack's idea of a perfect society, with everyone in their function. The Hendersons are what happens to contestants who settle down. Mr. Fetch's collar has a name tag from Earth.\n- **The boss:** the HOA President. **Kill** her: the fines vanish and the gnomes revolt. **Bargain:** a seat on the council. **The truth:** Mayor Eternal has been re-elected every season since the Stack began. He's a Builder relic and the first character who knows who the Builders were. He won't say, but he recognises the Ancient Token.\n\n### Floor 6: The Canopy (the hunted)\n\n| Layer | On this floor |\n|---|---|\n| Survival | The dark forest; you are prey; you must hide your scent. |\n| Civilisation | The Treehouse; Gusset; Elder Lantern and the Mothwing; Bark & Blade, Forager Fern, Twig; Old Bramble's inn. |\n| Mystery | The roots at the Tallest Tree go somewhere that isn't down. |\n| Mechanism | The hunt. The Glimmerkin run paid safaris for audience members, and you learn to turn the hunt around. |\n| Boss | Lord-Hunter Facet at the Safari Lodge. |\n\n- **Quests:** *Hunting Season* (Gusset, main), *Lodge Fire* (Gusset, main) and *The Roots of Things* (Elder Lantern, arc).\n- **The story:** the hunters are audience members, paying to come down and kill contestants. The audience is real, physical and here. *The Roots of Things* reveals that the Tallest Tree's roots are a sealed sideways route: the first one the player can actually open, with Pickles' cone key or the Ancient Token.\n- **The boss:** Lord-Hunter Facet. **Kill** him: the hunts stop, and the Network sends harder hunters later. **Bargain:** become a hunter guide; you earn fans and lose allies. **The truth:** the lodge's records show the audience is paying in attention, and attention is what's spent below. This is the first hint that fans are fuel.\n\n## Act Three: Floors 7–9, the Undercity (the survivors)\n\nA whole civilisation built from survivors of past seasons. The Undercity knows much of the truth, and has made its peace with it.\n\n### Floor 7: The Drowned Cistern (debt)\n\n| Layer | On this floor |\n|---|---|\n| Survival | The flood. Water level rises and falls on a timer: a timed map event. |\n| Civilisation | Gangway; Nan Gangway's ferry; tenants and the Landlord. |\n| Mystery | Everyone here owes rent, and nobody remembers borrowing anything. |\n| Mechanism | The sluices and the chain ferry, used to control the water level and open drowned districts. |\n| Boss | The Sanitation King on the Landfill Barge; the Landlord and Old Lady Bathwater on the way. |\n\n- **The story:** debt is how the Undercity keeps survivors in their functions. Nan Gangway ferries people across for free and has done so for three seasons.\n\n### Floor 8: The Workings (labour)\n\n| Layer | On this floor |\n|---|---|\n| Survival | Heat, air and exhaustion. Rest is rationed. |\n| Civilisation | Shaft Town; Foreman Tuck; the mole-kin; the Collectors. |\n| Mystery | Eleven miners went down and twelve came up. |\n| Mechanism | The drill and the mine carts, used to dig your own route through. |\n| Boss | Big Momma Mold in the Nursery; on the way, Chief Grubtooth, the Drill Prophet, the Fryer Baron and Repossessor Mk. IX. |\n\n- **The story:** the Workings is where the Stack's machinery is maintained. The miners are digging towards the Builders' level, and Big Momma Mold tells everyone they've done enough. She's keeping them from finding it.\n\n### Floor 9: The Undercity (power)\n\n| Layer | On this floor |\n|---|---|\n| Survival | The election. Everyone must vote, and the losing side is \"redistributed\". |\n| Civilisation | Verdigris Square; the Rat Senate; Sister Verdigris; the city's old families from past seasons. |\n| Mystery | The Undermayor has never been elected, and the Founders Lantern burns something alive. |\n| Mechanism | The vote, which can be rigged, campaigned or overturned. |\n| Boss | The Undermayor at City Hall; the Rat Throne King, Lockjaw and the Soloist on the way. |\n\n- **The story:** the Undercity's founders were past contestants who chose to stop going down. The Undermayor runs the city for the Network. **The truth** ending opens the sealed Metro, the sideways route towards the deep floors, and turns the Undercity into an ally for Acts Four and Five.\n\n## Acts Four and Five: Floors 10–18 (sketch)\n\n- **Floors 10–12, the Spectacle.** The arenas and studios where the show is made. The player becomes famous. The mystery is how the broadcast actually works.\n- **Floors 13–15, the Deep Archive.** The Builders' records. The player learns what the Stack was for, and that fans are fuel.\n- **Floors 16–18, the Network Core.** The Network's control floors, and the Host's past. Then the floor that \"does not exist\": the Builders' control room, and the ending choice.\n\n## Quest map (every existing quest kept)\n\n| Quest | Giver | Floor | Arc |\n|---|---|---|---|\n| Orientation, Contestant Basics, Cardboard Combat, Going Down | Pip | 0 | Tutorial |\n| Welcome to the Dungeon | Marta | 1 | Main: \"Welcome to the Dungeon\" |\n| Nobody Gets Out | Marta | 1 | Main; leads to the ticket machine |\n| Find the Leak | Marta | 1 | Main; leads to the goblins |\n| The Chained Stairwell | Marta | 1 | Main; the Pylon question |\n| Thin the Packs | Marta | 1 | Goblin side arc with three outcomes |\n| Cone Collector, Cone Coup | Pickles | 1 | Pickles' arc (cone seals) |\n| Bo's Toolbox | Bo | 1 | The moving vending machine |\n| Coin Jar Raid | Spin Cycle | 2 | Dave |\n| Clocking Out, End of Shift | Reggie | 2 | Main: Reggie |\n| Soup Feud | Wickley | 3 | Main: the First Broth |\n| Long Live the Cone | Wickley | 3 | Boss: the Cone King |\n| Lights Out, The Last Light | Brother Ash | 3 | The failing lights |\n| Five Stars | Judge Vrask | 3 | Vrask's support |\n| Guild Trial I–III | Guild Hall | 3 | Calling trials |\n| Sponsored Content | Sunny | 4 | Main: sponsorship |\n| Lost Child Announcement | Madame Prickle | 4 | Timmy |\n| Notice of Violation | Big Deb | 5 | Main: the HOA |\n| Good Boy | The Watch | 5 | Mr. Fetch |\n| Hunting Season, Lodge Fire | Gusset | 6 | Main: the hunt |\n| The Roots of Things | Elder Lantern | 6 | The first sideways route |\n\n**New quests these arcs need:** the ticket machine (1), the camp side quests at the Pigeon Loft, Lightwell, Flooded Bay and Lost Property Office (1), the Lint King (2), the Great Dryer (2), the Hall of Callings story event (3), the Scratch Marks map (3), Old Man Coo (3), Grandma's kitchen (3), plus the Floor 4–9 arcs above.\n\n## What this needs from the game\n\n- **Systems:** a quest choice and outcome system; boss ending choices; world state that carries between floors (a broken seal on Floor 1 changes Floor 1 later); knowledge and relationship tracking; floor completion conditions; Network notices; the Dinner Bell and other timed floor events; puzzle machines.\n- **Cutscenes:** the new intro (a playable wake-up, then the run to the stairwell, confused); the Floor 1 reveal; the Act One ending; and one per act.\n- **Voice:** the Host, Marta, Pip and the Network announcer first. ElevenLabs would suit these.\n"}, {"id": "world", "name": "World", "path": "art/WORLD.md", "md": "# Downstairs: the world\n\nThis document holds everything around the main storyline (`STORY.md`):\n\n- the gods and their temples\n- the factions and their armies\n- the other contestants\n- the hidden clubs\n- Floors 10 to 18\n\nIt's all original to Downstairs and grows out of things already in the game: the Builders, the Network, fans as fuel, the cone seals, and the monster camps.\n\n---\n\n## 1. The gods\n\n### What a god is down here\n\nThe Stack is older than the Network. The things the Builders sealed into it (one under every floor) were never gods to begin with. They were **appetites**: hunger, fear of being forgotten, the urge to count, the urge to be watched. Attention feeds them. When the Network started broadcasting from the Stack, the appetites started getting fed, and they woke up. They gave themselves names and faces from the shows they'd overheard. Now they compete for the same thing the Network does: **your attention, and your fans'**.\n\nThe Network tolerates them because gods are great television.\n\n**For writers:** the gods are real, they're powerful, and their gifts work. Every one of them is also a hunger that would eat the world if let out. A good ending needs some of them on your side anyway.\n\n### The pantheon (eleven, plus one nobody names)\n\n| God | Domain | Looks like | Wants | Rival of | Temple floor |\n|---|---|---|---|---|---|\n| **Saint Tally** | Counting, debts, keeping score | A ledger-bodied figure with abacus-bead eyes; every surface covered in tally marks | Everything owed paid, everything counted | The Mother of Static | 7 (the Cistern counting-house) |\n| **Old Damp** | Water, leaks, what's left behind | A bloated, kindly old man made of wet newspaper, dripping | To be remembered; to fill every low place | Lady Lumen | 7 (the Drowned Chapel) |\n| **The Hollow Chef** | Hunger, feeding, being fed | A towering cook with an empty pot for a head | That nobody ever leaves the table | The Good Neighbour | 8 (the Fryer Shrine) |\n| **Mother Mould** | Growth, rot, rest, comfort | A soft grey-green matron, warm as bread dough | That everyone lies down and rests, forever | The Rustwright | 8 (the Nursery Altar) |\n| **The Rustwright** | Machines, labour, repair | A soot-black smith with a drill for one hand and a clock in his chest | Work never stops; everything kept running | Mother Mould | 8 (the Pithead Forge) |\n| **The Good Neighbour** | Belonging, conformity, rules | A smiling face on a white picket fence that follows you | Everyone the same, everyone happy, everyone home | The Hollow Chef | 9 (the Civic Chapel) |\n| **Lady Lumen** | Light, warmth, being seen | A tall moth-winged woman of soft lamplight | To be the brightest thing in every room | Old Damp | 9 (the Lamp Cathedral) |\n| **The Antlered Viewer** | The hunt, spectacle, the chase | A stag-headed figure with a camera for an eye | Everyone running, everyone hunted, all on camera | Saint Tally | 10 (the Stadium Chapel) |\n| **Encore** | Fame, applause, being loved | A shimmering figure made of spotlights and teeth | Applause, forever; one star at a time | The Index | 11 (the Spotlight Temple) |\n| **The Index** | Memory, records, the past | A librarian made of card-catalogue drawers, always filing | Nothing forgotten; everything kept | Encore | 13 (the Reading Room Sanctum) |\n| **The Mother of Static** | The signal, the broadcast | A shape seen only on screens between channels | The broadcast never ends | Saint Tally | 16 (the Transmitter Chancel) |\n| *(the one nobody names)* | The Absence: what the Builders were | Nothing. An empty plinth in every temple. | Unknown. It answers on Floor 18. | Everyone | 18 |\n\n### Foreshadowing before Floor 7\n\nFrom Floor 1 the player keeps finding small things that are these gods' early marks:\n\n- Pylon's cone seals hold down a small piece of Saint Tally: the knocking that counts.\n- The Lightwell moths keep Lady Lumen's old lamps.\n- Grandma Gristle is a lapsed priestess of the Hollow Chef.\n- The HOA prays to the Good Neighbour without knowing it.\n\n**Shrines** (small, unattended, no worship) appear from Floor 2. Each one gives a line of lore and a one-off minor blessing.\n\n### Temples and worship (Floor 7 onward)\n\n- **Temples** are big set pieces: a priest NPC, an altar, an offering box and the god's statue. Temples on later floors keep a smaller \"chapel\" for every god met so far, so lapsed patrons can still be visited.\n- **Choosing a patron:** after Floor 6 the player can swear to one god at its temple. They can switch at any later temple, but the old god's favour drops to zero and it sends a **Grudge**: a hunter party, a curse, or a ruined shop deal.\n- **Favour (0–100)** rises through:\n  - offerings (items the god likes)\n  - acting in its domain (Tally: pay every debt, finish every count quest; Damp: rescue the drowned; Encore: get big fan spikes)\n  - its **Rites**: a quest chain of 3–5 tasks per god\n- **Boons at 25 / 50 / 75 / 100 favour:**\n  - a passive blessing, e.g. Old Damp: you can breathe underwater and drowned enemies hesitate\n  - an active **Miracle** on a long cooldown, e.g. Encore: \"Standing Ovation\", every fan watching heals you\n  - a unique cosmetic for transmog\n  - a god-only crafting recipe\n- **Tithes:** each god takes a cut of something: a share of gold, fans, XP, or your sleep (Mother Mould). Patrons are never free.\n- **Gods interfere:** rival gods' priests refuse to trade with you, their followers' camps get angrier, and at **Ratings Week** (below) your patron may intervene on your side, or ask a terrible favour.\n- **Atheists** get no boons, but they get the **Unwatched** perk: gods can't see them, so god Grudges and curses can't find them. The hidden clubs like that.\n\n---\n\n## 2. The factions and their armies\n\nEvery monster camp belongs to a **faction**, and factions want things. They raid each other, take territory, make truces and remember what you did. The boss of each camp is a commander; its army is that faction's units.\n\n### Unit tiers (how every army is built)\n\n| Tier | Role | Example (Cone Horde) |\n|---|---|---|\n| Rabble | Cheap, numerous, scatter when the leader falls | Traffic-Cone Goblin |\n| Skirmisher | Ranged or fast | Cone Chucker |\n| Soldier | Tough front line | Cone Captain |\n| Specialist | Odd ability: healer, summoner, trapper | Cone Priest *(new)* |\n| Champion | Camp sub-boss | Sergeant Pylon |\n| Warlord | Faction leader, floor or act boss | The Cone King |\n\n### The monster factions\n\n| Faction | Floors | Warlord | Wants | Army (rabble → champion) | Patron god | At war with |\n|---|---|---|---|---|---|---|\n| **The Cone Horde** | 1–3, raids later | The Cone King | To seal everything and charge a toll for it | Goblin, Chucker, Captain, *Cone Priest*, Pylon | Saint Tally (unknowingly) | The Roost, the Moth Court |\n| **The Moth Court** | 1–3 | The Bulb Queen | Light, any light, all of it | Moth, *Wick Page*, Moth Matron | Lady Lumen | The Cone Horde, the Drowned Tenancy |\n| **The Roost** | 1, 3 | Old Man Coo | The high places, and everything dropped from them | Pigeon Ghoul, Pigeon Elder | none (scavengers) | The Cone Horde |\n| **The Custodians' Union** | 2, 8 | Head Custodian Ebb | That the shift is finished, finally | Mop Wight, *Bucket Brute*, Lint King | The Rustwright | The Lint, the Mimics |\n| **The Vending Collective** | 1–2, 4 | The Machine That Ate Dave | To consume, dispense, consume | Vending Mimic, *Change Imp*, Lost & Found | The Hollow Chef | The Custodians' Union |\n| **The Kitchens** | 3, 6 | Grandma Gristle | To feed you; to finish you | Gutter Hag, *Ladle Boy*, Auntie Sludge | The Hollow Chef | The Moth Court |\n| **Mall Security** | 4 | Captain Kevlar, under Mall Mother | Order, loss prevention, you in a cell | Mall-Cop Ogre, *Taser Kid*, Coupon Leech | The Good Neighbour | The Food Court |\n| **The Food Court** | 4 | The Food Court Kraken | Growth; the mall's appetite | Bounce-House Slime, Birthday Blob | The Hollow Chef | Mall Security |\n| **The HOA** | 5 | The HOA President | Everyone compliant and smiling | Lawn Gnome, Cul-de-Sac Hound, Gnome Pope, Mayor Eternal | The Good Neighbour | The Kennels |\n| **The Glimmerkin Safari** | 6 | Lord-Hunter Facet | The perfect trophy: you | Tourist Hunter, *Beater*, Hornback | The Antlered Viewer | The Kennels, the Hollows |\n| **The Drowned Tenancy** | 7 | The Landlord | Rent, from everyone, forever | Sewer Wyrm, Debt Collector, Old Lady Bathwater | Saint Tally | The Sanitation Guild |\n| **The Sanitation Guild** | 7 | The Sanitation King | Everything washed away | Wyrm, *Sluice Boy*, Pipe Organ Wyrm | Old Damp | The Drowned Tenancy |\n| **The Deep Shift** | 8 | Drill Prophet | To dig to the bottom of the Stack | Mole-Kin, Grease Golem, Chief Grubtooth, Fryer Baron | The Rustwright | The Nursery |\n| **The Nursery** | 8–9 | Big Momma Mold | Everyone asleep in her | Fungal Choir, The Soloist | Mother Mould | The Deep Shift |\n| **The Rat Senate** | 9 | The Undermayor | Power, re-election, ownership of the vote | Ratking Choir, Lockjaw, Rat Throne King | The Good Neighbour | Everyone, politely |\n| **The Crew** (the show's own staff) | 10–12 | The Showrunner | Content, ratings, renewal | Stagehand, Boom Gremlin, Extra, Floor Manager | Encore | The Archive |\n| **The Archive** | 13–15 | The Archivist | Nothing deleted, ever | Bookwyrm, Shusher, Paper Golem, the Restless, Hollow Guard, the Count | The Index | The Crew |\n| **The Network** | 16–18 | The Director, above him the Host | The broadcast never ends | Censor Bar, Ratings Ghoul, Static Man, Warden | The Mother of Static | Everyone else |\n\n*(New units in italics are listed for Tripo in `TRIPO_CAST_3.md`.)*\n\n### How factions use their armies\n\n- **Raids:** every in-game day or so, a faction sends a raid party from its camp toward a rival's outposts or a town gate. Raid parties walk the map in formation (rabble in front, specialist in the middle, champion behind). You can watch, join one side, or rob both. This is the \"stuff happening on the map at certain frequencies\" from the design notes.\n- **Territory:** outposts change hands. Kill a faction's champion and its rival takes the nearby outposts: the camp banners and units swap. Factions holding more territory field bigger raids.\n- **Reputation (−100 to +100)** per faction:\n  - **Hated:** they hunt you, and bounty parties appear.\n  - **Neutral:** the default.\n  - **Truced:** they won't attack first; Pylon's truce is the first of these.\n  - **Allied:** you can trade at their camp, hire a unit as a follower, and they fight beside you in raids.\n- **Ratings Week** (once per floor, after its main arc): the Network forces open war between that floor's factions for ratings. Every camp fields a full army, the map turns into a battlefield for a set time, and it ends in a big fight between the two leading factions. Your reputation decides which side counts you as theirs. Fans pour in, and so do the gods.\n\n---\n\n## 3. The other contestants\n\nYou're not the only one. Every stairwell on Earth emptied into the Stack, so every floor has **other contestants**: rivals, allies, victims and future bosses.\n\n### How they work in the game\n\n- **Named rivals (16)** have personalities, races and callings, and appear floor after floor. Their fan counts are on a **Leaderboard** that the Network shows between floors.\n- **Generic contestants** (dozens per floor, built from the race models plus a random calling) wander, fight camps, loot and die. You'll find their bodies.\n- **Parties:** up to three companions. Recruit a named rival who likes you, or hire a generic one at a town. Companions fight beside you (light AI using the same Mob system, on your side), level with you, comment on things, and can die for good. Each named one has a **loyalty** value: give them loot, back their choices and they stay. Betray them and they remember.\n- **Crews:** named rivals form crews (contestant factions) with their own goals, and they compete with you for the same boss kills and boxes.\n\n### The named rivals\n\n| Name | Race / calling | Personality | Arc |\n|---|---|---|---|\n| **Dex Okafor** | human, spellsword | Cocky ex-gym teacher, plays to the camera | Your first rival on Floor 1; by Floor 10 a Network golden boy; on Floor 16 he finds out what fans are and has to choose |\n| **Nell Brightwater** | bogling, tidecaller | Gentle, keeps a list of everyone she's buried | Your easiest friend; becomes Old Damp's high priestess on Floor 7 |\n| **Tomasz \"Tank\" Wiśniewski** | ogrekin, demolitions | Huge, soft-spoken, terrified of heights | A loyal companion if you help him on the Floor 6 rope bridges |\n| **Priya Raman** | human, paramedic | Furious, practical, saves everyone, trusts no one | Runs the Stairwell Clinic crew; she's the one who finds the bracelets |\n| **Jojo Spark** | fennix, stormcaller | A streamer before all this; lives for fans | Encore's darling; becomes the Floor 11 Halftime Show boss if not saved |\n| **Brother Kettle** | stoneblood, bonecaller | A monk who was already living underground | Knows the Builders' symbol; a guide through the Archive |\n| **The Vasquez Twins** | human, repo agent and exterminator | Bickering sisters who loot everything first | Leaders of the Scavengers crew; steal your kills, save your life once |\n| **Grandpa Mo** | gutterkin, plumber | 84 and having the time of his life | Hidden-club regular; vouches for you at the Back Door |\n| **Ivy Marsh** | lumen, lightbringer | Zealot of Lady Lumen | Leads the Lamplighters crew against the Moth Court, then against you if you choose Damp |\n| **Kofi Mensah** | human, dentist | Calm, dry humour, very good with pliers | A trading partner; runs the only honest pawn shop |\n| **Rattle** | clanker, nightsecurity | A robot who doesn't remember being human | Discovers on Floor 15 that it was a contestant from a past season |\n| **Big Sal** | grimhide, mallsanta | Jolly, lethal, sells gifts and grenades | A Floor 4 vendor who turns up on every floor after |\n| **Ming Zhao** | human, chronomancer | Speedrunner; trying to reach Floor 18 first | Always ahead of you; the first to reach the floor that doesn't exist |\n| **Ada Lockwood** | lumen, hexwright | Ex-lawyer; reads every contract | Finds the loophole in the Network's terms; key to one ending |\n| **Pocket** | quillback, sporesage | Tiny, cheerful, half-eaten by Mother Mould | Saved or lost on Floor 8; if saved, a mushroom healer |\n| **The Previous Winner** | ??? | Seen only on old footage | Is the Host. Revealed on Floor 17. |\n\n### Contestant crews\n\n| Crew | Leader | Goal | Stance |\n|---|---|---|---|\n| **The Stairwell Clinic** | Priya | Keep people alive | Friendly; will heal you |\n| **The Scavengers** | the Vasquez Twins | Loot first, ask never | Unreliable |\n| **The Lamplighters** | Ivy Marsh | Burn out the dark | Zealous |\n| **Team Dex** | Dex | Fans, fame, renewal | Rival |\n| **The Speedrun** | Ming | Get to the bottom | Ignores you unless you're in the way |\n\n---\n\n## 4. The hidden clubs (on every floor)\n\nThe Network sees almost everything. Almost. On every floor there's a place the cameras can't reach: a **club** behind a door that isn't on any map. It started as a maintenance cupboard the Builders forgot. Now it's a bar, a black market and a sanctuary, run by people who stopped going down.\n\n### Three tiers, earned one at a time\n\n**1. The Back Door** (from Floor 2)\n\n- **What it is:** a dive bar and black market. A different hidden entrance on every floor: a freezer in Soup Row, a changing-room mirror in the Mall, a dog flap in Suburbia.\n- **What's inside:**\n  - **Mags**, the bartender, an ex-contestant who stopped on Floor 2 forty years ago\n  - **the Fence:** sells contraband, buys anything, no Network tax\n  - a **rumour board**: tips on hidden rooms, boss weaknesses and where rivals are\n  - a **jukebox** (music and lore tapes)\n  - **safe sleeping**: no camera, so no fan loss for resting\n- **How you get in:** find the door (a hidden area, never marked), know the floor's **password** (from a lore note, a drowned contestant's bracelet, or a quest NPC who trusts you), and get **vouched for** once (Grandpa Mo or a Mags quest). After that the Back Door on every later floor knows you, but you still have to find it.\n\n**2. The Lock-In** (from Floor 6)\n\n- **What it is:** after hours in the Back Door, behind the cold-room door. A VIP lounge.\n- **What's inside:**\n  - a **gambling den**: cards, dice, and betting on fights between captured monsters\n  - **contraband boxes**: off-Network loot boxes, unsponsored and sometimes cursed\n  - a **bounty board**: kill named targets, including rival contestants\n  - a **forger**, who changes your race once outside Floor 3 or scrubs your faction reputation (for a price)\n  - **smugglers**, who sell routes: shortcuts between floors' hidden areas\n- **How you get in:** earn **Marks**, the club's reputation. Marks come from:\n  - errands for Mags (smuggling, delivering messages to other floors' Back Doors)\n  - kills done **off-camera**: out of sight of every Network camera pole, a new mechanic that makes the camera poles matter\n  - keeping your **fan count under a ceiling**, because the club doesn't trust Network darlings\n\n  20 Marks earns the Lock-In key. Fans and Marks pull against each other, and you choose which you'd rather have.\n\n**3. The Off-Air Room** (from Floor 10)\n\n- **What it is:** the club's founders' room, behind the Lock-In's walk-in safe. No music, one table, a window onto a part of the Stack nobody has a camera in.\n- **What's inside:**\n  - the **Off-Air Society**: ex-contestants, a defected stagehand, Brother Kettle, and on Floor 16 a Network engineer\n  - the true story of the Network\n  - the **Builders' maps**\n  - the **sabotage** questline that leads to one of the endings\n- **How you get in:** 60 Marks, plus a Mags quest on Floor 9 (get her old crew out of the Undermayor's vault), plus **no god as patron**, or a patron who has turned on the Network (Old Damp after his Rites, or the Index).\n\n### On every floor\n\n| Floor | Back Door entrance | Password from | Special |\n|---|---|---|---|\n| 2 | A dryer that doesn't spin | Old Reggie's timecard | Mags' first bar |\n| 3 | A walk-in freezer behind a soup stall | Wickley, if you finish Soup Feud | The Fence's hot-soup black market |\n| 4 | The back of a changing-room mirror | The Lost Child (Timmy) | Smuggled sponsor gear |\n| 5 | The dog flap of a house that's always dark | Mr. Fetch's collar | Forged HOA permits |\n| 6 | Inside a hollow giant trunk | A hunter's licence | The Lock-In opens |\n| 7 | A sunken telephone box | The drowned bracelet's last message | Floating bar |\n| 8 | A disused lift cage at the bottom of Shaft 0 | Canary's song | Mags' smuggling route hub |\n| 9 | A ballot box big enough to climb into | The Returning Officer's tally | Vault-heist questline |\n| 10–18 | Set dressing, a vending machine, a library return slot, a dead satellite dish, the Host's childhood wardrobe | Varies | The Off-Air Room from 10 |\n\n---\n\n## 5. Floors 10 to 18\n\nThere are three acts from here. The floors get bigger (1,650 m on Floor 10, up to 2,050 m on Floor 18), stranger, and more tied to the gods, the factions and the truth.\n\n### Act Four: the Spectacle (Floors 10–12)\n*Where the show is made. You're famous now, and it's worse.*\n\n**Floor 10: The Backlot**\n- **Feel:** a studio backlot that goes on forever. Fake towns that are only fronts (a western street, a moon base, a Victorian alley), giant sound stages, catering tents, bleachers full of an audience that never moves.\n- **Hub:** Craft Services, a catering-tent town.\n- **Villages:** Wardrobe Row, the Props Warehouse, Extras' Holding, the Car Park.\n- **Camps:**\n  - Sound Stage 4 (the Floor Manager and Stagehands)\n  - the Western Set (the Stunt Double and Extras)\n  - Makeup Trailers (the Makeup Witch and Boom Gremlins)\n  - Catering (the Craft Services Glutton)\n  - the Water Tank (the Showrunner and the Crew; floor boss)\n- **Landmarks:** the Giant Clapperboard, the Fake Moon, the Audience Bleachers.\n- **Temple:** the Antlered Viewer's Stadium Chapel, inside a camera crane.\n- **Back Door:** behind a fake saloon front that is, for once, real.\n- **Story:** your first season \"episode\" is filmed on you; Dex is filming his.\n\n**Floor 11: The Arena**\n- **Feel:** a stadium city: a colosseum the size of a district, concourses, fan zones, locker rooms, burger stands, mascots.\n- **Hub:** the Concourse.\n- **Villages:** the Away End, the Car Wash, the Sports Bar, the Ticket Office.\n- **Camps:**\n  - the Mascot Pen (the Big Foam Finger and Mascots)\n  - the Ultras' End (the Capo and Ultras)\n  - the Cheer Pyramid (the Head Cheerleader and the Cheer Squad)\n  - the Officials' Room (the Ref)\n  - the Centre Circle (the Champion; floor boss)\n- **Landmarks:** the Jumbotron, the Trophy Cabinet, the Halftime Stage.\n- **Temple:** Encore's Spotlight Temple.\n- **Story:**\n  - Ratings Week is a literal tournament.\n  - The Champion is last season's winner. He's being kept alive as a boss.\n  - Jojo is the Halftime Show.\n\n**Floor 12: The Green Room**\n- **Feel:** backstage forever. Corridors of dressing rooms with stars on the doors, a talk-show set, the Writers' Room, a canned-laughter factory, makeup mirrors with bulbs.\n- **Hub:** the Commissary.\n- **Villages:** Dressing Room Row, the Writers' Pit, the Loading Bay, Hair & Makeup.\n- **Camps:**\n  - the Laugh Track Factory (the Laugh Track and Laughers)\n  - the Paparazzi Pit (the Flash Mob)\n  - the Agency (Agent Twelve Percent and Autograph Hounds)\n  - the Talk Show (Jolly Jack Brightly)\n  - the Producers' Floor (the Producer; floor boss)\n- **Landmarks:** the Star Door Corridor, the Big Couch, the Applause Sign.\n- **Story:**\n  - You're booked on a talk show.\n  - The Producer offers you a contract to become a recurring character, which means staying.\n\n### Act Five: the Deep Archive (Floors 13–15)\n*Where the Builders kept their records. The show stops being the scariest thing.*\n\n**Floor 13: The Stacks**\n- **Feel:** a library the size of a country. Shelving canyons, card-catalogue towers, reading rooms, a returns chute.\n- **Hub:** Quiet Corner.\n- **Villages:** Periodicals, Large Print, Microfiche, Overdue.\n- **Camps:**\n  - the Reading Room (the Head Librarian and Shushers)\n  - the Returns Chute (Overdue)\n  - the Bindery (the Paper Golem Foreman)\n  - the Index Vault (the Index's Clerk)\n  - the Restricted Section (the Archivist; floor boss)\n- **Landmarks:** the Card Catalogue Spire, the Lost & Found of Books, the Endless Ladder.\n- **Temple:** the Index's Reading Room Sanctum.\n- **Story:** the Builders' first records, and a book with your name on the spine.\n\n**Floor 14: Castle Dread (the Archive's biggest exhibit)**\n- **Feel:** the Archive kept a whole season's set: *Season 9: Castle Dread*, the Network's horror season. It's an entire gothic castle in a dead, misty valley, still running its scares for an audience that died decades ago. This is the spookiest floor in the game.\n- **The castle:**\n  - curtain walls you can walk along the top of\n  - a gatehouse with a drawbridge over a black moat\n  - towers joined by rope and stone bridges\n  - a five-storey keep with a throne room at the top\n  - chapels and a great hall\n  - crypts and dungeons beneath (the cave system), with secret passages between them\n- **Outside the castle:** a dead village, a gallows hill, a graveyard of past contestants' headstones, a drowned mill and a witch's tower on a crag.\n- **Hub:** the Lych Gate Inn (a safe coaching inn outside the walls).\n- **Villages:** Ashen Hamlet, the Gibbet Crossroads, the Mill, Hollow Chapel.\n- **Camps:**\n  - the Graveyard (the Gravedigger and the Restless)\n  - the Witch's Tower (the Wax Witch and the Waxworks)\n  - the Gatehouse (the Portcullis Knight and the Hollow Guard)\n  - the Crypts (the Ossuary and the Bone Choir)\n  - the Keep (the Count of Season Nine; floor boss, an actor who never stopped playing the part)\n- **Landmarks:** the Drawbridge, the Gallows Hill, the Great Hall's Chandelier.\n- **Story:** in the castle's portrait gallery you find Marta's portrait. She played the maid in Season 9, years ago.\n\n## Spooky and multi-level floors\n\nHills give height. These floors get **storeys**: places built on top of each other, where you look up at danger and down at where you've been.\n\n| Floor | Built upward and downward | Spooky? |\n|---|---|---|\n| 7 Drowned Cistern | Tenement walkways above the water line, sunken streets below | Yes |\n| 8 Workings | Pit levels with lift cages, gantries over drop shafts | Moderately |\n| 9 Undercity | Metro below the boulevards, rooftops above | Moderately |\n| 10 Backlot | Fake fronts with scaffold walkways behind them, catwalks inside sound stages, a horror-movie set | Patches |\n| 12 Green Room | Stacked dressing-room galleries around an atrium | Unsettling |\n| 13 Stacks | Shelf canyons four levels deep, with rolling ladders and gantry bridges | Yes (silent, watched) |\n| 14 Castle Dread | Walls, towers, keep, bridges, crypts beneath | **The spookiest floor** |\n| 15 Cold Store | Server racks you climb, cooling-tower interiors | Cold dread |\n| 17 Host's House | The street above, the basement studio below, a mirror maze | Psychological |\n| 18 The floor that doesn't exist | Impossible stairs, levels that loop | Existential |\n\n**How they're built:** a reusable structure kit in code (walls with walkways on top, stair ramps, towers, bridges between towers, gatehouses, keeps of any number of storeys), plus the cave system for anything underneath. All of it gets real collision and works with the hills. The Tripo prop list adds the dressing: battlements, gargoyles, iron gates, coffins, candelabras.\n\n**Floor 15: The Cold Store**\n- **Feel:** the Builders' machine memory. Server rows like cornfields, cooling towers, cable jungles, frost, blue light.\n- **Hub:** the Warm Room.\n- **Villages:** Rack 9, the Cooling Plant, Tape Library, Fibre Junction.\n- **Camps:**\n  - the Cable Jungle (the Cable Mother and Cable Crawlers)\n  - the Cooling Towers (the Fan Wraith King)\n  - the Tape Library (the Backup)\n  - the Firewall (the Firewall)\n  - the Core (the Recorder; floor boss)\n- **Landmarks:** the Frozen Server, the Blinking Light, the Big Red Switch (don't).\n- **Temple:** a chapel of the Absence, an empty room.\n- **Story:**\n  - The Recorder plays you the Builders' last message.\n  - You learn that fans are fuel.\n  - Rattle remembers.\n\n### Act Six: the Network Core (Floors 16–18)\n*The machine and the man behind it.*\n\n**Floor 16: The Transmitter**\n- **Feel:** a forest of broadcast masts and satellite dishes, control desks the size of football pitches, cables like rivers, a signal you can see.\n- **Hub:** the Engineers' Canteen.\n- **Villages:** Dish Field, Relay Town, the Fuse Room, Uplink.\n- **Camps:**\n  - the Dish Array (the Static Men)\n  - the Censor's Office (the Censor)\n  - the Ratings Room (the Ratings Ghouls)\n  - the Teleprompter (the Teleprompter)\n  - the Gallery (the Director; floor boss)\n- **Landmarks:** the Big Mast, the Dead Air Zone, the Live Light.\n- **Temple:** the Mother of Static's Transmitter Chancel.\n- **Story:** the off-air engineer, Dex's choice, and the sabotage.\n\n**Floor 17: The Host's House**\n- **Feel:** a perfect sitcom suburb from fifty years ago: the Host's childhood street, his school, his first studio, trophy rooms, mirror halls. Everything is a set built from his memories.\n- **Hub:** Main Street.\n- **Villages:** Elm Street, the School, the Diner, the Drive-In.\n- **Camps:**\n  - the Fan Club (the Fan Club President and the Zealots)\n  - the Mirror Maze (the Stand-In)\n  - the Runner-Up's House (Last Season's Runner-Up)\n  - the Trophy Room (the Mother)\n  - the Studio (the Host; floor boss)\n- **Landmarks:** the House, the Drive-In Screen, the Mirror Maze.\n- **Story:** the Host was a contestant who won, and winning is how you become the Host.\n\n**Floor 18: The Floor That Doesn't Exist**\n- **Feel:** the Builders' control room. Bare concrete going on forever, impossible stairs, huge silent machines, a white sky that's a ceiling, every god's empty plinth. Smaller than it should be, quieter than anything.\n- **Hub:** none. There is no town.\n- **Camps:**\n  - the Wardens' Gate (the Warden and the Maintainers)\n  - the Echo Hall (the First Contestant)\n  - the Builders' Seat (the Absence; final)\n- **Landmarks:** the Control Room, the Stack's Heart, the Door.\n- **Ending:** three ways out, built from your choices about gods, factions, fans and the clubs:\n  1. **Become the Host.**\n  2. **Turn it off,** with the Off-Air Society.\n  3. **Let the gods out:** free the appetites and let the world deal with them.\n\n---\n\n## 6. What the game needs for all this\n\n**Systems:**\n- faction reputation and raids\n- territory changes\n- Ratings Week battles\n- the contestant leaderboard\n- companions and parties (same Mob system, friendly team)\n- god favour, boons, tithes and Grudges\n- temples\n- the club tiers with Marks\n- off-camera tracking (the camera poles)\n- passwords\n- the gambling den\n- the bounty board\n\n**Content:**\n- Floors 10–18 (data, districts, textures)\n- each faction's new units\n- the 16 named rivals\n- the gods' statues and priests\n- the club interiors (one kit, dressed per floor)\n\n**Characters to generate:** see `TRIPO_CAST_3.md`.\n**Props to generate:** see `TRIPO_DEEP_PROPS.md`.\n\n---\n\n## 7. Discovery: camps, contestants, secrets and puzzles (every floor)\n\nOn floors this big, finding things *is* the game. Every floor gets these, scaled to its size (roughly one of something every 120 m in any direction).\n\n| Kind | Per floor (Floor 4 → Floor 18) | What it is |\n|---|---|---|\n| Boss camps | 4–5 | A faction's stronghold, pushed far out |\n| Outposts | 12 → 30 | Chains of small camps on the way, in varied patterns |\n| **Contestant camps** | 3 → 8 | A crew's tents and fire. Some trade, heal or recruit; the Scavengers ambush you; some camps are already dead when you get there |\n| **Hidden encampments** | 2 → 6 | Not on any map, behind a puzzle. Lore, loot, and a piece of the story |\n| Points of interest | 10 → 25 | Shrines, wrecks, lookouts, hideouts, nests, sights that belong to the nearby camps |\n| Summits and towers | 6 → 14 | Height, and a stash for whoever climbs |\n| The Back Door | 1 | The club's hidden entrance (see section 4) |\n\n### Hidden encampments\n\nEach one is a small camp or chamber (a dead crew's last stand, a Builders' maintenance room, a god's forgotten shrine, a previous season's set), sealed by a **puzzle**. Its **clues** are elsewhere on the floor: notes on field-notes boards, a drowned contestant's bracelet, graffiti, a song on the club jukebox.\n\n| Puzzle | How it plays | Clue |\n|---|---|---|\n| **Symbol lock** | Press symbols in the right order (like the Floor 1 ticket machine) | Three scraps, each with a symbol and a number or time |\n| **Lamps in order** | Light four braziers in the right order; wrong order and they all go out | A rhyme or a stained-glass picture |\n| **Lever pattern** | Set five levers up or down | A punched card, a tally of marks |\n| **Password door** | Say the word at a speaking grille | A word underlined in someone's journal |\n| **Statues facing** | Turn three statues to face the right landmarks | \"They all looked at the …\" |\n| **Hidden switch** | Something that isn't quite right (a crooked painting, a loose brick) opens a way down | Graffiti points at it |\n\n**Rewards:**\n- a **lore page** (see below)\n- a stash\n- sometimes **god favour** (a forgotten shrine)\n- sometimes club **Marks**, because the club pays for secrets\n\n### Lore pages: the story told in pieces\n\nThere's a set of pages per act. Collect them and the hidden story assembles in your journal:\n- **Act One (Floors 1–3), \"The Builders' Mark\":** the symbol, the seals, the building that was here first.\n- **Act Two (Floors 4–6), \"Past Seasons\":** contestants before you, bracelets, the dates that don't make sense.\n- **Act Three (Floors 7–9), \"What They Sealed\":** each god as an appetite, and why the Builders locked them in.\n- **Act Four (Floors 10–12), \"How the Show is Made\":** fans are measured, then harvested.\n- **Act Five (Floors 13–15), \"The Archive\":** the Builders' own records, and the first contestant.\n- **Act Six (Floors 16–18), \"The Host\":** who he was, and what winning means.\n\nFinding enough pages unlocks extra dialogue with Marta, Mags and the Off-Air Society, and is required for the **truth** endings of bosses (like Pylon's).\n"}, {"id": "voice", "name": "Voice scripts", "path": "prototype/voice/SCRIPTS.md", "md": "# Downstairs — voice recording scripts\n\nRecord each line as a separate file named exactly as shown (`.wav` or `.mp3`, mono is fine). The game can play your recordings instead of the synthetic voices, and apply a different voice effect per character (pitch, formant, growl, robot, echo) so one person can play everyone.\n\nTips: record in a quiet room, ~15 cm from the mic, leave half a second of silence at each end. Act it big; the effects work better on clear, energetic reads.\n\n## Characters and dialogue\n\n### Marta Vance  (`marta`) — suggested effect: none (Irish accent if you can)\n\n- `marta_01` — You found the Exit Sign. Glowing, isn’t it? It doesn’t go anywhere. It never did. The real way down is the stairwell door behind me, and it’s chained shut. Sergeant Pylon holds the key and charges a toll in cones. Kill him, or make him a deal. Pickles has been sniffing around his goblins.\n- `marta_02` — Bathrobe and a lighter. You must be fresh off the stairs. Breathe. Everyone gets the same broadcast and everyone ends up here, in Stairwell Camp. It’s the only safe ground on this floor. Monsters won’t come inside the lights.\n- `marta_03` — Get stronger before you go wandering. The goblin packs near camp are weak; the ones further out are not. Kill, loot, level up. Eat and drink or you’ll fade. Craft what you can’t buy. And when you’re ready, the stairwell behind me goes down. It’s chained. Ask me about that later.\n- `marta_04` — Eighteen floors. Every contestant thinks they’ll be the one. The network says people have finished, but nobody’s ever met one. I want to know why. Get down there and find out, and if you can, send word back.\n- `marta_05` — It will be. Come back when it is.\n- `marta_06` — The network did. They like a toll gate. Makes for good television. Pylon just took the job.\n- `marta_07` — Goblins out of Pylon Point raid our water line. Two ways I can use you. Thin out their packs, or find out where our water’s actually going. The Ramp Spiral, maybe, or that bus that never stops burning.\n- `marta_08` — Ha. You’ve got a face people want to help. Don’t waste it. Here: two potions and some water. Don’t tell the others.\n- `marta_09` — Supplies are for people who’ve earned them. Go earn them.\n\n### Pickles  (`pickles`) — suggested effect: pitch +4, fast\n\n- `pickles_01` — Twelve! Lovely, lovely plastic. Right, the reasons. Pylon’s planning to cone off the whole stairwell. Toll forever. No one in, no one out, unless you pay in cones. I can make him an offer he likes. Or you can make him an example.\n- `pickles_02` — You did it! Pylon’s cones are on the open market! I mean, I have them. Here, a crown. Made it myself. From him.\n- `pickles_03` — Pickles’ Junk! Everything’s junk! Some of it’s good junk!\n- `pickles_04` — Reasons! Business reasons! Bring me twelve chunks of cone plastic and I’ll tell you the reasons. The goblins drop it. Mostly when they’re on fire.\n- `pickles_05` — Still thinking? The offer stands. A hundred gold and the goblins love you. Or no gold, and one dead sergeant.\n\n### Benchwright Bo  (`bo`) — suggested effect: pitch −3, gravel\n\n- `bo_01` — My box! And springs! You lovely lunatic. From now on you get the friends-and-family rate. Twenty percent off every table.\n- `bo_02` — Bo’s Benches. Tables built to last, delivered to your Crash Pad. Mostly in one piece.\n- `bo_03` — Each table makes its own things. Sixty recipes apiece, five tiers. Upgrade a table to unlock the next tier. And put tables next to each other: an Alchemy Lab beside a Boom Bench lets you brew firebombs. Tables talk to each other. Not literally. Mostly.\n- `bo_04` — My toolbox. Dropped it out by the Ramp Spiral, and some goblin nicked the springs out of it. Bring me the box and three springs and I’ll give you the friends-and-family rate.\n\n### Wickley  (`wickley`) — suggested effect: pitch +2\n\n- `wickley_01` — Well? You tasted both. Grandma Gristle’s broth is old magic, all bones and grudges. Auntie Brine’s chowder is new money, salt and spite. One of them has to lose or the whole Row goes up in toxic fog every Dinner Bell. Whose pot do we spoil?\n- `wickley_02` — The Cone King is dead?! The goblins are already crowning a new one out back. Doesn’t matter. The stairs are open. Go on, before someone charges you a toll.\n- `wickley_03` — Welcome to Soup Row! Best soup on Floor 3, worst soup on Floor 3, depends which day. I’m Wickley. What’ll it be?\n- `wickley_04` — Hags. Two families, two kitchens, one feud. Every Dinner Bell their pots boil over and the fog comes rolling up the alleys. Taste both and tell me which one we ruin.\n- `wickley_05` — Under the Cone Cathedral, south end. The Cone King sits on the stairs like a hen on an egg. He was Pylon’s boss, and he’s heard what happened to Pylon.\n\n### Brother Ash  (`ash`) — suggested effect: pitch −2, soft echo\n\n- `ash_01` — You saw her. The Bulb Queen, on her chandelier. She isn’t cruel. She’s hungry for light, and we keep the lanterns lit all night. I could make her an offering, a bulb that never burns out. Or you could end her.\n- `ash_02` — It is done. The district is darker tonight, and quieter. Take her filament. Keep it lit for her.\n- `ash_03` — Peace, traveller. I keep the Last Light, the lantern at the heart of the Row. Lately the moths come for it every night.\n- `ash_04` — They follow their Queen, and she lives in the Lamp Market to the north-east. Find her. See what she is. Then we decide.\n\n### Judge Vrask  (`vrask`) — suggested effect: pitch +5, glassy shimmer\n\n- `vrask_01` — Ah. A contestant. I am Judge Vrask, critic for the Soup District cook-off. I have come a very long way to be disappointed. Impress me.\n- `vrask_02` — Hm. *He tastes it, slowly.* Grease. Despair. A hint of rat. It is… actually remarkable. Five stars. The Ascendancy will hear your name.\n- `vrask_03` — *The judge’s shell flickers.* …You are perceptive. Yes. I am a guest. We all watch, out there, nine nations of us. And on the sixth floor, some of us stop watching and start hunting. You did not hear this from me.\n- `vrask_04` — I am a judge. Of soup. Please stop staring at my shell.\n\n### Bix  (`bix`) — suggested effect: none\n\n- `bix_01` — Bix. Bo’s cousin. The soup branch. Tables, delivered greasy.\n\n### Intern Pip  (`pip`) — suggested effect: pitch +3, nervous\n\n- `pip_01` — Oh! A new one! Hi! Welcome to the Network Orientation Centre! I’m Pip, I’m an intern, I’m not paid, I’m also technically a contestant. Before you go down to Floor One I have to make sure you know how to, um, not die. Immediately.\n- `pip_02` — You drank, you unboxed, you hit a dummy! You’re a natural. Now the fun part: the practice arena through that door. Cardboard goblins. They hit back, but softly. Watch the floor: when red fills up under them, step out of it, dodge with V, or tap F as it fills to parry.\n- `pip_03` — Look at you! Okay, last thing: everyone wakes up with no class. You get to choose a race and a class at the Hall of Callings on Floor Three. Until then it’s you, that pipe, and your lighter. The stairs down are at the end of the hall. Good luck. Please don’t die, the paperwork is awful.\n- `pip_04` — Under your old building! Every stairwell on Earth leads here now. This is the Landing. It’s safe. Below this, nothing is safe. That’s the show!\n- `pip_05` — Three things! One: you get thirsty and hungry down here, so drink from the fountain. Two: I left you a Welcome Box, press I to open your bag and click it. Three: hit a training dummy with your pipe, left click, a few times. Then come back to me.\n- `pip_06` — Red is health, blue is mana, green is stamina for sprinting and heavy swings. The two little bars are hunger and thirst. Top right is your map, M for the big one. L shows your quests. And the yellow bar at the very bottom is experience.\n\n### Registrar Odessa  (`callings`) — suggested effect: echo (big hall)\n\n- `callings_01` — Welcome back, …. The Hall only records a calling once. Your guild hall is across the square; they’ll have work for you.\n- `callings_02` — Welcome to the Hall of Callings. Every contestant who reaches the third floor gets to choose what they are: a race and a class. Twelve schools of magic and eight trades. Choose carefully. It’s permanent, and the audience is watching.\n- `callings_03` — F
